# Publishes the committed, built page (dist/) to GitHub Pages.
#
# It deploys what's in dist/ as committed, not a fresh build, so what's
# published is exactly what was reviewed (and its version stamp names
# the commit it was built from). Rebuild and commit dist/ to publish a
# new version. Drafts (dist/*-drafts.html) aren't published.
name: Pages

on:
  push:
    branches: [main, master]
    paths: [dist/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the published pages
        run: |
          mkdir _site
          for f in dist/*.html; do
            case "$f" in *-drafts.html) ;; *) cp "$f" _site/ ;; esac
          done
          ls -l _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
