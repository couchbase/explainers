# The third n1k1 explainer: one filter, one row, two lanes. n1k1 runs an
# expression in its byte lane when it can, and falls back to cbq's
# boxed lane when it can't. Here's 01-query's filter run both ways on
# the same row, stage by stage, with what each lane leaves on the Go
# heap; then all 20 rows; then what boxing does to the totals. No
# simulation: each step moves `at`, one of the diagram's states
# (states.js). The numbers are measured, by ../lib/tools/boxed-golden,
# which runs both lanes with n1k1's own code and counts their
# allocations with Go's heap profiler. Every number in the text is
# checked by `expect`.

sources: [n1k1, n1k1-query, jsonparser]
draft: true
title: "Boxed or bytes: where the garbage goes"
subtitle: >-
  One filter, run two ways on the same row. cbq's evaluator boxes the
  row into Go values, and leaves them on the heap; n1k1's byte lane
  points into the row's own bytes, and leaves nothing. Here's each
  allocation, measured, and what boxing does to a number on the way.
audience: People who build or study database internals

chapters:

  # ------------------------------------------------------------------
  - id: one
    title: "One filter, one row"
    color: query
    steps:

      - id: filter
        view: { at: start, target: expr }
        code: [expr.tree]
        expect: ["fact:hero.total.bytes=210.00"]
        text: |
          In the first explainer, n1k1 tested each order with
          [[this filter]], `orders.total > 200`. At setup, n1k1 turned
          the filter into native code that works on JSON bytes.

          n1k1 can't do that for every expression, though. For one it
          can't, it falls back to cbq's own evaluator, which works on
          boxed values: Go objects built from the JSON.

          So here's the same filter, on the same row, order-1003 (its
          total is 210.00), run both ways.

      - id: lanes
        view: { at: lanes, target: lane.boxed }
        code: [design.exprs]
        text: |
          On the left is [[the boxed lane]], cbq's Evaluate, as n1k1's
          fallback runs it. On the right is the byte lane, n1k1's
          native code.

          Each lane goes through the same four stages: get the doc,
          find the total, compare it with 200, and give the answer.
          Under each lane is the Go heap. Everything a lane allocates
          for this row lands there, as a block as wide as its bytes.

  # ------------------------------------------------------------------
  - id: stages
    title: "Stage by stage"
    color: plan
    steps:

      - id: boxed-convert
        view: { at: boxed.1, target: boxed.0 }
        code: [convert, parsed.new]
        expect: ["fact:hero.convert.bytes=1360", "fact:hero.parsed.bytes=480", "fact:hero.id.count=4", "fact:hero.id.bytes=192"]
        text: |
          To evaluate anything, cbq needs [[the row as one value]]. So
          n1k1's ConvertVals builds one: a map for the row, room in it
          for "orders", and a parsedValue (480 bytes) that wraps the
          doc's bytes, to parse them later. Then an annotatedValue,
          with a map for its META, and the doc's id, parsed and boxed:
          4 allocations, 192 bytes, for an id this filter never reads.

          That's 1,360 bytes before the filter looks at anything.

      - id: bytes-doc
        view: { at: bytes.1, target: bytes.0 }
        text: |
          The byte lane builds nothing. The doc is already in
          [[register 0]], as a slice of the record buffer.

      - id: boxed-find
        view: { at: boxed.2, target: boxed.1 }
        code: [parsed.field]
        expect: ["fact:hero.evaluate.bytes=304", "fact:hero.total.type=value.intValue", "fact:hero.total.boxed=210"]
        text: |
          Now `orders.total`. The parsedValue scans the doc's bytes for
          "total", with a scanner of its own, and parses what it finds
          into [[a boxed number]], another 304 bytes in all.

          To be fair to cbq, it's lazy too. Its parsedValue doesn't
          parse the whole doc. It scans for "total", much as jsonparser
          does, and parses only what it finds. Its cost is in the boxes
          it builds around the bytes, not in parsing them.

          Notice what it made: an intValue, 210. The `.00` is gone.
          We'll come back to that.

      - id: bytes-find
        view: { at: bytes.2, target: bytes.1 }
        code: [path.get]
        expect: ["fact:hero.total.range=55:61"]
        text: |
          The byte lane finds the total with jsonparser, which returns
          [[a slice]] of the doc's own bytes, 55 to 61: `210.00`, just
          as it's written.

      - id: boxed-compare
        view: { at: boxed.3, target: boxed.2 }
        expect: ["fact:hero.compare.bytes=16"]
        text: |
          cbq compares its two boxed numbers, 210 and 200, through
          their Compare methods, which allocate [[a working value]],
          16 bytes. The answer is a boolValue, true.

      - id: bytes-compare
        view: { at: bytes.3, target: bytes.2 }
        code: [cmp.static]
        text: |
          The byte lane parses the 6 bytes into a float64, 210, which
          lives [[on the stack]], and compares it with 200, a float64
          it parsed once, at setup.

      - id: boxed-answer
        view: { at: boxed.4, target: heap.boxed }
        expect: ["fact:hero.boxed.allocs=15", "fact:hero.boxed.bytes=1680"]
        text: |
          Last, the boxed answer is written back as JSON, `true`, into
          a buffer that's reused, so that's free.

          In all, the boxed lane left 15 allocations and 1,680 bytes
          on [[the heap]], for one row. (The profiler groups a few
          tiny allocations into one block, so there are fewer blocks
          than allocations.)

      - id: bytes-answer
        view: { at: bytes.4, target: heap.bytes }
        expect: ["fact:hero.native.allocs=0"]
        text: |
          The byte lane's answer is a `true` that it made once, at
          setup, and hands out for every row that passes.

          In all, the byte lane left [[nothing]] on the heap: 0
          allocations.

  # ------------------------------------------------------------------
  - id: many
    title: "Twenty rows"
    color: push
    steps:

      - id: twenty
        view: { at: twenty, target: tally }
        expect: ["fact:rows=20", "fact:rows.same=true", "fact:rows.boxed.allocs=328", "fact:rows.boxed.bytes=33824", "fact:rows.native.allocs=0", "fact:rows.boxed.min=14", "fact:rows.boxed.max=18"]
        text: |
          Over all 20 orders, the two lanes give the same answers.

          [[The boxed lane]] leaves 14 to 18 allocations per row, 328
          in all, and 33,824 bytes, which Go's garbage collector must
          then find and free. The byte lane leaves 0, row after row.

          That's the whole reason for the byte lane. The work per row
          is small either way. It's the garbage that adds up.

  # ------------------------------------------------------------------
  - id: group
    title: "GROUP BY"
    color: plan
    steps:

      - id: tables
        view: { at: group.1, target: group.cbq }
        code: [cbq.group, cbq.sum, op.group, agg.sum]
        text: |
          Aggregates go the same way. Take `SELECT customer,
          SUM(total), COUNT(*) FROM orders GROUP BY customer`, and look
          at how each engine keeps its groups.

          [[cbq keeps a Go map]]. For each row, it evaluates the
          group's key, boxes it into a map, and marshals that to a
          string, to look the group up. Each aggregate's running value
          is a boxed value, and for each row, the aggregate's
          CumulateInitial makes a new one, to replace the last.

          n1k1 keeps an rhmap of bytes. A group's key is its key's
          bytes, and its state is 16 bytes: SUM's running total, a
          float64, in 8, and COUNT's, in 8 more. A row's update writes
          new bytes over the old.

      - id: sweep
        view: { at: group.2, target: group.heap }
        expect: ["fact:group.cbq.perRow=27", "fact:group.cbq.perRowBytes=2140", "fact:group.cbq.key.bytes=1160", "fact:group.cbq.sum.bytes=650", "fact:group.cbq.count.bytes=330", "fact:group.n1k1.setup=102", "fact:group.n1k1.perRow=0", "fact:group.groups=4", "fact:group.same=true", "fact:group.alice.sum=899.3900000000001"]
        text: |
          Here are the 20 rows, one at a time. On the left, each row
          leaves three things on [[the heap]]: the key it made to find
          its group (about 1,160 bytes), and its group's old SUM and
          COUNT, replaced by new boxed ones (with what those steps
          made, about 650 and 330 bytes). The bar grows by each one as
          it lands: about 27 allocations and 2,140 bytes a row, on top
          of boxing the row itself.

          On the right, n1k1 makes 102 allocations once, at setup, for
          its map and buffers, and then 0 a row. Each row's update
          rewrites its group's bytes in place.

          Both end with the same 4 groups and the same sums, down to
          alice's 899.3900000000001: both add float64s.

  # ------------------------------------------------------------------
  - id: order
    title: "ORDER BY"
    color: push
    steps:

      - id: cbq
        view: { at: order.1, target: others }
        code: [cbq.order]
        expect: ["fact:order.cbq.SortKey.count=5.8", "fact:order.cbq.SortKey.bytes=570", "fact:order.cbq.SortCompare.count=3.4", "fact:order.cbq.SortCompare.bytes=50"]
        text: |
          ORDER BY follows the same pattern, and we've
          [[measured it]] the same way: `ORDER BY total DESC`, over the
          20 orders.

          cbq evaluates each row's sort key and keeps it on the row as
          a boxed copy: 5.8 allocations, about 570 bytes a row. Its
          compares, with Collate, add 3.4 more, about 50 bytes.

      - id: n1k1
        view: { at: order.2, target: others }
        code: [op.order]
        expect: ["fact:order.n1k1.setup=94", "fact:order.n1k1.perRow=1", "fact:order.n1k1.push.bytes=24"]
        text: |
          n1k1 copies each row into [[its sort heap's bytes]], once:
          94 allocations at setup, then 1 a row.

          And that one is telling. It's 24 bytes, Go itself boxing the
          row's []byte header, to pass it to container/heap's Push,
          which takes an `any`. Even a byte lane boxes, where Go's
          interfaces make it.

  # ------------------------------------------------------------------
  - id: join
    title: "JOIN"
    color: push
    steps:

      - id: cbq
        view: { at: join.1, target: others }
        code: [cbq.hashjoin]
        expect: ["fact:join.cbq.Build.bytes=660", "fact:join.cbq.Probe.bytes=740", "fact:join.cbq.Joined.count=13", "fact:join.cbq.Joined.bytes=1140"]
        text: |
          JOINs, too. Here's a hash JOIN: orders with their customers,
          on `o.customer = c.id`.

          cbq puts each order in [[its hash table]], marshaling the
          boxed key to JSON just to hash it: about 660 bytes an order.
          Looking up each customer costs about 740 more. And for each
          match, it makes a new joined value: 13 allocations, about
          1,140 bytes.

      - id: n1k1
        view: { at: join.2, target: others }
        code: [op.hashjoin]
        expect: ["fact:join.n1k1.setup=93", "fact:join.n1k1.perRow=0", "fact:join.rows=20 20"]
        text: |
          n1k1 keys [[an rhmap]] with the join key's canonical bytes,
          and a joined row is just the two rows' slices, side by side:
          93 allocations at setup, then 0 a row.

          Both make the same 20 joined rows.

  # ------------------------------------------------------------------
  - id: fidelity
    title: "What boxing changes"
    color: out
    steps:

      - id: totals
        view: { at: table, target: table }
        expect: ["fact:changed=6", "fact:changed.list=129.50>129.5,210.00>210,22.0>22,46.0>46,96.0>96,245.0>245"]
        text: |
          Boxing also changes things. A boxed number keeps its value,
          but not its text. Of the 20 totals, 6 come back different
          once boxed and written out again: [[these]].

          The byte lane never boxes them, which is why the first
          explainer's output said 210.00.

  # ------------------------------------------------------------------
  - id: which
    title: "Which lane?"
    color: neutral
    steps:

      - id: stats
        view: { at: fallback, target: fallback }
        expect: ["fact:lanes.native.expr=false", "fact:lanes.boxed.expr=expr: 1/2 exprs boxed · 20 boxed evals"]
        text: |
          Which lane did your query take? n1k1's stats say.

          Our filter is all native, and [[its stats]] say nothing about
          expressions. But STR_TO_MILLIS, for one, isn't native yet, so a
          query that uses it says "1/2 exprs boxed · 20 boxed evals":
          one of its two expressions ran in the boxed lane, once for
          each of the 20 rows.

      - id: end
        view: { at: fallback }
        text: |
          So n1k1 runs each expression in the byte lane when it can,
          deciding once, at setup. For the rest, cbq's boxed lane is
          there, slower but complete, and n1k1's tests check every
          native expression against it.
