# n1k1: SQL++ for local files, and the query engine inside it.
title: "Inside n1k1: a SQL++ engine for local files"
# the short name in each explainer's header, linking up to the topic's index
label: "n1k1"
# for the topic's index page
subtitle: >-
  How n1k1 runs SQL++ over a directory of JSON files: files become
  keyspaces, cbq's planner makes the plan, and n1k1's engine pushes
  rows up through it as raw JSON bytes, copying them only where it
  must.
