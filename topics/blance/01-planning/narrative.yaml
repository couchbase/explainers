# The first blance explainer: how its planner places partitions. No
# simulation: each step moves `at` (a frame of a scenario, the
# partition map after that many of the planner's decisions) or changes
# the `panel`. Every number in the text is checked, by
# `expect: ["fact:<name>=<value>"]`, against the scenarios as run by
# the port of blance's planner, which the golden cases check against
# the real blance.

sources: [blance, cbgt]
next: 02-moving
title: "Inside blance: how partitions are assigned to nodes"
subtitle: >-
  blance is a library that assigns partitions to nodes. How does it
  work and what happens when nodes join and leave a cluster?
audience: Engineers who build or run distributed systems

# scenes for the index pages (npm run showcase makes their pictures)
showcase:
  - step: join--balanced
    rect: [29, 3, 617, 595]
    caption: "The partition map after node d joins: 2 primaries and 2 replicas each"

chapters:

  # ------------------------------------------------------------------
  - id: map
    title: "The partition map"
    color: map
    steps:

      - id: intro
        view: { target: board.title, focus: board }
        code: [blance.PartitionMap]
        expect: ["fact:fresh.end.counts=a3/3 b3/2 c2/3"]
        text: |
          Many distributed systems split their data into partitions,
          or shards, and place each partition on some of the cluster's
          nodes: a primary on one node, replicas on others.

          [blance](https://github.com/couchbase/blance) is a small,
          open-source library written in Go.

          It helps compute [[a partition map]] for distributed systems.
          On the right, we see an example
          partition map with eight partitions (0 thru 7) assigned across
          three nodes (a, b, c).

          First, let's go over how to read this partition map; then, how
          blance computes it.

      - id: model
        view: { target: row.0 }
        code: [blance.PartitionModel, cbgt.model]
        text: |
          The partition map has a row per partition and a column per
          node.

          In a cell, a chip represents the state of a partition
          on that node, such as primary or replica.

          These states are defined by the app:
          blance knows nothing about what primaries or replicas really mean,
          just that these states have a priority and that the app specifies
          how many nodes each state should have.

          In this case, we specify that [[each partition]]
          ought to have 1 primary node and ideally 1 replica node,
          and we see that in the diagram on the right.

      - id: primary
        view: { target: chip.P }
        expect: ["fact:fresh.end.counts=a3/3 b3/2 c2/3"]
        text: |
          A [[P]] chip represents an assignment of a partition to a primary node.

          Partition 0's primary is node a.

          To blance, the primary is just the state
          with the highest priority of 0.

      - id: replica
        view: { target: chip.R }
        text: |
          An [[R]] chip represents a replica: another copy of the primary's data, on
          another node, ready to take over (or be promoted to primary) if the
          primary node is lost.

          Partition 0's replica is on node c.

          A replica is never assigned to the same node as the primary node as
          that would be no help if the primary node fails.

      - id: tallies
        view: { target: tally.a, focus: tallies }
        expect: ["fact:fresh.end.counts=a3/3 b3/2 c2/3"]
        text: |
          Under each node's column are the node [[tallies]]: how many
          primaries (P) and how many replicas (R) the node holds, shown
          as two bars and their counts.

          Node a holds 3 primaries and 3
          replicas, node b 3 and 2, and node c 2 and 3.
          That's about as even or balanced as eight
          partitions on three nodes can be.

          Keeping these tallies even or balanced, so
          that no node holds many more paritions than the other nodes, is what
          blance's planner tries to achieve.

      - id: call
        view: { at: fresh.prev, target: node.a, focus: board }
        code: [blance.PlanNextMapEx]
        expect: ["fact:fresh.prev.counts=a0/0 b0/0 c0/0"]
        text: |
          So how does blance compute the partition map?

          Its `PlanNextMapEx()` API takes the current partition map,
          all the nodes, the nodes joining and the nodes leaving, the
          model and some options, and deterministically computes the next partition map.

          Let's start from nothing: the current partition map has no
          partitions assigned yet, and [[nodes a, b and c]] are all
          joining.

      - id: gist
        code: [blance.sortPass]
        text: |
          Briefly, here's what `PlanNextMapEx()` does: for each state (i.e., primaries, then replicas), the
          planner does two things. First, it sorts the partitions.

          Then, it runs through those sorted partitions in a single pass, assigning
          each partition to a node with the lowest score
          at that point, and it continually updates the score tallies along the way.

          Let's walk through it.

  # ------------------------------------------------------------------
  - id: primaries
    title: "Primaries first"
    color: primary
    steps:

      - id: phase
        view: { at: fresh.primaries~phase, target: phase }
        code: [blance.states]
        text: |
          The planner works state by state, starting with most important state first.

          So it starts with assigning primaries, and the top-left corner of
          the partition map shows this by flipping to [[assigning primaries]].

      - id: sort
        view: { at: fresh.primaries~rules, target: sort.rules }
        code: [blance.sortPass, blance.partitionOrder]
        text: |
          First, the sort, and [[the sorting rules]].

          The planner sorts
          partitions first related to nodes that are leaving; then by
          partitions not yet on any node that's joining; then
          partitions already on a node that's joining, and then
          by heavier partitions first, and then lastly by
          partition name.

          On the right, you can see pseudocode for the sorting's "ORDER BY".

      - id: sort-groups
        view: { at: fresh.primaries~keys, target: row.0 }
        expect: ["fact:fresh.primaries.group1=8"]
        text: |
          Under each partition's name, the number it gets from the
          sorting rules appears.

          At this point in our example, no partitions are assigned to
          any node, so every partition gets a 2, not yet on a joining
          node: [[partition 0]] included.

      - id: sort-done
        view: { at: fresh.primaries~clear, target: row.0 }
        expect: ["fact:fresh.primaries.order=0,1,2,3,4,5,6,7"]
        text: |
          With every partition getting the same number, the sorting will leave
          the partitions in name order: so [[partition 0]] is sorted first.

      - id: states
        view: { at: fresh.1~row, panel: score, target: scores, focus: strip }
        code: [blance.assign]
        expect: ["fact:fresh.1.partition=0", "fact:fresh.1.state=primary"]
        # (the scores come with the first decision)
        multi: true
        text: |
          The planner next loops through
          those sorted partitions. For each sorted partition,
          the planner will compute a score for every node, and the lowest scoring node
          wins or will be assigned the partition in the current state
          (primary).

          We'll first score the nodes for partition 0's primary, in the area for
          [[the planner's scores]].

      - id: first
        view: { at: fresh.1, target: winner, focus: strip }
        code: [blance.nodeLess]
        expect: ["fact:fresh.1.a=0.0000", "fact:fresh.1.winner=a"]
        text: |
          Under the partition map, the planner calculates each node's
          score, shown in each node's column. Nothing is placed anywhere
          yet, so every node scores 0.

          A tie goes to the node that comes
          first in the node list: so node [[a]] wins and
          is assigned to be partition 0's primary.

          So a P chip appears in node
          a's column.

      - id: next
        view: { at: fresh.2~row, target: scores, focus: strip }
        expect: ["fact:fresh.2.partition=1"]
        text: |
          Next, we move onwards to assigning partition 1's primary, so
          [[the scores]] at the bottom are reset to 0.

      - id: count
        view: { at: fresh.2~a.count, target: bar.a, focus: col.a }
        code: [blance.nodeScore]
        expect: ["fact:fresh.2.a.count=1"]
        text: |
          Node a first, and the main term: how many partitions the node
          already holds in this state. Node a holds one primary,
          partition 0's, so [[node a's score bar]] rises to 1.

      - id: spread
        view: { at: fresh.2~a.spread, target: bar.a, focus: col.a }
        text: |
          Then [[a hatched part]], which is how many partitions
          with the same primary node the node
          already backs up, ÷ the number of partitions. For a primary
          there's no primary node yet, so it counts every primary
          assigned so far in this pass, 1/8 each, and only node a has
          one.

      - id: fill
        view: { at: fresh.2~a.fill, target: bar.a, focus: col.a }
        expect: ["fact:fresh.2.a.pre=1.1251"]
        text: |
          And a tie-breaker bump, too small to see: 0.001 × all the
          partitions on the node ÷ the number of partitions, 0.0001 for
          node a.

          Node [[a's final score]] is 1.1251.

      - id: count-pick
        view: { at: fresh.2, target: winner, focus: strip }
        expect: ["fact:fresh.2.b=0.0000", "fact:fresh.2.c=0.0000", "fact:fresh.2.winner=b"]
        text: |
          Then we score node b, and then node c, the same way: nodes b and c
          hold nothing, so both score 0.

          The lowest score wins: nodes b
          and c tie at 0 score, and node [[b]] is first in the list, so node b
          wins.

      - id: round
        view: { at: fresh.primaries, panel: none, target: tally.a, focus: tallies }
        # (the primaries done: their scores go as the tallies show)
        multi: true
        expect: ["fact:fresh.primaries.counts=a3/0 b3/0 c2/0"]
        text: |
          And so on, round the nodes: a, b, c, a, b, c, a, b. Eight
          primaries on three nodes...

          At the end, node [[a has 3]] partitions, node b 3, and node
          c 2. Every partition's primary is assigned in a balanced way.

  # ------------------------------------------------------------------
  - id: replicas
    title: "Then the replicas"
    color: replica
    steps:

      - id: replica-phase
        view: { at: fresh.replicas~phase, target: phase }
        text: |
          With every partition's primary assigned, the planner moves
          on to the next state of assigning replica partitions,
          and the corner of the partition map changes too, to
          [[assigning replicas]].

      - id: replica-sort
        view: { at: fresh.replicas~clear, target: row.0 }
        code: [blance.sortPass]
        expect: ["fact:fresh.replicas.order=0,1,2,3,4,5,6,7", "fact:fresh.replicas.group2=8"]
        text: |
          Before assigning the replicas, the planner sorts the
          partitions again, the same way.

          At this point in our example, every partition has been
          assigned with a primary node, so all 8 partitions get a 3, already on a
          joining node, and the sort leaves them in name order:
          [[partition 0]] comes first again.

      - id: greyed
        view: { at: fresh.9~row, panel: score, target: node.a, focus: col.a }
        # (the scores come back with the first replica's decision)
        multi: true
        code: [blance.exclude]
        expect: ["fact:fresh.9.partition=0", "fact:fresh.9.state=replica"]
        text: |
          The replicas start again at partition 0.

          Partition 0's primary is on node a, so [[node a's column]]
          is greyed out as node a is not considered.

          This is because a replica is never assigned to the same node as its primary's node,
          as that would be no help if that primary node failed.

          So the planner doesn't ignores node a for now.

      - id: exclude
        view: { at: fresh.9, target: winner, focus: strip }
        expect: ["fact:fresh.9.partition=0", "fact:fresh.9.b=0.0004", "fact:fresh.9.c=0.0003", "fact:fresh.9.winner=c"]
        text: |
          Nodes b and c hold no replica partitions yet, so they're properly scored.

          Node c has the lowest score of 0.0003 so it wins and becomes the replica
          node for partition 0.
          The tie-breakering factor: 0.001 × all the partitions on the
          node ÷ the number of partitions. This small tie-breaking bump allows the planner
          to favor the emptier node of node c,
          as node [[c]] holds 2 primaries versus node b's 3.

      - id: next-two
        view: { at: fresh.11, target: winner, focus: strip }
        expect: ["fact:fresh.10.partition=1", "fact:fresh.10.a=0.0004", "fact:fresh.10.c=1.0004", "fact:fresh.10.winner=a", "fact:fresh.11.partition=2", "fact:fresh.11.b=0.0004", "fact:fresh.11.a=1.0005", "fact:fresh.11.winner=b"]
        text: |
          Partition 1's primary is on node b, so this time node b's
          column is greyed out. Node a, with no replicas yet, wins at
          0.0004 to node c's 1.0004.

          Then partition 2's primary is on
          node c, and node [[b]], with no replicas yet, wins at 0.0004
          to node a's 1.0005.

      - id: spread
        view: { at: fresh.12, target: winner, focus: strip }
        code: [blance.nodeScore]
        expect: ["fact:fresh.12.partition=3", "fact:fresh.12.b=1.0005", "fact:fresh.12.c=1.1254", "fact:fresh.12.winner=b"]
        text: |
          Partition 3's primary is on node a, too, and node c already
          backs up partition 0, another of node a's primaries. So node c
          gets the hatched 1/8 more.

          That's what the hatched term is
          for: spreading node a's replicas over several nodes, so that
          if node a fails, several nodes share taking over for it, not
          just one.

          Node [[b]] wins, at 1.0005 to node c's 1.1254.

      - id: done
        view: { at: fresh.replicas, panel: none, target: tally.b, focus: tallies }
        # (the replicas done: their scores go as the tallies show)
        multi: true
        expect: ["fact:fresh.replicas.counts=a3/3 b3/2 c2/3"]
        text: |
          The rest of the replicas go the same way.

          Every node ends up
          with 5 or 6 partitions: node a with 3 primaries and 3
          replicas, node [[b with 3 and 2]], and node c with 2 and 3.

      - id: again
        view: { at: fresh.end, target: board.title, focus: board }
        code: [blance.converge]
        expect: ["fact:fresh.iterations=2"]
        text: |
          Then blance does it all again, starting from the partition
          map just computed, up to 10 times, until a pass changes
          nothing.

          In this case, the second pass changes nothing, so the planner
          is done, in 2 passes, with [[the partition map]].

  # ------------------------------------------------------------------
  - id: join
    title: "A node joins"
    color: change
    steps:

      - id: joins
        view: { at: add.prev, target: node.d, focus: col.d }
        text: |
          Next, let's suppose a new [[node d]] joins the cluster.

          What happens?

      - id: join-phase
        view: { at: add.primaries~phase, target: phase }
        text: |
          The planner starts again with
          [[assigning primaries]].

      - id: join-sort
        view: { at: add.primaries~clear, target: row.0 }
        code: [blance.partitionOrder]
        expect: ["fact:add.primaries.order=0,1,2,3,4,5,6,7", "fact:add.primaries.group1=8"]
        text: |
          First, just like before, the sorting of partitions...

          Partitions not yet on node d are sorted first. At
          this point in our example, no partition is on node d yet, so
          every partition gets a sorting value of 2, so the sort leaves the partitions
          in name order: [[partition 0]] comes first.

      - id: order
        view: { at: add.1~a.fill, panel: score, target: bar.a, focus: col.a }
        # (the scores come back with the join's first decision)
        multi: true
        code: [blance.nodeScore]
        expect: ["fact:add.1.partition=0", "fact:add.1.a.pre=3.0008"]
        text: |
          Next, we loop through the sorted partitions.

          We examine partition 0 to consider its primary node, so we score the
          scores. Node a is scored first: node a holds 3 primaries, and before
          stickiness node [[a]] scores 3.0008.

      - id: stickiness
        view: { at: add.1~a.sticky, target: bar.a, focus: col.a }
        expect: ["fact:add.1.a=1.5008"]
        text: |
          But node a holds partition 0's primary now, and staying put
          is worth 1.5, which is the stickiness factor, subtracted
          off the score of the node that already holds the partition
          in this state; so, node [[a]]
          scores 1.5008.

      - id: d-wins
        view: { at: add.1, target: winner, focus: strip }
        expect: ["fact:add.1.b=3.0006", "fact:add.1.c=2.0006", "fact:add.1.d=0.0000", "fact:add.1.winner=d"]
        text: |
          Then node b scores 3.0006, node c scores 2.0006, and node d, holding
          nothing, scores 0.

          Since node d has the lowest score, node [[d]] is assigned to be partition
          0's primary node.

          Put another way, and partition 0's primary is reassigned from node
          a to node d.

      - id: sticky
        view: { at: add.3, target: winner, focus: strip }
        expect: ["fact:add.3.partition=2", "fact:add.3.c=0.5006", "fact:add.3.d=2.0002", "fact:add.3.winner=c"]
        text: |
          Partition 1's primary is also assigned to node d.

          But by partition
          2, node d holds 2 primaries and scores 2.0002, while node c,
          holding partition 2's primary, scores 0.5006: partition 2's
          primary [[stays on node c]].

      - id: primaries-done
        view: { at: add.primaries, panel: none, target: tally.d, focus: tallies }
        # (the primaries done: their scores go as the tallies show)
        multi: true
        expect: ["fact:add.primaries.counts=a2/3 b2/2 c2/3 d2/0"]
        text: |
          As we run through the rest of the partitions,
          the other primaries stay where they are. So, node [[d has 2]]
          primaries, just like every other node.

      - id: join-replica-phase
        view: { at: add.replicas~phase, target: phase }
        text: |
          Then the planner moves onwards to
          [[assigning replicas]].

      - id: replica-sort
        view: { at: add.replicas~keys, target: row.0, focus: board }
        code: [blance.sortPass, blance.partitionOrder]
        expect: ["fact:add.replicas.group1=6", "fact:add.replicas.group2=2"]
        text: |
          The first step, just as before, is sorting the partitions
          again. The partitions not yet on node d will be sorted
          first.

          That is, at this point in our example, partitions 0 and 1 have
          their primaries on node d, so [[partition 0]] and partition 1
          get a 3, already on a joining node, while the other 6
          partitions get a sorting value of 2.

      - id: replica-shuffle
        view: { at: add.replicas~clear, target: row.0, focus: board }
        expect: ["fact:add.replicas.order=2,3,4,5,6,7,0,1"]
        text: |
          So this time the sort changes the order of partitions: [[partition 0]] and
          partition 1 are sorted to the end of the list.

      - id: replica-order
        view: { at: add.9~row, panel: score, target: scores, focus: strip }
        # (the scores come back with the first replica's decision)
        multi: true
        expect: ["fact:add.9.partition=2", "fact:add.15.partition=0", "fact:add.16.partition=1"]
        text: |
          So, we start our pass through the partitions with partition 2, and
          partitions 0 and 1 come last. Time to compute [[the scores]] again.

      - id: replica-d
        view: { at: add.9, target: winner, focus: strip }
        expect: ["fact:add.9.partition=2", "fact:add.9.b=0.5005", "fact:add.9.d=0.0003", "fact:add.9.winner=d"]
        text: |
          Partition 2's replica is on node b, which holds 2 replicas;
          node d holds none, so even with node b's stickiness, node
          [[d]] is assigned to become partition 2's replica.

      - id: replica-stays
        view: { at: add.10, target: winner, focus: strip }
        expect: ["fact:add.10.partition=3", "fact:add.10.b.pre=1.0004", "fact:add.10.d=1.0004", "fact:add.10.b=-0.4996", "fact:add.10.winner=b"]
        text: |
          Partition 3's replica is on node b, too. Node b and node d
          now hold 1 replica each, and both score 1.0004 before
          stickiness. But stickiness takes 1.5 off node b's score, so
          node [[b]] scores -0.4996. This means partition 3's replica stays on
          node b.

      - id: replica-c-d
        view: { at: add.11, target: winner, focus: strip }
        expect: ["fact:add.11.partition=4", "fact:add.11.c=1.5006", "fact:add.11.d=1.0004", "fact:add.11.winner=d"]
        text: |
          Partition 4's replica is on node c, which holds 3 replicas.
          Even with stickiness, node c scores 1.5006, and node [[d]],
          holding 1 replica, scores 1.0004: so, partition 4's replica is
          reassigned from node c to node d.

      - id: replica-b
        view: { at: add.12, target: winner, focus: strip }
        expect: ["fact:add.12.partition=5", "fact:add.12.a=1.5006", "fact:add.12.b=1.0004", "fact:add.12.winner=b"]
        text: |
          Partition 5's replica is on node a, which holds 3 replicas.
          Node b, having given partition 2's replica up,
          holds only 1 partition, so node [[b]] is assigned partition 5's
          replica, reassigned from node a.

      - id: wrap
        view: { at: add.16, target: deciding, focus: strip }
        expect: ["fact:add.13.partition=6", "fact:add.14.partition=7", "fact:add.15.partition=0", "fact:add.16.partition=1"]
        text: |
          Let's run through the remaining partitions:
          [[partition 6]], then partition 7, then lastly,
          partition 0 and 1.

      - id: balanced
        view: { at: add.replicas, panel: none, target: tally.d, focus: tallies }
        # (the replicas done: their scores go as the tallies show)
        multi: true
        expect: ["fact:add.replicas.counts=a2/2 b2/2 c2/2 d2/2"]
        text: |
          The rest of the replicas stay where they are.

          Every node ends with
          [[2 primaries and 2 replicas]].

      - id: in-order
        view: { at: add.unsorted, target: row.0 }
        text: |
          With the plan done, let's view [[the rows]] again in name order.

      - id: moves
        view: { panel: moves, target: moves.total, focus: strip }
        code: [blance.CalcPartitionMoves]
        expect: ["fact:add.moves=10", "fact:add.moved=5"]
        text: |
          Here's a bar chart of moves involved in transitioning
          from the old partition map to the new one (see blance's
          `CalcPartitionMoves()`): [[10 moves]], over 5 partitions.

      - id: optimal
        view: { target: tally.d, focus: tallies }
        expect: ["fact:add.replicas.counts=a2/2 b2/2 c2/2 d2/2", "fact:add.fewest=8", "fact:add.moves=10"]
        text: |
          But this isn't the best partition map possible.

          Node d needs
          [[4 partitions]], 2 primaries and 2 replicas, and each would ideally
          take 2 moves: a partition built on node d, and a partition deleted from
          another node. So, theoretically 8 moves should be enough
          instead of 10 moves. Where do the 'extra' 2 moves
          come from?

      - id: detour-out
        view: { target: row.2, focus: board, trace: "2" }
        expect: ["fact:add.moves.2=add d:replica, del b"]
        text: |
          First, we see that [[partition 2]]'s replica moved from node b to node d.

      - id: detour-back
        view: { target: row.5, focus: board, trace: "5" }
        expect: ["fact:add.moves.5=add b:replica, del a"]
        text: |
          Then [[partition 5]]'s replica moved from node a to node b.

          Maybe we should have just moved partition 5's replica directly to node d instead,
          skipping the intervening hop involving node b?

      - id: detour
        view: { target: tally.b, focus: tallies }
        expect: ["fact:add.prev.counts=a3/3 b3/2 c2/3 d0/0", "fact:add.replicas.counts=a2/2 b2/2 c2/2 d2/2"]
        text: |
          If we had instead just left partition 2's
          replica on [[node b]], that would have meant just overall 8 moves instead of 10.

      - id: greedy
        view: { target: moves.total, focus: strip }
        text: |
          Why does blance find 10 moves instead of 8 moves?

          Its planner is greedy: it assigns one
          partition at a time, with no look ahead.

          When the planner
          decided partition 2's replica, node d held no replicas and
          scored the lowest, and the planner couldn't know that
          partition 5's replica could go to node d
          instead.

          So blance ends up computing [[10 moves]].

  # ------------------------------------------------------------------
  - id: leave
    title: "A node leaves"
    color: change
    steps:

      - id: leaves
        view: { at: remove.prev, target: node.b, focus: col.b }
        text: |
          Now let consider the scenario when [[node b]] leaves or is removed from the cluster.

      - id: drop
        view: { at: remove.0, target: row.4, focus: board }
        text: |
          First, the planner takes node b out of every partition: [[partition 4]] loses its primary, as does partition 7,
          and partitions 3 and 5 lose their replicas.

      - id: leave-phase
        view: { at: remove.primaries~phase, target: phase }
        text: |
          Again, the planner starts with the primaries:
          [[assigning primaries]].

      - id: leave-sort
        view: { at: remove.primaries~keys, target: row.4, focus: board }
        code: [blance.partitionOrder]
        expect: ["fact:remove.primaries.group0=2"]
        text: |
          And, we the sort the partitions.

          Partitions that were on a leaving node are sorted
          first.

          In our example, node b held the primaries of partitions 4
          and 7, so [[partition 4]] and partition 7 get a sorting value of 1.

          With no
          node joining, every other partition gets a sorting value of 2.

      - id: leave-shuffle
        view: { at: remove.primaries~clear, target: row.4, focus: board }
        expect: ["fact:remove.primaries.order=4,7,0,1,2,3,5,6"]
        text: |
          So the sort moves [[partition 4]] and partition 7 to the
          top of the list.

      - id: scores
        view: { panel: score, target: scores, focus: strip }
        text: |
          Next, we move onwards to [[the scores]].

      - id: no-promote
        view: { at: remove.1, target: winner, focus: strip }
        expect: ["fact:remove.1.partition=4", "fact:remove.1.a=2.0005", "fact:remove.1.d=2.0005", "fact:remove.1.winner=a"]
        text: |
          Partition 4's replica is on node d, so promoting node d's
          replica would be cheap, with no data to copy.

          But the stickiness factor
          only counts for a node already in the same state: node d is
          one of three nodes tied at 2.0005. So, node [[a]], first in
          the list, is assigned to be partition 4's primary.

      - id: leave-primaries
        view: { at: remove.primaries, target: scores, focus: strip }
        text: |
          Partitions 7, 0, 1, 2, 3, 5 and 6 get their primaries the
          same way, scored in turn in [[the planner's scores]].

      - id: leave-replica-phase
        view: { at: remove.replicas~phase, target: phase }
        text: |
          Once the primaries are done, the planner changes gears to
          [[assigning replicas]].

      - id: leave-replicas
        view: { at: remove.16, target: winner, focus: strip }
        expect: ["fact:remove.replicas.order=3,5,0,1,2,4,6,7"]
        text: |
          The replicas are handled the same way. The sort puts partitions 3 and
          5 first, since their replicas were on node b.

          Then partitions are [[scored]].

      - id: left
        view: { at: remove.replicas, panel: none, target: tally.a, focus: tallies }
        # (the replicas done: their scores go as the tallies show)
        multi: true
        expect: ["fact:remove.replicas.counts=a3/3 c3/2 d2/3"]
        text: |
          In the end, node [[a has 3 and 3]], node c has 3 and 2, and
          node d has 2 and 3.

      - id: in-order
        view: { at: remove.unsorted, target: row.0 }
        text: |
          With the plan done, let's view [[the partitions]] again in name order.

      - id: moves
        view: { panel: moves, target: row.4, focus: strip, trace: "4" }
        code: [cbgt.failover]
        expect: ["fact:remove.moves=8", "fact:remove.moves.4=add a:primary, del b"]
        text: |
          This led to 8 moves, among them [[partition 4]]'s: add node a as
          partition 4's primary, then delete node b's copy.

          As an aside: an app that
          uses blance can handle a failed node on its own -- cbgt, for example,
          promotes a surviving replica partition without involving blance, and
          uses blance's planner only to assign a partition when there's no surviving replica.

      - id: gone
        view: { at: remove.after, target: board.title, focus: board }
        expect: ["fact:remove.replicas.counts=a3/3 c3/2 d2/3"]
        text: |
          Once the moves are done, node b is out of the cluster, and
          node b's column goes away:
          [[nodes a, c and d hold every partition]].

  # ------------------------------------------------------------------
  - id: knobs
    title: "Knobs"
    color: neutral
    steps:

      - id: options
        view: { panel: none, target: board.title, focus: board }
        code: [blance.options]
        text: |
          `PlanNextMapEx()` also takes options, knobs that an app can
          set to shape [[the partition map]]:

          - the stickiness per state, `StateStickiness`: say, higher
            for primaries, to keep primaries in place;
          - partition weights, `PartitionWeights`: a heavier partition
            counts as more than one partition;
          - node weights, `NodeWeights`: a node's score is divided by
            the node's weight, so a bigger node gets more partitions;
          - how many nodes each state wants, `ModelStateConstraints`:
            say, 2 replicas instead of 1;
          - and a tree of the nodes with rules for the replicas,
            `NodeHierarchy` and `HierarchyRules`, for server groups such
            as for dealing with server racks, rows, cloud regions, etc. (see: [the third explainer](03-groups.html))

  # ------------------------------------------------------------------
  - id: summary
    title: "Summary"
    color: map
    steps:

      - id: loops
        view: { target: board.title, focus: board }
        code: [blance.assign, blance.nodeScore]
        text: |
          Whether blance is assigning primaries or replicas, and
          whether nodes are joining or leaving, blance's planner performs
          the same steps: for each partition state (primaries, then replicas),
          blance first sorts the partitions. Then, for each sorted partition,
          it computes a score for each available node, and
          [[assigns the partition]] to the node with the lowest score.

          ```
          for each state, most important first:
            sort the partitions
            for each sorted partition:
              for each candidate node:
                the node's score =
                  count + spread
                        + tie-breaker - stickiness
              assign the the partition
                to the lowest scoring node
          ```

      - id: takeaway
        view: { target: tally.a }
        expect: ["fact:add.moves=10"]
        text: |
          So the takeaway...

          Although blance might not always
          produce the most optimal partition maps
          with the least number of moves, it's approach is simple,
          easy to calculate and [[balanced]].
