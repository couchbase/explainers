# The second blance explainer: from a plan to a rebalance. No
# simulation runs in the page: each step moves `at` (a moment of a run,
# "one@270") or changes the `panel`, and the scroll moves time between
# them. The runs come from the simulation of blance's orchestrator
# (../lib/orchestrate.js), which its golden cases check against the
# real one; every number in the text is checked against them, by
# `expect: ["fact:<name>=<value>"]`.

sources: [blance, cbgt]
next: 03-groups
draft: true
title: "Inside blance: how a rebalance moves partitions"
subtitle: >-
  From one partition map to the next, while the partitions stay in
  use: each partition's moves, a mover per node, and a controller that
  keeps every node busy, one round at a time.
audience: Engineers who build or run distributed systems

chapters:

  # ------------------------------------------------------------------
  - id: plans
    title: "From partition maps to moves"
    color: change
    steps:

      - id: intro
        view: { target: node.d }
        text: |
          In [the first explainer](01-planning.html), blance computed
          the next partition map for [[node d]] joining a cluster of
          three nodes. The next partition map is only where to end up.
          Getting there means building copies of partitions on their
          new nodes, and removing the old copies, while the partitions
          stay in use. Let's walk through how blance does that.

      - id: moves
        view: { panel: plans, target: plan.0 }
        code: [blance.CalcPartitionMoves]
        expect: ["fact:one.plan.0=add d:primary, del a"]
        text: |
          First, blance's `CalcPartitionMoves()` function computes each
          partition's own moves, from the partition's nodes before to
          the partition's nodes after. For [[partition 0]]: add node d
          as partition 0's primary, then delete node a's copy. The add
          comes first, so the partition is never short of a copy.

      - id: count
        view: { target: plan.3 }
        expect: ["fact:one.moves=10", "fact:one.moved=5"]
        text: |
          10 moves over 5 partitions, two moves each; [[partition 3]],
          and the other partitions that stay put, have no moves. Each
          partition's moves have to happen in order, but different
          partitions' moves can happen at the same time.

  # ------------------------------------------------------------------
  - id: movers
    title: "A mover per node"
    color: primary
    steps:

      - id: movers
        view: { panel: timeline, target: controller }
        code: [blance.analogy, blance.mover]
        text: |
          blance's `OrchestrateMoves()` function runs the moves. Each
          node gets a mover, which does one batch of moves at a time by
          calling back into the app to do the real work; and one
          [[controller]] decides what each mover does next. The code's
          own analogy: each partition's moves are a flight plan, each
          node is an airport with one runway, and the controller
          decides which plane takes off next, and where.

      - id: round1
        view: { target: lane.d }
        code: [blance.weights]
        expect: ["fact:one.round@0=b:5, d:0"]
        text: |
          The controller works in rounds. In the first round, each
          partition's next move is the partition's first move, and
          those moves are on nodes b and d. Node [[d]] has four moves to
          choose from, all adds. The controller picks the lowest weight
          move (promote first, then demote, then add, and delete last),
          and among equals, here, the first by name: partition 0. Node
          b has just one move, partition 5's add.

      - id: first-done
        view: { at: one@270, target: lane.a }
        code: [blance.supply]
        expect: ["fact:one@270.starts.a=del 0", "fact:one@270.starts.d=add 1", "fact:one.round@270=a:0, b:5 waits, d:1"]
        text: |
          At 270 ms, node d has finished adding partition 0. A round
          ends as soon as any mover finishes, and the next round
          starts: partition 0's next move is now [[on node a]],
          deleting node a's old copy, and node d starts adding
          partition 1. Node b is still adding partition 5: node b's best
          move is the move already in flight, so node b waits.

      - id: bottleneck
        view: { at: one@1323, target: lane.d }
        expect: ["fact:one.end=1323", "fact:one.busy.d=1269"]
        text: |
          And so on: in every round, each node's next move. But node
          [[d]] has four adds to do, one after another, and every other
          move is quick: the whole rebalance takes 1323 ms, with node d
          busy for 1269 ms of it.

      - id: races
        view: { panel: plans, target: plan.0 }
        code: [blance.supplyMove]
        text: |
          All done: [[every move]] is made. This simulation simplifies
          two things. blance breaks ties between equal moves by Go map
          order, in effect at random, while here the first by name
          wins. And in the real code, when two moves finish at the same
          moment, which move the controller hears about first is a
          race, so real runs differ. (The runs here are timed so that no
          moves finish at the same moment; on these runs, this
          simulation and the real orchestrator agree, move for move.)

  # ------------------------------------------------------------------
  - id: more
    title: "More moves at once"
    color: replica
    steps:

      - id: four
        view: { at: four@0, target: mover.d }
        code: [blance.batch]
        expect: ["fact:four@0.starts.d=add 0,add 1,add 2,add 4", "fact:four.round@0=b:5, d:0+1+2+4"]
        text: |
          A mover can take several moves at once, as one batch: up to
          `MaxConcurrentPartitionMovesPerNode` moves, best first. (cbft,
          for one, uses 1 unless told otherwise.) With 4,
          [[node d's mover]] takes all four adds in one batch.

      - id: four-timeline
        view: { panel: timeline, target: lane.d }
        text: |
          On the timeline, node [[d]] has one batch in flight, of four
          adds, and node b has its one add.

      - id: four-waits
        view: { at: four@378, target: lane.b }
        expect: ["fact:four.round@378=a:0, b:5+1+2 waits, c:4"]
        text: |
          At 378 ms node d's batch is done, so node b's copies of
          partitions 1 and 2 can be deleted. But node [[b]]'s best moves
          still include partition 5's add, which is in flight, so node
          b waits for it before starting the deletes.

      - id: four-done
        view: { at: four@468, target: now }
        code: [cbgt.assign]
        expect: ["fact:four.end=468"]
        text: |
          The rebalance is done at [[468 ms]], instead of 1323 ms. Here
          a batch takes as long as its slowest move (cbgt, for one,
          waits for all of a batch's partitions). On a real node, four
          adds at once share the node's disk, CPU and network, so the
          win is smaller than this.

  # ------------------------------------------------------------------
  - id: fewer
    title: "Fewer copies, or more"
    color: groups
    steps:

      - id: min-plans
        view: { at: min@0, target: plan.0 }
        expect: ["fact:min.plan.0=del a, add d:primary"]
        text: |
          With the `FavorMinNodes` option, each partition's moves go
          the other way round: deletes first, so that a partition is on
          as few nodes as possible at any time. For [[partition 0]]:
          delete node a's copy, then add node d as partition 0's
          primary.

      - id: min-timeline
        view: { panel: timeline, target: lane.a }
        expect: ["fact:min.round@0=a:0, b:1, c:4"]
        text: |
          So the first round now starts the deletes: on node [[a]],
          node b and node c.

      - id: min-gap
        view: { at: min@288, target: row.1 }
        expect: ["fact:min.noPrimary.0=18-288", "fact:min.noPrimary.1=27-585"]
        text: |
          But partition 0's only primary was on node a. From 18 ms,
          when node a's copy is deleted, until 288 ms, when node d's
          copy is built, partition 0 has no primary; and
          [[partition 1]] has no primary from 27 ms until 585 ms. The
          code says as much: the option favours "max of single primary,
          if even there are temporarily no primaries for a time".

      - id: min-done
        view: { at: min@1287, target: now }
        expect: ["fact:min.end=1287", "fact:one.end=1323"]
        text: |
          The rebalance is done at [[1287 ms]], about as long as with
          adds first. The trade-off isn't time but copies: never more
          copies than needed, versus never fewer copies than before.
          Most apps that serve reads, cbft among them, use adds first.

      - id: pause
        code: [blance.pause]
        text: |
          The app can also pause a rebalance: no new moves start, and
          the moves in flight finish. Then the app can resume the
          rebalance, or stop it. A stopped rebalance leaves a partition
          map partway between the two, and the next plan starts from
          there.
