# The first rebalance explainer: how vbmap lays out a bucket's
# vbuckets. Told as a story about one document's vbucket: a simple
# layout fails twice, then vbmap's layout survives the same failures.
# No simulation: each step moves `at`, one of the diagram's states
# (states.js), and the scroll plays every state in between, one change
# at a time. The vbmap layouts are real: made by the vbmap tool itself
# (../lib/tools/vbmap-golden). Every number in the text is checked by
# `expect`.

sources: [vbmap, ns_server]
draft: true
title: "Inside rebalance: how vbmap places vbuckets"
subtitle: >-
  Couchbase splits a bucket into vbuckets, and keeps each one's copies
  on different servers. Where exactly? A simple answer fails badly;
  vbmap's answer survives a failed server, or a whole rack, without
  overloading anyone.
audience: Engineers who build or run distributed systems

chapters:

  # ------------------------------------------------------------------
  - id: bucket
    title: "One document, two copies"
    color: story
    steps:

      - id: doc
        view: { at: doc, target: doc }
        expect: ["fact:hero.vb=9", "fact:hero.vb1024=361"]
        text: |
          Meet [[airline_10]], a document in a Couchbase bucket.
          Couchbase hashes each document's key to one of the bucket's
          vbuckets: crc32 of the key, its top 15 bits, modulo the
          number of vbuckets. airline_10 lands in vbucket 9 (in a real
          bucket of 1024 vbuckets, vbucket 361).

      - id: vbuckets
        view: { at: grid, target: grid }
        expect: ["fact:vbuckets=32"]
        text: |
          A real bucket has 1024 vbuckets. This one has
          [[32 vbuckets]], so each one stays visible. Every document
          lives in exactly one vbucket. Vbucket 9 is ringed, and we'll
          follow it throughout.

      - id: copies
        view: { at: split, target: hero.replica }
        text: |
          Each vbucket has two copies: an active copy (marked A),
          which serves reads and writes, and a [[replica]] (marked R,
          with a light corner), kept in step with the active copy and
          ready to take over. 64 copies in all, to place on the
          cluster's servers, the nodes.

  # ------------------------------------------------------------------
  - id: simple
    title: "A simple deal"
    color: story
    steps:

      - id: cast
        view: { at: scaffold, target: rack.West }
        text: |
          The cluster: four nodes in two racks. Nodes a and b are in
          [[rack West]], nodes c and d in rack East. A rack shares one
          power supply and one network switch, so a rack can fail all
          at once.

      - id: actives
        view: { at: naive.actives, target: node.a }
        text: |
          A simple deal. First, deal the active copies out evenly:
          8 to each node. The copies' colors were their vbuckets'
          homes all along: the node with the active copy. [[Node a]]'s
          vbuckets are teal, node b's blue, and so on.

      - id: replicas
        view: { at: naive.replicas, target: hero.replica }
        expect: ["fact:naive.hero=b,c"]
        text: |
          Then put each node's replicas on the next node over: node
          a's on node b, node b's on node c, node c's on node d, and
          node d's on node a. Vbucket 9 is active on node b, with its
          [[replica]] on node c.

      - id: fair
        view: { at: naive.counts, target: count.a }
        expect: ["fact:naive.serves=a8 b8 c8 d8"]
        text: |
          It looks fair: every node [[serves 8]] vbuckets and holds 8
          replicas.

  # ------------------------------------------------------------------
  - id: c-fails
    title: "2 a.m.: node c fails"
    color: trouble
    steps:

      - id: down
        view: { at: naive.c.down, target: node.c }
        text: |
          At 2 a.m., [[node c]] stops answering, and a grey curtain
          drops over it. Its copies are unreachable. (They keep their
          colors, to show whose vbuckets they are.)

      - id: failover
        view: { at: naive.c.promoted, target: count.d }
        expect: ["fact:naive.c.serves=a8 b8 d16"]
        text: |
          Couchbase fails node c over: each of node c's vbuckets is
          served by its replica instead, now promoted to active (a
          dark outline). All 8 of those replicas are on node d, so
          [[node d]] now serves 16, double its share, while nodes a and
          b still serve 8.

      - id: hero
        view: { at: naive.c.promoted, target: hero.replica }
        text: |
          And vbucket 9? Its active copy on node b is fine, but its
          [[replica]] was on node c. Until node c is back, vbucket 9
          has no replica at all.

      - id: back
        view: { at: naive.c.up, target: node.c }
        text: |
          [[Node c]] is repaired and rejoins, and every copy returns
          to where it was.

  # ------------------------------------------------------------------
  - id: power
    title: "A power cut in rack West"
    color: trouble
    steps:

      - id: down
        view: { at: naive.west.down, target: rack.West }
        text: |
          Worse: a power cut takes out all of [[rack West]], nodes a
          and b together.

      - id: failover
        view: { at: naive.west.promoted, target: count.c }
        expect: ["fact:naive.west.serves=c16 d8"]
        text: |
          Node b's vbuckets fail over to their replicas on node c, so
          [[node c]] serves 16.

      - id: lost
        view: { at: naive.west.lost, target: node.a }
        expect: ["fact:naive.west.lost=8", "fact:naive.sameRack=16"]
        text: |
          But [[node a]]'s replicas were on node b, in the same rack.
          8 vbuckets lose both copies at once (red ×): their data is
          gone. In this deal, 16 of the 32 replicas sit in their
          active copy's own rack.

      - id: back
        view: { at: naive.west.up, target: rack.West }
        text: |
          Power returns to [[rack West]], and the story rewinds. Two
          failures, two lessons: spread each node's replicas over
          several nodes, and never put a vbucket's copies in one rack.

  # ------------------------------------------------------------------
  - id: better
    title: "A better deal"
    color: fix
    steps:

      - id: compare
        view: { at: ghost, target: ghost }
        text: |
          Keep [[the simple deal]] below, to compare.

      - id: redeal
        view: { at: vbmap, target: hero.replica }
        code: [ns_server.invoke_vbmap]
        expect: ["fact:vbmap.sameRack=0", "fact:vbmap.hero=b,d"]
        text: |
          Now the deal that Couchbase's cluster manager, ns_server,
          gets from its vbmap tool. Each node keeps its 8 actives.
          The replicas are dealt again: every replica now sits in the
          other rack, and each node's replicas are split over both
          nodes there. Vbucket 9's [[replica]] moves to node d.

      - id: c-again
        view: { at: vbmap.c.promoted, target: count.a }
        expect: ["fact:vbmap.c.serves=a12 b12 d8"]
        text: |
          Node c fails again. Its replicas are on nodes a and b, 4
          each, so [[node a]] and node b serve 12 each. Node d can't
          help: it's in node c's rack. But no node doubles.

      - id: c-back
        view: { at: vbmap.c.up, target: node.c }
        text: |
          [[Node c]] rejoins.

      - id: west-again
        view: { at: vbmap.west.promoted, target: rack.East }
        expect: ["fact:vbmap.west.serves=c16 d16", "fact:vbmap.west.lost=0"]
        text: |
          And rack West loses power again. Every one of its vbuckets
          has a copy in [[rack East]], now promoted: nodes c and d
          serve 16 each, and no vbucket is lost.

      - id: west-back
        view: { at: vbmap.west.up, target: rack.West }
        text: |
          Power returns to [[rack West]].

  # ------------------------------------------------------------------
  - id: rules
    title: "The rules"
    color: neutral
    steps:

      - id: rules
        code: [vbmap.constraints]
        text: |
          vbmap's deal follows rules, listed in its README. In short:

          - each node replicates to the same number of other nodes,
            and is replicated to by as many;
          - each node's actives and replicas are within one of the
            average;
          - a vbucket's copies are in different racks;
          - with two or more replicas, no pair of nodes keeps
            following each other in replica chains;
          - each node's replicas are spread across the racks as
            evenly as possible.

      - id: how
        text: |
          With 4 nodes, a deal that meets them is easy to find by
          hand. With 40 nodes in 3 racks and 1024 vbuckets, it's
          harder. A seating chart shows the rules at work, and how
          vbmap fills it in.

  # ------------------------------------------------------------------
  - id: chart
    title: "A seating chart"
    color: flow
    steps:

      - id: unghost
        view: { at: unghost, target: rack.West }
        text: |
          First, put the simple deal away: vbmap's deal, on top, is
          [[the one]] to look at.

      - id: frame
        view: { at: chart.frame, target: chart.title }
        text: |
          Now a seating chart for the deal: a row for each node's
          actives, a column for each node's replicas. A vbucket sits
          at row (its active's node), column (its replica's node).
          [[The chart]] starts empty, below the cluster.

      - id: seated
        view: { at: chart.seated, target: hero }
        expect: ["fact:vbmap.hero=b,d"]
        text: |
          Each vbucket takes its seat, its two copies side by side.
          [[Vbucket 9]], active on node b with its replica on node d,
          sits at row b, column d.

      - id: up
        view: { at: chart.up, target: chart.title }
        text: |
          Everything the cluster showed is in [[the chart]] now, so
          the chart takes the cluster's place.

      - id: sums
        view: { at: chart.sums, target: chart.title }
        expect: ["fact:vbmap.serves=a8 b8 c8 d8", "fact:vbmap.sameRack=0"]
        text: |
          The rules become [[the chart's shape]]. Same-rack seats
          (grey) stay empty. Every row holds 8 vbuckets, every node's
          actives; every column holds 8, every node's replicas. And
          each seat holds 4: each node splits its replicas evenly
          over the two nodes in the other rack.

      - id: fill
        view: { at: chart.sums, target: chart.title }
        code: [ns_server.use_greedy, vbmap.getLeastCostSlaves, vbmap.getBestReplica]
        expect: ["fact:engine=greedy"]
        text: |
          How does vbmap fill the chart? ns_server runs its [[greedy]]
          engine, which decides one thing at a time. First, who backs
          up whom: each node in turn takes a partner in another rack,
          the one with the fewest partners so far. Then the vbuckets,
          one by one: each replica goes to a partner of its active's
          node, the one holding the fewest replicas so far (or, of
          equals, the fewest from that node; then any, at random).

      - id: current
        view: { at: chart.sums, target: chart.title }
        code: [vbmap.getActivePlacements]
        text: |
          Greedy also leans on the map a cluster already has. Where a
          rule allows it, a vbucket keeps its active on the same node,
          and its replica too. A new bucket has no map yet, so here
          [[every seat]] was free. That changes when nodes join.

  # ------------------------------------------------------------------
  - id: uneven
    title: "When the rules can't all hold"
    color: trouble
    steps:

      - id: home
        view: { at: unchart, target: rack.West }
        text: |
          Back to the cluster: the chart goes back down, the racks
          return, and each vbucket returns to its nodes, in
          [[its racks]].

      - id: joins
        view: { at: e.joins, target: node.e }
        text: |
          Now [[node e]] joins, in rack West. Rack West has three
          nodes; rack East, two.

      - id: deal
        view: { at: e.deal, target: node.e }
        code: [ns_server.invoke_vbmap]
        expect: ["fact:uneven.moves=10,6", "fact:uneven.land=a0 b0 c0 d0 e10", "fact:uneven.newNode.copies=10", "fact:uneven.newNode.actives=6", "fact:uneven.serves=a7 b7 c6 d6 e6", "fact:uneven.sameRack=0", "fact:uneven.hero=b,d"]
        text: |
          ns_server asks vbmap for a five-node map, and passes it the
          map the cluster has. Greedy keeps all it can: 10 copies to
          build (edged in red), all of them on [[node e]], and 6
          takeovers, node e's 6 actives. That's the least possible: a
          new node's copies are all new. Every node serves 6 or 7,
          and every replica still crosses racks. Vbucket 9 stays put,
          on nodes b and d. Each copy keeps its old color, for now.

      - id: recolor
        view: { at: e.recolor, target: node.e }
        expect: ["fact:uneven.rehomed=6", "fact:uneven.e.from=a,b,c,d"]
        text: |
          Node e's 6 actives came from nodes a, b, c and d. To keep
          them easy to follow from here on, each copy now takes its
          new home's color: [[node e]]'s, green.

      - id: holds
        view: { at: e.holds, target: count.c }
        expect: ["fact:uneven.holds=a4 b4 c10 d10 e4"]
        text: |
          But count the replicas each node holds: [[nodes c and d]]
          hold 10 each, and nodes a, b and e only 4. The two nodes of
          rack East hold more than twice what the others do.

      - id: why
        view: { at: e.holds, target: rack.West }
        expect: ["fact:uneven.west.actives=20", "fact:uneven.east.actives=12"]
        text: |
          It's arithmetic. [[Rack West]]'s nodes serve 20 vbuckets, and
          each needs its replica outside rack West: on node c or node
          d, 10 each. Rack East's 12 vbuckets spread their replicas
          over three nodes: 4 each. Copies in different racks, and
          every node within one of the average: with racks of 3 and 2,
          both rules can't hold.

      - id: gives
        view: { at: e.holds, target: count.d }
        code: [vbmap.getBestReplica]
        text: |
          Greedy never breaks the rack rule: a replica only ever goes
          to a partner in another rack. Balance is what it aims for,
          the fewest replicas so far, not a rule it must meet. So rack
          safety holds, balance gives, and [[node d]] and node c carry
          the extra.

      - id: lesson
        text: |
          The lesson for anyone laying out a cluster: keep racks (in
          Couchbase, server groups) the same size, or expect the
          smaller rack's nodes to carry more.

  # ------------------------------------------------------------------
  - id: rebalance
    title: "Node f joins: a rebalance"
    color: fix
    steps:

      - id: f-joins
        view: { at: f.joins, target: node.f }
        text: |
          So take the lesson: [[node f]] joins rack East, and the racks
          are 3 and 3. A rebalance moves the cluster from the map it
          has to a new map for six nodes.

      - id: deal
        view: { at: six.deal, target: node.f }
        code: [ns_server.simple_minimize_moves]
        expect: ["fact:six.moves=11,7", "fact:six.land=a0 b0 c0 d0 e0 f11", "fact:six.newNode.copies=11", "fact:six.newNode.actives=5", "fact:six.promoted=2", "fact:six.dealt=14,5", "fact:six.hero=f,b"]
        text: |
          Again ns_server asks vbmap, passing it the current map. The
          map it keeps builds 11 copies, all on [[node f]], the least
          possible again. It has 7 takeovers: node f's 5 actives, and
          2 replicas promoted to active, which copies nothing. That
          trade is ns_server's own: vbmap's map, as dealt, built 14
          copies; ns_server's simple_minimize_moves() reseated its
          chains on the vbuckets, and copies count first. Vbucket 9's
          active moves to node f, and node b keeps a copy, as its
          replica.

      - id: tries
        view: { at: six.tries, target: tries }
        code: [ns_server.generate_map_new, ns_server.vbucket_movements]
        expect: ["fact:six.tries=9", "fact:six.best=debfca 1", "fact:six.range=11-15"]
        text: |
          And ns_server doesn't ask just once. It shuffles the node
          order three times, and asks vbmap three times for each: nine
          maps, each reseated, from 11 to 15 copies to build. It keeps
          [[the cheapest]], by copies to build, then by takeovers: the
          map above. (These nine are real vbmap runs, with seeds 1 to
          3; ns_server's are random.)

      - id: lands
        view: { at: six.tries, target: count.f }
        expect: ["fact:six.serves=a6 b6 c5 d5 e5 f5", "fact:six.holds=a5 b5 c6 d5 e5 f6", "fact:six.sameRack=0"]
        text: |
          The balance is back: every node serves 5 or 6 vbuckets and
          holds 5 or 6 replicas, and every replica still crosses
          racks. Nodes c and d, which held 10 replicas each, now hold
          6 and 5. [[Node f]], new, serves 5 and holds 6.

      - id: next
        code: [ns_server.moves_per_node]
        text: |
          But copies don't teleport. Each red-edged copy is a backfill:
          its vbucket's data, streamed from the active copy while the
          cluster keeps serving. ns_server moves vbuckets a few at a
          time, at most 4 into or out of any one node at once (by
          default), so node f's 11 wait their turn. How those moves are
          scheduled, and how an active copy hands over without losing a
          write, is a story for another explainer.
