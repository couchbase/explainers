# Named code references used by narratives (`code: [id, ...]`).
#
#   repo:      key in sources.yaml
#   path:      file path within the repo
#   anchor:    text on the first line of the snippet; must be unique in
#              the file (line numbers are derived, so they don't rot)
#   extent:    func  - through the next line that is exactly "}"
#              block - through the next line that is exactly ")" or "}"
#              N     - N lines
#   highlight: substrings; lines containing them are highlighted
#   title:     shown in the UI

