# The first explainer: scorch's goroutines and backpressure, as driven
# by cbft. See README.md for the schema; `npm test` validates it,
# including the rule that each step changes only one thing: the
# camera, the lids, a detail bubble, the UI, or the simulation.

id: scorch-goroutines
title: "Inside bleve / scorch: introducer, persister, merger"
subtitle: >-
  How a Couchbase FTS index turns a stream of DCP mutations into
  searchable, durable segments.
audience: Couchbase engineers and support

sim:
  seed: 7
  config: {}

chapters:

  # ------------------------------------------------------------------
  - id: picture
    title: "The big picture"
    color: neutral
    steps:

      - id: layers
        sim: { reset: true, minTimeMs: 6010, speed: 0 }
        view: { camera: overview, target: cbftLid }
        expect: [kvFlowing, herderIdle]
        text: |
          Consider a single FTS index partition (a *pindex*) on a single node.
          In this diagram, data flows from top to bottom. The big box in the middle is
          [[the cbft process]], the search service of Couchbase Server.

          The diagram is a **simulation**. We'll follow
          goroutines and the control flow of cbft and bleve
          code.

      - id: kv
        view: { target: kvLid }
        text: |
          Mutations start in [[KV]], a separate process, that is the "key-value"
          server of Couchbase Server. These mutations are transmitted to
          cbft over the network, as a DCP stream.

      - id: disk
        view: { target: diskLid }
        text: |
          They end up as segment files in the index's directory, on
          [[disk]].

  # ------------------------------------------------------------------
  - id: cbft
    title: "KV and cbft"
    color: cbft
    steps:

      - id: zoom
        view: { camera: top, target: kvLid }
        text: |
          Let's drill down into the hop between [[KV]] and cbft.

      - id: kv-open
        view: { open: [kv], target: buffer }
        code: [cbgt.dcpBuffer]
        text: |
          KV sends DCP *snapshots*: runs of mutations for one vbucket.
          These wait in a 20MB [[flow-control buffer]] until cbft acks
          them. When that buffer fills, KV pauses sending until cbft drains it.

      - id: cbft-open
        view: { open: [cbft], target: dcp }
        code: [cbft.dataUpdate, bleve.BatchIndex, cbft.updateSeq]
        text: |
          gocbcore calls cbft's `DataUpdate()` for every received mutation,
          synchronously, on [[the DCP goroutine]]. It maps the document
          (`batch.Index()`) into that vbucket's `bleve.Batch`.

          A batch is handed off at the end of the DCP snapshot, or at
          200 mutations (`BleveMaxOpsPerBatch`), whichever comes first.

      - id: workers
        view: { target: workers }
        code: [cbft.submitAsync, cbft.runBatchWorker, cbft.batchDefaults]
        text: |
          Batches go to one of [[4 batch workers]], shown stacked here with
          batch worker 0 in front. Each worker has a channel of capacity 1.
          It merges what arrives into one bigger batch, and executes it
          at 200 ops or when its 100ms ticker fires.

          Every box is a goroutine, colored by its state:
          <span class="st st-busy">busy</span>,
          <span class="st st-sleep">napping</span>,
          <span class="st st-wait">waiting for work</span>, or
          <span class="st st-stall">stalled by backpressure</span>.

      - id: follow
        sim: { follow: true, until: dcp }
        view: { target: ourBatch }
        expect: ["reached:dcp"]
        text: |
          Now let's **follow one batch**, depicted as a small chip
          with the orange outline, which will travel through the diagram as
          you scroll.

          Our batch is being built right now by [[the DCP goroutine]].

      - id: to-channel
        sim: { until: channel }
        view: { target: ourBatch }
        expect: ["reached:channel"]
        code: [cbft.submitAsync]
        text: |
          The batch is complete. The DCP goroutine puts it into
          [[a worker's channel]], a slot that holds just one batch.
          Which worker is fixed by the vbucket number, so each
          vbucket's batches stay in order.

      - id: to-worker
        sim: { until: worker }
        view: { target: ourBatch }
        expect: ["reached:worker"]
        text: |
          [[Its batch worker]], worker 0,
          takes the batch from the channel and holds it, merging in any
          more that arrive, until it reaches 200 ops or the ticker
          fires. If the slot had still been full, the DCP goroutine
          would have had to wait.

      - id: to-herder
        sim: { until: herder }
        view: { target: gate }
        expect: ["reached:herder"]
        code: [herder.onScorchEvent, herder.checkAndBlockBatch, herder.overQuota]
        text: |
          Before the batch may enter bleve, the worker checks with
          [[the app herder]]. This checks process memory against the
          indexing quota (65% of the FTS memory quota). Right now we're
          well under it, so our batch is not paused and may continue.

      - id: into-bleve
        sim: { until: analysis }
        view: { target: ourBatch }
        expect: ["reached:analysis"]
        code: [cbft.execute]
        text: |
          Through the gate, the worker calls `bindex.Batch()`, and
          [[our batch]] crosses from cbft's own code into the bleve
          library, which runs in the same process.

  # ------------------------------------------------------------------
  - id: scorch
    title: "Into bleve and scorch"
    color: scorch
    steps:

      - id: step-back
        view: { camera: process, target: bleveLid }
        text: |
          Step back for a moment. Our batch is now being processed by
          [[the bleve library]]. bleve is
          linked into the cbft process, and we're still on the same batch worker
          goroutine from cbft.

      - id: bleve-open
        view: { open: [bleve], target: bleveNote }
        code: [cbft.execute]
        text: |
          bleve's top layer is [[what applications program against]]:
          bleve's index API, document mapping (which already ran, back in
          the DCP goroutine's `batch.Index()`), and text analysis.
          Underneath sits a pluggable index implementation. cbft uses the
          *scorch* implementation.

      - id: scorch-open
        view: { open: [scorch], target: introducer }
        text: |
          Inside scorch we see: `Scorch.Batch()`, the root snapshot
          in the middle, and three goroutines in their own boxes:
          [[the introducer]], the persister and the merger.

      - id: zoom-top
        view: { camera: scorchTop, target: batch }
        code: [scorch.Batch]
        text: |
          The worker's `bindex.Batch()` goes through bleve's
          `index.Batch()` to [[Scorch.Batch()]], scorch's entry point.
          all running on cbft's worker goroutine, and it doesn't
          return until the batch has been fully 'introduced'.

      - id: analysis
        view: { target: analysis }
        code: [scorch.batchAnalysis, scorch.analyze]
        text: |
          First comes analysis. For that, scorch calls across to a
          utility that bleve provides to its index implementations:
          [[bleve's analysis queue]]. `Batch()`
          starts a goroutine that queues one closure per document,
          then waits until every result has come back.

      - id: queue
        view: { target: analysis }
        code: [bleve.analysisQueue, cbft.analysisQueueSize]
        text: |
          The analysis queue is a pool of worker goroutines that bleve initializes
          once per process, controlled via `bleve.Config`, where cbft sizes this to the
          number of CPUs. Its channel is unbuffered, so `Queue()`
          blocks until an analysis queue worker is free.

          Every FTS index in the cbft node shares [[this one pool]] of analysis queue workers.

      - id: make-room
        view: { camera: analysisDetail, target: analysis }
        text: |
          What does [[an analyzer]] actually do? Let's make room beside
          it.

      - id: analyzer
        view: { bubble: [analysis], target: analysisDetail }
        code: [scorch.analyze]
        text: |
          Following the index definition, for each indexed field, there's
          an index mapping analyzer which runs
          [[an analysis pipeline]]: a tokenizer splits the text into tokens, then
          token filters lowercase them, drop stop words and stem them.
          What's left are terms with their positions, ready to become a
          segment's dictionary and postings.

          It's all CPU work, and usually the biggest share of the CPU
          that indexing uses.

      - id: analyzer-close
        view: { unbubble: [analysis], target: analysis, flow: analysis }
        text: |
          Because the pool is shared and sized to the CPUs, a burst of
          ingest anywhere on the node can make [[the queue]] the
          bottleneck. Batches wait their turn, their batch workers stay
          blocked in `Batch()`, the DCP goroutine can't hand off its
          next batch, and the pressure backs up toward KV.

      - id: back
        view: { camera: scorchTop, target: batch }
        text: |
          Back in scorch, [[Scorch.Batch()]] is waiting for our batch's
          analysis results.

      - id: built
        sim: { until: introducing }
        view: { target: batch }
        expect: ["reached:introducing"]
        text: |
          Analysis is done, and [[Scorch.Batch()]] has built our
          segment. It now hands the segment to the introducer and
          waits.

      - id: follow
        view: { camera: swap, target: introducer }
        text: |
          Let's follow our segment into [[the introducer]].

      - id: introduced
        sim: { until: introduced }
        view: { swap: copy, target: root }
        expect: ["reached:introduced", ourSegInMemory]
        code: [introducer.introduceSegment]
        text: |
          The introducer is the only goroutine that may change the
          index's *root*: an immutable snapshot listing the segments
          and their deleted docs. It never edits the root in place.
          It starts [[a new root]] from a copy of the current one's
          segment list.

      - id: appended
        view: { swap: add, target: ourSeg }
        code: [scorch.prepareSegment]
        text: |
          It appends [[our segment]] to that list.

      - id: next-epoch
        view: { swap: epoch, target: rootEpoch }
        code: [introducer.introduceSegment]
        text: |
          It gives the new root [[the next epoch]].

      - id: swapped-in
        view: { swap: settle, target: root }
        expect: [onlyRootLive]
        text: |
          Then it swaps [[the new root]] in, and lets go of its ref on
          the old one. Nothing else holds the old root right now, so
          it's freed.

      - id: our-segment
        view: { camera: root, target: ourSeg }
        expect: [ourSegInMemory]
        code: [cbft.kvConfig, cbft.execute]
        text: |
          Our docs are now [[this in-memory segment]], in orange.
          Queries that start from now on can see them.

          cbft runs scorch with `unsafe_batch: true`, so `Batch()`
          returns right here, before anything is on disk. That's also
          when `at_plus` consistency waiters are released.
          **"Consistent" in FTS means searchable, not durable.**

  # ------------------------------------------------------------------
  - id: introducer
    title: "Inside the introducer"
    color: scorch
    steps:

      - id: zoom
        view: { camera: introducer, target: introducer }
        text: |
          A closer look at [[the introducer]].

      - id: open
        view: { open: [introducer], target: select }
        code: [introducer.loop, introducer.introducePersist]
        text: |
          It's [[a select loop]] over four channels: batches being
          introduced, files from the persister, merge results from the
          merger, and "wake me after epoch N" requests. Every message
          produces a new root and bumps the epoch.

          Go's `select` picks randomly among ready channels, so
          batches, persists and merges take turns fairly.

  # ------------------------------------------------------------------
  - id: persister
    title: "The persister"
    color: scorch
    steps:

      - id: zoom
        view: { camera: persister, target: persister }
        text: |
          Our segment is searchable, but only in memory. Making it
          durable is the job of [[the persister]].

      - id: open
        view: { open: [persister], target: persisterInside }
        code: [persister.pause, cbft.napDefaults, persister.defaults]
        text: |
          The persister works in [[four phases]]. First it naps for up
          to 2 seconds (cbft's setting; bleve's default is 0), letting
          in-memory segments pile up. Then it merges them into ~20MB
          files with up to 4 workers, and commits.

      - id: cut
        sim: { set: { ingestDocsPerSec: 0 }, until: flushables }
        view: { target: persisterInside }
        expect: ["reached:flushables"]
        code: [persister.maybeMerge]
        text: |
          The persister woke up and took a ref on the root snapshot.
          Nothing was handed to it: it found our segment in that root.
          It [[cut the root's in-memory segments]] into *flushables*:
          runs of neighbors, up to ~20MB each, one per worker. Ours is
          in one of them.

          To keep this simple, we've paused new mutations from KV for
          now, so nothing else changes the root while we watch. We'll
          turn them back on later.

      - id: persisting
        sim: { until: persisting }
        view: { target: ourBatch }
        expect: ["reached:persisting"]
        code: [persister.maybeMerge, merger.memMerge]
        text: |
          [[A persister worker]] is merging our flushable, our segment
          and its neighbors, into one new zap file, which it then
          writes and fsyncs. Our segment stays in the root meanwhile,
          still searchable.

      - id: make-room
        view: { camera: persisterDetail, target: persister }
        text: |
          Let's look more closely at [[the persister]]. We'll make some
          room to its left.

      - id: detail
        view: { bubble: [persister], target: persisterDetail }
        code: [persister.loop, persister.persistSnapshot, persister.direct]
        text: |
          Here's [[the same cycle]], in terms of the code in
          `persisterLoop()`. It only ever persists the *latest* root, so
          the epochs in between are skipped, which acts as a group
          commit. The new files are swapped into the root first, and
          only then committed to `root.bolt` and fsynced.

      - id: detail-close
        view: { unbubble: [persister], target: persisterInside }
        expect: [napBroken]
        code: [merger.loop]
        text: |
          One surprise: [[the nap]] rarely runs its full 2 seconds.
          Every time the merger finishes a plan, it hands the persister
          an "epoch watcher", and that ends the nap
          (`num_persister_nap_merger_break`).

      - id: back
        view: { camera: persisterDisk, target: ourBatch }
        text: |
          Back to [[our segment]], still being written.

      - id: written
        sim: { until: written }
        view: { target: ourBatch, flow: write }
        expect: ["reached:written", ourSegInMemory]
        code: [zapx.persist]
        text: |
          The worker wrote our new file down to disk and fsynced it,
          then mmapped it. So [[our file]] is on disk now. But it's
          not in the root yet: queries still find our docs in the
          in-memory segment.

      - id: to-introducer
        sim: { until: fileIntroducing }
        view: { target: ourBatch }
        expect: ["reached:fileIntroducing"]
        code: [introducer.introduceMerge]
        text: |
          So the persister hands the new file up to
          [[the introducer]], over the same `merges` channel the
          merger uses. Only the introducer may change the root.

      - id: watch
        view: { camera: swap, target: root }
        text: |
          Now watch [[the root snapshot]], epoch 355, as the
          introducer swaps in a new one. It goes one change at a
          time, as you scroll.

      - id: file
        sim: { until: file }
        view: { swap: cover, target: root }
        expect: ["reached:file", ourSegIsFile]
        code: [introducer.mergeSwap]
        text: |
          The introducer starts [[a new root snapshot]]: empty for
          now, drawn dashed and see-through over the old one. Nobody
          else can see it yet. Queries, the persister and the merger
          all find the root through `s.root`, which still points at
          epoch 355.

      - id: peel
        view: { swap: peel, target: root }
        text: |
          Let's lift [[the new root]] off the stack, so we can watch it
          being built while the old one stays put underneath.

      - id: copy
        view: { swap: copy, target: rootMem }
        code: [introducer.mergeSwap]
        text: |
          It starts from a copy of [[the old root's segment list]]
          (and, for now, its epoch). Only the list: the segments themselves are shared, and each one's
          refcount goes up by one. No docs are copied.

      - id: add
        view: { swap: add, target: ourSeg }
        text: |
          In goes [[our file]], as a new file segment.

      - id: mem-gone
        view: { swap: drop, target: rootMem }
        expect: [noMemSegsAtRoot]
        text: |
          Out go [[the in-memory segments]] it replaces. All of them,
          ours included, were merged into that one file: same docs,
          now in a zap file on disk, mmapped.

      - id: epoch-up
        view: { swap: epoch, target: rootEpoch }
        expect: ["rootEpoch:356"]
        text: |
          Last, just before the swap, it gets the next epoch:
          [[355 + 1 = 356]]. The introducer hands out epochs in order,
          one for every root it swaps in,
          whether that root adds a batch's segment, a persister's file,
          or a merger's result.

      - id: swapped
        view: { swap: solid, target: root }
        code: [introducer.mergeSwap]
        text: |
          Now the introducer [[swaps it in]]: one pointer assignment,
          `s.root = newSnapshot`, under a lock. It's solid now. From
          here on, queries, the persister and the merger see epoch 356.

      - id: old-root
        view: { swap: settle, target: olderEpoch }
        expect: [persisterHoldsOlderRoot, "rootEpoch:356"]
        code: [snapshot.refcount]
        text: |
          The stack shifts back, with the new root in front. Behind
          it, [[epoch 355]] is still alive: the introducer let go of
          its ref, but the persister still holds one. Root snapshots
          aren't linked to each other. Each is an immutable, refcounted
          list of segments, freed when its last ref goes. Next, the
          persister commits `root.bolt` and fsyncs it.

      - id: committed
        sim: { until: committed }
        view: { target: persister }
        expect: ["reached:committed"]
        code: [persister.loop]
        text: |
          [[The persister]] committed `root.bolt`, fsynced it, and let
          go of its ref. Nothing else held that old snapshot, so it's
          freed. Its next cycle takes a ref on whatever the root is by
          then: it never holds more than one.

  # ------------------------------------------------------------------
  - id: disk
    title: "Down to disk"
    color: disk
    steps:

      - id: step-back
        view: { camera: overview, target: diskLid }
        text: |
          Step back again. Our file has been on [[disk]] since the
          persister wrote it, a few steps back.

      - id: open
        view: { open: [disk], target: ourFile, token: file }
        text: |
          There's [[our file]] in the index directory. Blue files are
          in the current root. Gray ones are no longer in the root, but
          are still on disk.

      - id: zoom
        view: { camera: disk, target: bolt }
        code: [persister.direct, persister.protected]
        text: |
          [[root.bolt]] holds a few snapshot records, each listing its
          files. A zap file only counts for crash recovery once a
          `root.bolt` record lists it. The newest record, outlined, is
          what our persister just committed: it lists our file, under
          the epoch of the snapshot the persister started from. cbft keeps 3 snapshots, spaced
          10 minutes apart, as *rollback points*.

  # ------------------------------------------------------------------
  - id: merger
    title: "The merger"
    color: scorch
    steps:

      - id: zoom
        view: { camera: merger, target: merger, token: auto }
        text: |
          Lots of small files would make every query slower. So
          [[the merger]] compacts them. Our marker is back on our file
          segment in the root.

      - id: open
        view: { open: [merger], target: mergerInside }
        code: [merger.loop, merger.planMergeAtSnapshot]
        text: |
          It works on file segments only, in [[four phases]]: wait for
          a newly persisted epoch, plan, merge one task at a time, and
          introduce each result. The merger is paced by the persister,
          and as we'll see, the persister is paced by the merger.

      - id: merged
        sim: { until: merged }
        view: { target: ourSeg }
        expect: ["reached:merged"]
        code: [introducer.introduceMerge]
        text: |
          Our file was just merged with others into [[a bigger file]].
          Any deletes that happened while the merge ran are remapped
          into the new segment by the introducer.

      - id: make-room
        view: { camera: mergerDetail, target: merger }
        text: |
          How does [[the merger]] decide what to merge? Let's make room
          below it.

      - id: detail
        view: { bubble: [merger], plan: budget, target: stairs }
        code: [mergeplan.plan, mergeplan.CalcBudget, cbft.persisterDefaults]
        text: |
          With [[a staircase]]. bleve's tiered merge policy, a cousin
          of Lucene's, first sets a *budget*: how many files the index
          may have. Take an example index with 1.3GB of live data. The
          first tier is up to 10 files at the floor size (cbft sets
          `floorSegmentFileSize` to 20MB), each tier above is 10×
          bigger, and tiers stack until all the bytes fit. Here that's
          10 small stairs and 6 bigger ones: a budget of 16 files.

      - id: files
        view: { plan: files, target: stairFiles }
        text: |
          Now [[the actual files]], biggest first, as `Plan()` sorts
          them: a few big ones from earlier merges, and a tail of small
          fresh ones that the persister keeps writing.

      - id: over
        view: { plan: over, target: stairOver }
        text: |
          Twenty files on a budget of 16: there are more files than
          stairs, so [[the last four]] are over budget, and the planner
          must merge.

      - id: pick
        view: { plan: pick, target: stairPick }
        code: [mergeplan.plan, mergeplan.ScoreSegments]
        text: |
          Which files? The planner slides a window along the sorted
          files and scores every run of up to 10. Lower is better: runs
          of similar sizes win, since merging a big file with small
          ones rewrites the big one for little gain, and files with
          many deletes get a bonus. Here [[the winner]] is the ten
          smallest.

      - id: merged-file
        view: { plan: merged, target: stairMerged }
        text: |
          They become [[one 39MB file]], a step up the staircase, and
          eleven files fit the budget. A byte is rewritten about once
          per tier it climbs, so a few times over its life, rather than
          on every merge.

      - id: ours
        view: { plan: live, target: mergerDetail }
        expect: [filesWithinBudget]
        text: |
          Back to [[our own index]]. It's still small, a stair or two,
          and the merge our file was part of brought it back within
          budget, so the next plan will have nothing to do until more
          files arrive.

      - id: detail-close
        view: { unbubble: [merger], target: mergerInside }
        text: |
          The files our docs used to live in are no longer in the root,
          so [[the merger's work]] has left garbage on disk.

      - id: to-disk
        view: { camera: disk, target: disk, token: file }
        code: [persister.removeOldData]
        text: |
          Old files stay in [[the directory]] until no remaining
          `root.bolt` record lists them. The persister cleans up only
          when it's idle, so under steady ingest, garbage accumulates
          for a while.

  # ------------------------------------------------------------------
  - id: meanwhile
    title: "Meanwhile, ingest goes on"
    color: scorch
    steps:

      - id: zoom
        view: { camera: root, target: root, token: hide }
        text: |
          So far we've paused new mutations from KV, so
          [[the root]] held still while the persister and the merger
          worked. Real indexes don't get that break.

      - id: resume
        sim: { set: { ingestDocsPerSec: 8000 } }
        view: { target: root }
        text: |
          Let's turn new mutations from KV back on, and keep watching
          [[the root]].

      - id: moving
        sim: { minTimeMs: 9705 }
        view: { target: olderRoots }
        expect: [persisterHoldsOlderRoot, rootMovedPastPersister]
        text: |
          Batches keep being introduced while the persister works.
          The root moves on, epoch after epoch, while the persister
          still holds [[the one it started from]].

      - id: group-commit
        sim: { minTimeMs: 10100 }
        view: { target: persister }
        expect: [persisterHoldsOlderRoot]
        code: [persister.loop]
        text: |
          When it's done, [[the persister]] doesn't go back for the
          epochs it missed. It takes a ref on the latest root and
          persists that, so one persist covers many batches: a group
          commit.

      - id: to-disk
        view: { camera: disk, target: disk, token: file }
        text: |
          Each persist also gives the persister a chance to clean up
          [[the directory]].

      - id: deleted
        sim: { until: oldFileDeleted }
        view: { target: deletedFile }
        expect: ["reached:oldFileDeleted"]
        code: [persister.removeOldZapFiles]
        text: |
          And there it goes: one of our old files was
          [[deleted]]. Our docs live on in the merged file.

  # ------------------------------------------------------------------
  - id: together
    title: "All together"
    color: neutral
    steps:

      - id: live
        view: { camera: overview, target: root, token: hide }
        text: |
          That's the whole path for one batch, from KV down to a merged
          file on disk, through [[the root snapshot]].

      - id: running
        view: { ui: full, target: root }
        sim: { speed: 1 }
        text: |
          Now let's let the simulation run, and bring in the controls
          and some charts. The charts track numbers you'd see in cbft's
          stats, such as `num_root_memorysegments`,
          `num_files_on_disk` and `num_bytes_used_disk`. Leader lines
          show what each one measures, like [[the root snapshot]].

          From here on, you can pause, change the speed, or open the
          knobs.

  # ------------------------------------------------------------------
  - id: slowdisk
    title: "Scenario: a slow disk"
    color: disk
    steps:

      - id: setup
        sim: { reset: { config: { memQuotaBytes: 536870912 } }, minTimeMs: 6000, speed: 1 }
        view: { target: persister }
        text: |
          A fresh index, running normally. Now the disk gets slow, say
          from a noisy neighbor or a long fsync stall. Watch
          [[the persister]].

      - id: slow
        sim: { set: { diskWriteMBps: 4, fsyncMs: 2500 } }
        view: { target: writes }
        code: [zapx.persist, persister.direct]
        text: |
          Each fsync now takes 2.5s, and writes crawl at 4MB/s. The
          persister is stuck [[writing files]].

      - id: zoom
        view: { camera: root, target: root, chart: memUsed }
        text: |
          But ingest carries on at full speed: with `unsafe_batch`,
          `Batch()` never waits for the persister. So in-memory
          segments pile up in [[the root]].

      - id: climb
        sim: { minTimeMs: 23000 }
        view: { target: root, chart: memUsed }
        expect: [overHalfQuota, memSegsPilingUp]
        text: |
          Scorch itself has no cap on in-memory segments, so memory
          keeps climbing toward the quota. Memory is only freed when a
          whole persist cycle finishes, because [[the root]] and the
          persister's own snapshot both still reference the segments.

      - id: herder
        view: { camera: cbft, target: gate, chart: memUsed }
        expect: [herderBlocking]
        code: [herder.checkAndBlockBatch, herder.checkAndBlockIndex]
        text: |
          Over quota, [[the app herder]] blocks batch workers inside
          `Scorch.Batch()`. Since `batch.Index()` fires an event too,
          it also blocks the DCP goroutine directly.

      - id: kv
        view: { camera: top, target: buffer, chart: dcpBuf }
        sim: { minTimeMs: 27000 }
        multi: true
        expect: [kvPaused]
        code: [cbgt.dcpBuffer]
        text: |
          A blocked DCP goroutine stops acking, so
          [[the DCP buffer]] fills, and KV stops sending.
          `num_mutations_to_index` grows, and
          `curr_batches_blocked_by_herder` is above zero. Nothing is
          lost: the DCP stream resumes where it paused.

      - id: nonap
        view: { camera: persister, target: persisterInside }
        code: [scorch.fireEvent, persister.pause]
        text: |
          Meanwhile scorch notices that the herder is blocking, because
          blocked callbacks count toward `NumEventsBlocking()`. The
          persister [[skips its nap]] while anything is blocked, so
          it flushes as fast as it can.

      - id: heal
        sim: { set: { diskWriteMBps: 400, fsyncMs: 4 } }
        view: { target: persisterInside }
        text: |
          The disk recovers. [[The persister]] drains the backlog with
          large in-memory merges. Memory falls, the herder wakes its
          waiters, and DCP flows again.

      - id: safe-zoom
        view: { camera: top, target: workers }
        text: |
          **An aside: what if `unsafe_batch` were false**, bleve's own
          default? Watch [[the batch workers]].

      - id: safe
        sim: { reset: { config: { unsafeBatch: false } }, minTimeMs: 6000, speed: 0.5 }
        view: { target: workers }
        expect: [safeBatchesSlow]
        code: [scorch.prepareSegment, persister.defaults]
        text: |
          Now `Batch()` waits for persistence, and
          [[the workers]] spend most of their time stalled. Every
          batch's latency includes a whole persist cycle, including
          cbft's 2s nap. That's why bleve's default nap is 0, and why
          its code comment tells "unsafe batch users" to raise it. cbft
          chose introduce-then-persist, with the herder as the safety
          net.

  # ------------------------------------------------------------------
  - id: ingest
    title: "Scenario: a huge ingest"
    color: cbft
    steps:

      - id: build
        sim: { reset: { config: { ingestDocsPerSec: 60000, dcpSnapshotMeanDocs: 2000, updateFraction: 0 } }, minTimeMs: 12000, speed: 1 }
        view: { target: workers }
        expect: [kvHasPaused, analysisSaturated]
        text: |
          **An initial index build, or a rebalance.** DCP backfill
          sends huge snapshots, so batches always fill to 200 ops, and
          the rate jumps to 60,000 docs/s. KV pauses from time to time
          because [[the workers]] can't keep up.

      - id: cpu
        view: { camera: scorchTop, target: analysis }
        text: |
          The bottleneck is [[the analysis queue]]. All four workers
          compete for one analyzer per CPU. This is just CPU-bound, not
          a problem.

      - id: files
        view: { camera: lower, target: disk, chart: files }
        code: [mergeplan.plan]
        text: |
          The persister turns out ~20MB files, and the merger merges
          them in tiers, rewriting the same bytes several times
          (`total_compaction_written_bytes`). Watch
          [[the directory]] and the files chart.

      - id: slowmerger
        sim: { reset: { config: { ingestDocsPerSec: 30000, dcpSnapshotMeanDocs: 2000, updateFraction: 0, persisterNapUnderNumFiles: 40, fileMergeMBps: 6, memQuotaBytes: 805306368 } }, minTimeMs: 20000, speed: 1 }
        view: { target: persisterInside, chart: files }
        expect: [persisterPausedForMerger, memSegsPilingUp]
        code: [persister.pause]
        text: |
          **When the merger can't keep up**, the file count climbs. At
          `PersisterNapUnderNumFiles` files (1000 in production,
          **40 here** so you don't have to wait), the persister
          [[pauses]] until the merger reports progress.

      - id: herder
        view: { camera: cbft, target: gate, chart: memUsed }
        expect: [herderBlocking]
        text: |
          A paused persister means in-memory segments pile up again,
          and we're back to [[the herder]] blocking ingest. This time
          compaction is the cause, not the disk.

  # ------------------------------------------------------------------
  - id: query
    title: "Scenario: a slow query"
    color: scorch
    steps:

      - id: zoom
        view: { camera: root, target: root }
        text: |
          Last scenario: a query. Every search opens a reader on
          [[the current root snapshot]].

      - id: pin
        sim: { reset: { config: { rollbackSamplingIntervalMs: 0, numSnapshotsToKeep: 1 } }, minTimeMs: 6000, query: { durationMs: 45000, timeoutMs: 60000, label: "slow query" }, speed: 1 }
        view: { target: queries }
        expect: [queryRunning]
        code: [bleve.SearchInContext, scorch.currentSnapshot]
        text: |
          [[A query]] starts and `AddRef`s the current root snapshot,
          holding it until it's done. That keeps the query consistent:
          it sees one immutable set of segments, whatever happens
          meanwhile. This one will be slow, as with a huge wildcard
          query. (Rollback points are off here, to make the effect
          easier to see.)

      - id: pinned
        sim: { minTimeMs: 16000 }
        view: { target: olderRoots }
        expect: [queryRunning, zombies]
        code: [snapshot.refcount, zapx.closeActual]
        text: |
          The root moves on, but [[the query's snapshot]] stays alive
          behind it, and still references the old segments. Their memory can't be freed,
          and their files stay open and mmapped.

      - id: zombies
        view: { camera: disk, target: zombies, chart: files }
        expect: [zombies]
        code: [persister.removeOldZapFiles]
        text: |
          `removeOldZapFiles()` decides what to delete by what
          `root.bolt` lists, not by refcounts. So files the query still
          has mmapped get `os.Remove()`d anyway. On Linux their blocks
          stay allocated until the last mapping goes away. These
          [[unlinked but open]] files don't show up in
          `num_bytes_used_disk`, which lists the directory, but they do
          show up in `df`.

          (This is our reading of the code, reproduced in the model.
          Verify it on a real system before relying on it.)

      - id: release
        sim: { minTimeMs: 53000 }
        view: { target: zombies }
        expect: [noQueries, noZombies]
        text: |
          When the query finishes, it releases its snapshot, and the
          [[unlinked files]] are finally closed and freed. cbft's
          default query timeout of 10s bounds this, but a request can
          ask for longer. `/api/query` lists long-running queries, and
          `/api/query/{id}/cancel` kills one.

  # ------------------------------------------------------------------
  - id: sandbox
    title: "Your turn"
    color: neutral
    steps:

      - id: overview
        view: { camera: overview }
        text: |
          Use **Knobs** above the diagram to change the workload,
          cbft's and scorch's settings, or the modeled costs. You can
          also start a slow query or make the disk sick.

      - id: sandbox
        sandbox: true
        sim: { reset: true, minTimeMs: 3000, speed: 1 }
        text: |
          Things to try:

          - Set `persisterNapMs` to 0 (bleve's default) and watch for
            more, smaller files and more merging.
          - Set `numPersisterWorkers` to 1 and
            `maxSizeInMemoryMergePerWorker` to 0, for bleve's legacy
            single in-memory merge.
          - Raise `deleteFraction`, and watch `ReclaimDeletesWeight`
            steer the merger toward segments with many deletes.
          - Turn `herderEnabled` off, then make the disk slow. Memory
            just keeps growing.
