  # The page ends here for now: the chapters below are drafts, not yet
  # reviewed. They're still validated and simulated by the tests.
  - stop: drafts below, not yet reviewed

  # ------------------------------------------------------------------
  - id: meanwhile
    title: "Meanwhile, ingest goes on"
    color: scorch
    steps:

      - id: zoom
        view: { camera: swap, target: root, token: hide }
        text: |
          So far we've paused new mutations from KV, so
          [[the root]] held still while the persister and the merger
          worked. Real indexes don't get that break.

      - id: resume
        sim: { set: { ingestDocsPerSec: 8000 } }
        view: { target: root }
        text: |
          Let's turn new mutations from KV back on, and keep watching
          [[the root]].

      - id: woken
        sim: { until: watcherClosed }
        view: { target: introWatchers }
        expect: ["reached:watcherClosed"]
        code: [introducer.loop]
        text: |
          The first new batch's root is newer than 356, so after
          swapping it in, the introducer closes
          [[the persister's watcher]]. The persister is napping, so it
          will find the new root when its nap ends.

      - id: moving
        sim: { minTimeMs: 9740 }
        view: { target: olderRoots }
        expect: [persisterHoldsOlderRoot, rootMovedPastPersister]
        text: |
          Batches keep being introduced while the persister works.
          The root moves on, epoch after epoch, while the persister
          still holds [[the one it started from]].

      - id: group-commit
        sim: { minTimeMs: 10080 }
        view: { target: persister }
        expect: [persisterHoldsOlderRoot]
        code: [persister.loop]
        text: |
          When it's done, [[the persister]] doesn't go back for the
          epochs it missed. It takes a ref on the latest root and
          persists that, so one persist covers many batches: a group
          commit.

      - id: to-disk
        view: { camera: disk, target: disk, token: file }
        text: |
          Each persist also gives the persister a chance to clean up
          [[the directory]].

      - id: deleted
        sim: { until: oldFileDeleted }
        view: { target: deletedFile }
        expect: ["reached:oldFileDeleted"]
        code: [persister.removeOldZapFiles]
        text: |
          And there it goes: one of our old files was
          [[deleted]]. Our docs live on in the merged file.

  # ------------------------------------------------------------------
  - id: together
    title: "All together"
    color: neutral
    steps:

      - id: live
        view: { camera: overview, target: root, token: hide }
        text: |
          That's the whole path for one batch, from KV down to a merged
          file on disk, through [[the root snapshot]].

      - id: running
        view: { ui: full, target: root }
        sim: { speed: 1 }
        text: |
          Now let's let the simulation run, and bring in the controls
          and some charts. The charts track numbers you'd see in cbft's
          stats, such as `num_root_memorysegments`,
          `num_files_on_disk` and `num_bytes_used_disk`. Leader lines
          show what each one measures, like [[the root snapshot]].

          From here on, you can pause, change the speed, or open the
          knobs.

  # ------------------------------------------------------------------
  - id: slowdisk
    title: "Scenario: a slow disk"
    color: disk
    steps:

      - id: setup
        sim: { reset: { config: { memQuotaBytes: 536870912 } }, minTimeMs: 6000, speed: 1 }
        view: { target: persister }
        text: |
          A fresh index, running normally. Now the disk gets slow, say
          from a noisy neighbor or a long fsync stall. Watch
          [[the persister]].

      - id: slow
        sim: { set: { diskWriteMBps: 4, fsyncMs: 2500 } }
        view: { target: writes }
        code: [zapx.persist, persister.direct]
        text: |
          Each fsync now takes 2.5s, and writes crawl at 4MB/s. The
          persister is stuck [[writing files]].

      - id: zoom
        view: { camera: root, target: root, chart: memUsed }
        text: |
          But ingest carries on at full speed: with `unsafe_batch`,
          `Batch()` never waits for the persister. So in-memory
          segments pile up in [[the root]].

      - id: climb
        sim: { minTimeMs: 23000 }
        view: { target: root, chart: memUsed }
        expect: [overHalfQuota, memSegsPilingUp]
        text: |
          Scorch itself has no cap on in-memory segments, so memory
          keeps climbing toward the quota. Memory is only freed when a
          whole persist cycle finishes, because [[the root]] and the
          persister's own snapshot both still reference the segments.

      - id: herder
        view: { camera: cbft, target: gate, chart: memUsed }
        expect: [herderBlocking]
        code: [herder.checkAndBlockBatch, herder.checkAndBlockIndex]
        text: |
          Over quota, [[the app herder]] blocks batch workers inside
          `Scorch.Batch()`. Since `batch.Index()` fires an event too,
          it also blocks the DCP goroutine directly.

      - id: kv
        view: { camera: top, target: buffer, chart: dcpBuf }
        sim: { minTimeMs: 27000 }
        multi: true
        expect: [kvPaused]
        code: [cbgt.dcpBuffer]
        text: |
          A blocked DCP goroutine stops acking, so
          [[the DCP buffer]] fills, and KV stops sending.
          `num_mutations_to_index` grows, and
          `curr_batches_blocked_by_herder` is above zero. Nothing is
          lost: the DCP stream resumes where it paused.

      - id: nonap
        view: { camera: persister, target: persisterInside }
        code: [scorch.fireEvent, persister.pause]
        text: |
          Meanwhile scorch notices that the herder is blocking, because
          blocked callbacks count toward `NumEventsBlocking()`. The
          persister [[skips its nap]] while anything is blocked, so
          it flushes as fast as it can.

      - id: heal
        sim: { set: { diskWriteMBps: 400, fsyncMs: 4 } }
        view: { target: persisterInside }
        text: |
          The disk recovers. [[The persister]] drains the backlog with
          large in-memory merges. Memory falls, the herder wakes its
          waiters, and DCP flows again.

      - id: safe-zoom
        view: { camera: top, target: workers }
        text: |
          **An aside: what if `unsafe_batch` were false**, bleve's own
          default? Watch [[the batch workers]].

      - id: safe
        sim: { reset: { config: { unsafeBatch: false } }, minTimeMs: 6000, speed: 0.5 }
        view: { target: workers }
        expect: [safeBatchesSlow]
        code: [scorch.prepareSegment, persister.defaults]
        text: |
          Now `Batch()` waits for persistence, and
          [[the workers]] spend most of their time stalled. Every
          batch's latency includes a whole persist cycle, including
          cbft's 2s nap. That's why bleve's default nap is 0, and why
          its code comment tells "unsafe batch users" to raise it. cbft
          chose introduce-then-persist, with the herder as the safety
          net.

  # ------------------------------------------------------------------
  - id: ingest
    title: "Scenario: a huge ingest"
    color: cbft
    steps:

      - id: build
        sim: { reset: { config: { ingestDocsPerSec: 60000, dcpSnapshotMeanDocs: 2000, updateFraction: 0 } }, minTimeMs: 12000, speed: 1 }
        view: { target: workers }
        expect: [kvHasPaused, analysisSaturated]
        text: |
          **An initial index build, or a rebalance.** DCP backfill
          sends huge snapshots, so batches always fill to 200 ops, and
          the rate jumps to 60,000 docs/s. KV pauses from time to time
          because [[the workers]] can't keep up.

      - id: cpu
        view: { camera: scorchTop, target: analysis }
        text: |
          The bottleneck is [[the analysis queue]]. All four workers
          compete for one analyzer per CPU. This is just CPU-bound, not
          a problem.

      - id: files
        view: { camera: lower, target: disk, chart: files }
        code: [mergeplan.plan]
        text: |
          The persister turns out ~20MB files, and the merger merges
          them in tiers, rewriting the same bytes several times
          (`total_compaction_written_bytes`). Watch
          [[the directory]] and the files chart.

      - id: slowmerger
        sim: { reset: { config: { ingestDocsPerSec: 30000, dcpSnapshotMeanDocs: 2000, updateFraction: 0, persisterNapUnderNumFiles: 40, fileMergeMBps: 6, memQuotaBytes: 805306368 } }, minTimeMs: 20000, speed: 1 }
        view: { target: persisterInside, chart: files }
        expect: [persisterPausedForMerger, memSegsPilingUp]
        code: [persister.pause]
        text: |
          **When the merger can't keep up**, the file count climbs. At
          `PersisterNapUnderNumFiles` files (1000 in production,
          **40 here** so you don't have to wait), the persister
          [[pauses]] until the merger reports progress.

      - id: herder
        view: { camera: cbft, target: gate, chart: memUsed }
        expect: [herderBlocking]
        text: |
          A paused persister means in-memory segments pile up again,
          and we're back to [[the herder]] blocking ingest. This time
          compaction is the cause, not the disk.

  # ------------------------------------------------------------------
  - id: query
    title: "Scenario: a slow query"
    color: scorch
    steps:

      - id: zoom
        view: { camera: root, target: root }
        text: |
          Last scenario: a query. Every search opens a reader on
          [[the current root snapshot]].

      - id: pin
        sim: { reset: { config: { rollbackSamplingIntervalMs: 0, numSnapshotsToKeep: 1 } }, minTimeMs: 6000, query: { durationMs: 45000, timeoutMs: 60000, label: "slow query" }, speed: 1 }
        view: { target: queries }
        expect: [queryRunning]
        code: [bleve.SearchInContext, scorch.currentSnapshot]
        text: |
          [[A query]] starts and `AddRef`s the current root snapshot,
          holding it until it's done. That keeps the query consistent:
          it sees one immutable set of segments, whatever happens
          meanwhile. This one will be slow, as with a huge wildcard
          query. (Rollback points are off here, to make the effect
          easier to see.)

      - id: pinned
        sim: { minTimeMs: 16000 }
        view: { target: olderRoots }
        expect: [queryRunning, zombies]
        code: [snapshot.refcount, zapx.closeActual]
        text: |
          The root moves on, but [[the query's snapshot]] stays alive
          behind it, and still references the old segments. Their memory can't be freed,
          and their files stay open and mmapped.

      - id: zombies
        view: { camera: disk, target: zombies, chart: files }
        expect: [zombies]
        code: [persister.removeOldZapFiles]
        text: |
          `removeOldZapFiles()` decides what to delete by what
          `root.bolt` lists, not by refcounts. So files the query still
          has mmapped get `os.Remove()`d anyway. On Linux their blocks
          stay allocated until the last mapping goes away. These
          [[unlinked but open]] files don't show up in
          `num_bytes_used_disk`, which lists the directory, but they do
          show up in `df`.

          (This is our reading of the code, reproduced in the model.
          Verify it on a real system before relying on it.)

      - id: release
        sim: { minTimeMs: 53000 }
        view: { target: zombies }
        expect: [noQueries, noZombies]
        text: |
          When the query finishes, it releases its snapshot, and the
          [[unlinked files]] are finally closed and freed. cbft's
          default query timeout of 10s bounds this, but a request can
          ask for longer. `/api/query` lists long-running queries, and
          `/api/query/{id}/cancel` kills one.

  # ------------------------------------------------------------------
  - id: sandbox
    title: "Your turn"
    color: neutral
    steps:

      - id: overview
        view: { camera: overview }
        text: |
          Use **Knobs** above the diagram to change the workload,
          cbft's and scorch's settings, or the modeled costs. You can
          also start a slow query or make the disk sick.

      - id: sandbox
        sandbox: true
        sim: { reset: true, minTimeMs: 3000, speed: 1 }
        text: |
          Things to try:

          - Set `persisterNapMs` to 0 (bleve's default) and watch for
            more, smaller files and more merging.
          - Set `numPersisterWorkers` to 1 and
            `maxSizeInMemoryMergePerWorker` to 0, for bleve's legacy
            single in-memory merge.
          - Raise `deleteFraction`, and watch `ReclaimDeletesWeight`
            steer the merger toward segments with many deletes.
          - Turn `herderEnabled` off, then make the disk slow. Memory
            just keeps growing.
