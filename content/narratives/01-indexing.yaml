# The first explainer: scorch's goroutines and backpressure, as driven
# by cbft. See README.md for the schema; `npm test` validates it,
# including the rule that each step changes only one thing: the
# camera, the lids, a detail bubble, the UI, or the simulation.

explainer: scorch-goroutines
next: 02-zap-format
title: "Inside bleve / scorch: introducer, persister, merger"
subtitle: >-
  How a Couchbase FTS index turns a stream of DCP mutations into
  searchable, durable segments.
audience: Couchbase engineers and support

sim:
  seed: 7
  config: {}

chapters:

  # ------------------------------------------------------------------
  - id: picture
    title: "The big picture"
    color: neutral
    steps:

      - id: layers
        sim: { reset: true, minTimeMs: 6010, speed: 0 }
        view: { camera: overview, target: cbftLid }
        expect: [kvFlowing, herderIdle]
        text: |
          Consider a single FTS index partition (a *pindex*) on a single node.
          In this diagram, data flows from top to bottom. The big box in the middle is
          [[the cbft process]], the search service of Couchbase Server.

          The diagram is a **simulation**. We'll follow
          goroutines and the control flow of cbft and bleve
          code.

      - id: kv
        view: { target: kvLid }
        text: |
          Mutations start in [[KV]], a separate process, that is the "key-value"
          server of Couchbase Server. These mutations are transmitted to
          cbft over the network, as a DCP stream.

      - id: disk
        view: { target: diskLid }
        text: |
          They end up as segment files in the index's directory, on
          [[disk]].

  # ------------------------------------------------------------------
  - id: cbft
    title: "KV and cbft"
    color: cbft
    steps:

      - id: zoom
        view: { camera: top, target: kvLid }
        text: |
          Let's drill down into the hop between [[KV]] and cbft.

      - id: kv-open
        view: { open: [kv], target: buffer }
        code: [cbgt.dcpBuffer]
        text: |
          KV sends DCP *snapshots*: runs of mutations for one vbucket.
          These wait in a 20MB [[flow-control buffer]] until cbft acks
          them. When that buffer fills, KV pauses sending until cbft drains it.

      - id: cbft-open
        view: { open: [cbft], target: dcp }
        code: [cbft.dataUpdate, bleve.BatchIndex, cbft.updateSeq]
        text: |
          gocbcore calls cbft's `DataUpdate()` for every received mutation,
          synchronously, on [[the DCP goroutine]]. It maps the document
          (`batch.Index()`) into that vbucket's `bleve.Batch`.

          A batch is handed off at the end of the DCP snapshot, or at
          200 mutations (`BleveMaxOpsPerBatch`), whichever comes first.

      - id: workers
        view: { target: workers }
        code: [cbft.submitAsync, cbft.runBatchWorker, cbft.batchDefaults]
        text: |
          Batches go to one of [[4 batch workers]], shown stacked here with
          batch worker 0 in front. Each worker has a channel of capacity 1.
          It merges what arrives into one bigger batch, and executes it
          at 200 ops or when its 100ms ticker fires.

          Every box is a goroutine, colored by its state:
          <span class="st st-busy">busy</span>,
          <span class="st st-sleep">napping</span>,
          <span class="st st-wait">waiting for work</span>, or
          <span class="st st-stall">stalled by backpressure</span>.

      - id: follow
        sim: { follow: alone, until: dcp }
        view: { target: ourBatch }
        expect: ["reached:dcp"]
        text: |
          Now let's **follow one batch**, depicted as a small chip
          with the orange outline, which will travel through the diagram as
          you scroll.

          Our batch is being built right now by [[the DCP goroutine]].

          To keep the story simple, we let the batches already in
          flight finish, then had KV send just the mutations for our
          batch and pause. So our batch travels alone, and nothing
          else changes the index while we follow it. In a real system
          batches keep coming, many at once; we'll turn them back on
          later.

      - id: to-channel
        sim: { until: channel }
        view: { target: ourBatch }
        expect: ["reached:channel"]
        code: [cbft.submitAsync]
        text: |
          The batch is complete. The DCP goroutine puts it into
          [[a worker's channel]], a slot that holds just one batch.
          Which worker is fixed by the vbucket number, so each
          vbucket's batches stay in order.

      - id: to-worker
        sim: { until: worker }
        view: { target: ourBatch }
        expect: ["reached:worker"]
        text: |
          [[Its batch worker]], worker 0,
          takes the batch from the channel and holds it, merging in any
          more that arrive, until it reaches 200 ops or the ticker
          fires. If the slot had still been full, the DCP goroutine
          would have had to wait.

      - id: to-herder
        sim: { until: herder }
        view: { target: gate }
        expect: ["reached:herder"]
        code: [herder.onScorchEvent, herder.checkAndBlockBatch, herder.overQuota]
        text: |
          The worker calls `bindex.Batch()`, which goes into bleve. The
          first thing scorch's `Batch()` does is fire an event that
          cbft hooks: still on the worker goroutine, [[the app herder]]
          checks process memory against the indexing quota (65% of the
          FTS memory quota), and would hold the batch right here if it
          were over. Right now we're well under it, so our batch may
          continue.

      - id: into-bleve
        sim: { until: analysis }
        view: { target: ourBatch }
        expect: ["reached:analysis"]
        code: [cbft.execute]
        text: |
          Through the gate, [[our batch]] goes on into the bleve
          library, still on cbft's worker goroutine: bleve runs in the
          same process.

  # ------------------------------------------------------------------
  - id: scorch
    title: "Into bleve and scorch"
    color: scorch
    steps:

      - id: step-back
        view: { camera: process, target: bleveLid }
        text: |
          Step back for a moment. Our batch is now being processed by
          [[the bleve library]]. bleve is
          linked into the cbft process, and we're still on the same batch worker
          goroutine from cbft.

      - id: bleve-open
        view: { open: [bleve], target: bleveNote }
        code: [cbft.execute]
        text: |
          bleve's top layer is [[what applications program against]]:
          bleve's index API, document mapping (which already ran, back in
          the DCP goroutine's `batch.Index()`), and text analysis.
          Underneath sits a pluggable index implementation. cbft uses the
          *scorch* implementation.

      - id: scorch-open
        view: { open: [scorch], target: introducer }
        text: |
          Inside scorch we see: `Scorch.Batch()`, the root snapshot
          in the middle, and three goroutines in their own boxes:
          [[the introducer]], the persister and the merger.

      - id: zoom-top
        view: { camera: scorchTop, target: batch }
        code: [scorch.Batch]
        text: |
          The worker's `bindex.Batch()` goes through bleve's
          `index.Batch()` to [[Scorch.Batch()]], scorch's entry point.
          all running on cbft's worker goroutine, and it doesn't
          return until the batch has been fully 'introduced'.

      - id: analysis
        view: { target: analysis }
        code: [scorch.batchAnalysis, scorch.analyze]
        text: |
          First comes analysis. For that, scorch calls across to a
          utility that bleve provides to its index implementations:
          [[bleve's analysis queue]]. `Batch()`
          starts a goroutine that queues one closure per document,
          then waits until every result has come back.

      - id: queue
        view: { target: analysis }
        code: [bleve.analysisQueue, cbft.analysisQueueSize]
        text: |
          The analysis queue is a pool of worker goroutines that bleve initializes
          once per process, controlled via `bleve.Config`, where cbft sizes this to the
          number of CPUs. Its channel is unbuffered, so `Queue()`
          blocks until an analysis queue worker is free.

          Every FTS index in the cbft node shares [[this one pool]] of analysis queue workers.

      - id: make-room
        view: { camera: analysisDetail, target: analysis }
        text: |
          What does [[an analyzer]] actually do? Let's make room beside
          it.

      - id: analyzer
        view: { bubble: [analysis], target: analysisDetail }
        code: [scorch.analyze]
        text: |
          Following the index definition, for each indexed field, there's
          an index mapping analyzer which runs
          [[an analysis pipeline]]: a tokenizer splits the text into tokens, then
          token filters lowercase them, drop stop words and stem them.
          What's left are terms with their positions, ready to become a
          segment's dictionary and postings.

          It's all CPU work, and usually the biggest share of the CPU
          that indexing uses.

      - id: analyzer-close
        view: { unbubble: [analysis], target: analysis }
        text: |
          Because the pool is shared and sized to the CPUs, a burst of
          ingest anywhere on the node can make [[the queue]] the
          bottleneck. Batches wait their turn, their batch workers stay
          blocked in `Batch()`, the DCP goroutine can't hand off its
          next batch, and the pressure backs up toward KV.

      - id: back
        view: { camera: scorchTop, target: batch, flow: analysis }
        text: |
          Back in scorch, [[Scorch.Batch()]] is waiting for our batch's
          analysis results.

      - id: built
        sim: { until: built }
        view: { target: ourBatch }
        expect: ["reached:built"]
        code: [scorch.Batch]
        text: |
          Analysis is done, and `Scorch.Batch()` has built
          [[our segment]] from the results (`NewUsing()`): an
          in-memory zap segment holding our batch's docs. From here
          on, it's our segment we follow.

      - id: handoff
        sim: { until: introducing }
        view: { target: ourBatch }
        expect: ["reached:introducing"]
        code: [scorch.prepareSegment]
        text: |
          `Batch()` wraps [[our segment]] in an introduction and sends
          it to the introducer over the `introductions` channel. Then
          it waits until the introducer has applied it.

      - id: follow
        view: { camera: swap, target: introducer }
        text: |
          Let's follow our segment into [[the introducer]].

      - id: introduced
        sim: { until: introduced }
        view: { swap: copy, target: root }
        expect: ["reached:introduced", ourSegInMemory]
        code: [introducer.introduceSegment]
        text: |
          The introducer is the only goroutine that may change the
          index's *root*: an immutable snapshot listing the segments
          and their deleted docs. It never edits the root in place.
          It starts [[a new root]] from a copy of the current one's
          segment list.

      - id: appended
        view: { swap: add, target: ourSeg }
        code: [introducer.introduceSegment]
        text: |
          It appends [[our segment]] to that list.

      - id: next-epoch
        view: { swap: epoch, target: rootEpoch }
        code: [introducer.introduceSegment]
        text: |
          It gives the new root [[the next epoch]].

      - id: swapped-in
        view: { swap: settle, target: root }
        expect: [onlyRootLive]
        text: |
          Then it swaps [[the new root]] in, and lets go of its ref on
          the old one. Once `Batch()` drops the ref it took earlier
          (to check our docs against the old root), nothing holds the
          old root, and it's freed.

      - id: our-segment
        view: { camera: root, target: ourSeg }
        expect: [ourSegInMemory]
        code: [cbft.kvConfig, cbft.execute]
        text: |
          Our docs are now [[this in-memory segment]], in orange.
          Queries that start from now on can see them.

          cbft runs scorch with `unsafe_batch: true`, so `Batch()`
          returns right here, before anything is on disk. That's also
          when `at_plus` consistency waiters are released.
          **"Consistent" in FTS means searchable, not durable.**

  # ------------------------------------------------------------------
  - id: introducer
    title: "Inside the introducer"
    color: scorch
    steps:

      - id: zoom
        view: { camera: introducer, target: introducer }
        text: |
          A closer look at [[the introducer]].

      - id: open
        view: { open: [introducer], target: select }
        code: [introducer.loop, introducer.introducePersist]
        text: |
          It's [[a select loop]] over four channels: batches being
          introduced (`introductions`), files the persister wrote
          directly (`persists`), merge results (`merges`, from the
          merger and, as we'll see, from the persister too), and
          "wake me after epoch N" requests (`introducerNotifier`,
          shown as `watchers`). Each batch, persist or merge produces a
          new root and bumps the epoch; a wake-me request just waits in
          a list.

          Go's `select` picks randomly among ready channels, so
          batches, persists and merges take turns fairly.

  # ------------------------------------------------------------------
  - id: persister
    title: "The persister"
    color: scorch
    steps:

      - id: zoom
        view: { camera: persister, target: persister }
        text: |
          Our segment is searchable, but only in memory. Making it
          durable is the job of [[the persister]].

      - id: open
        view: { open: [persister], target: persisterInside }
        code: [persister.pause, cbft.napDefaults, persister.defaults]
        text: |
          The persister works in [[four phases]]. First it naps for up
          to 2 seconds (cbft's setting; bleve's default is 0), letting
          in-memory segments pile up, unless the herder is holding
          batches back. Then it merges them into ~20MB
          files with up to 4 workers, and commits.

      - id: cut
        sim: { until: flushables }
        view: { target: persisterInside }
        expect: ["reached:flushables"]
        code: [persister.maybeMerge]
        text: |
          The persister woke up and took a ref on the root snapshot.
          Nothing was handed to it: it found our segment in that root.
          It [[cut the root's in-memory segments]] into *flushables*:
          runs of neighbors of about 20MB each. Up to 4 workers take
          them, one flushable each at a time. Ours is in one of them.

      - id: persisting
        sim: { until: persisting }
        view: { target: ourBatch }
        expect: ["reached:persisting"]
        code: [persister.maybeMerge, merger.memMerge]
        text: |
          [[A persister worker]] is merging our flushable, our segment
          and its neighbors, into one new zap file, which it then
          writes and fsyncs. Our segment stays in the root meanwhile,
          still searchable.

      - id: make-room
        view: { camera: persisterDetail, target: persister }
        text: |
          Let's look more closely at [[the persister]]. We'll make some
          room to its left.

      - id: detail
        view: { bubble: [persister], target: persisterDetail }
        code: [persister.loop, persister.persistSnapshot, persister.direct]
        text: |
          Here's [[the same cycle]], in terms of the code in
          `persisterLoop()`. It only ever persists the *latest* root, so
          the epochs in between are skipped, which acts as a group
          commit. The new files are swapped into the root first, and
          only then committed to `root.bolt` and fsynced.

      - id: detail-close
        view: { unbubble: [persister], target: persisterInside }
        expect: [napBroken]
        code: [merger.loop]
        text: |
          One surprise: [[the nap]] rarely runs its full 2 seconds.
          Every time the merger finishes a plan, it hands the persister
          an "epoch watcher", and that ends the nap
          (`num_persister_nap_merger_break`).

      - id: back
        view: { camera: persisterDisk, target: ourBatch }
        text: |
          Back to [[our segment]], still being written.

      - id: open-disk
        view: { open: [disk], target: diskLid }
        text: |
          Let's open up [[the disk]] below, to see where the
          persister's writes go.

      - id: written
        sim: { until: written }
        view: { target: ourBatch, flow: write }
        expect: ["reached:written", ourSegInMemory]
        code: [zapx.merge]
        text: |
          The worker wrote a new zap file down to disk and fsynced it.
          Then it opened that file, mmapped, as [[our file segment]]:
          the in-memory handle on the file that goroutines pass
          around, and that a root can list. It's not in the root yet:
          queries still find our docs in the in-memory segment.

      - id: landed
        view: { camera: diskDir, target: ourFile, token: hide }
        text: |
          On disk, [[our zap file]] is a new file in the index's
          directory, beside the files already there. It's drawn
          dashed because nothing lists it yet: not the root, and not
          `root.bolt`. Until a `root.bolt` record does, it wouldn't
          count after a crash.

      - id: back-up
        view: { camera: persisterDisk, target: ourBatch, token: auto }
        text: |
          Back up to [[our file segment]], beside the persister.

      - id: to-introducer
        sim: { until: fileIntroducing }
        view: { target: ourBatch }
        expect: ["reached:fileIntroducing"]
        code: [introducer.introduceMerge]
        text: |
          So the persister hands the new file segment up to
          [[the introducer]], over the same `merges` channel the
          merger uses. Only the introducer may change the root.

      - id: watch
        view: { camera: swap, target: root }
        text: |
          Now watch [[the root snapshot]], epoch 354, as the
          introducer swaps in a new one. It goes one change at a
          time, as you scroll.

      - id: file
        sim: { until: file }
        view: { swap: cover, target: root }
        expect: ["reached:file", ourSegIsFile]
        code: [introducer.mergeSwap]
        text: |
          The introducer starts [[a new root snapshot]]: empty for
          now, drawn dashed and see-through over the old one. Nobody
          else can see it yet. Queries, the persister and the merger
          all find the root through `s.root`, which still points at
          epoch 354.

      - id: peel
        view: { swap: peel, target: root }
        text: |
          Let's lift [[the new root]] off the stack, so we can watch it
          being built while the old one stays put underneath.

      - id: copy
        view: { swap: copy, target: rootMem }
        code: [introducer.mergeSwap]
        text: |
          It starts from a copy of [[the old root's segment list]].
          Only the list: the segments themselves are shared, and each
          one that stays gets one more ref. No docs are copied.

      - id: add
        view: { swap: add, target: ourSeg }
        text: |
          In goes [[our file segment]].

      - id: mem-gone
        view: { swap: drop, target: rootMem }
        expect: [noMemSegsAtRoot]
        text: |
          Out go [[the in-memory segments]] it replaces. All of them,
          ours included, were merged into that one file: same docs,
          now in a zap file on disk, mmapped.

      - id: epoch-up
        view: { swap: epoch, target: rootEpoch }
        expect: ["rootEpoch:355"]
        text: |
          Last, just before the swap, it gets the next epoch:
          [[354 + 1 = 355]]. The introducer hands out epochs in order,
          one for every root it swaps in,
          whether that root adds a batch's segment, a persister's file,
          or a merger's result.

      - id: swapped
        view: { swap: solid, target: root }
        code: [introducer.mergeSwap]
        text: |
          Now the introducer [[swaps it in]]: one pointer assignment,
          `s.root = newSnapshot`, under a lock. It's solid now. From
          here on, queries, the persister and the merger see epoch 355.

      - id: old-root
        view: { swap: settle, target: olderEpoch }
        expect: [persisterHoldsOlderRoot, "rootEpoch:355"]
        code: [snapshot.refcount]
        text: |
          The stack shifts back, with the new root in front. Behind
          it, [[epoch 354]] is still alive: the introducer let go of
          its ref, but the persister still holds one. Root snapshots
          aren't linked to each other. Each is an immutable, refcounted
          list of segments, freed when its last ref goes. Next, the
          persister commits `root.bolt` and fsyncs it.

      - id: to-bolt
        view: { camera: persisterBolt, target: bolt }
        text: |
          Let's watch [[root.bolt]], on the disk, while the persister
          commits.

      - id: committed
        sim: { until: committed }
        view: { commit: bolt, target: bolt }
        expect: ["reached:committed"]
        code: [persister.direct, persister.protected]
        text: |
          The persister wrote [[a new record]] into `root.bolt` and
          fsynced it. It's filed under epoch 354, the root the
          persister started from, and it lists our new zap file.
          `root.bolt` keeps a few older records too: cbft keeps 3 in
          all, the newest plus older ones about 10 minutes apart, as
          *rollback points*.

      - id: listed
        view: { commit: listed, target: ourFile }
        text: |
          Now that a record lists it, [[our zap file]] turns solid:
          after a crash, scorch would reopen it from `root.bolt`.

      - id: released
        view: { commit: release, target: persister }
        code: [snapshot.refcount]
        text: |
          Finally, [[the persister]] lets go of its ref on epoch 354
          (and of a brief ref on 355 that came back with its merge
          result). Nothing else held 354, so it's freed. Its next cycle
          takes a ref on whatever the root is by then.

      - id: why-354
        view: { commit: release, target: bolt }
        code: [persister.equiv, persister.loop]
        text: |
          Why does [[the newest record]] say 354, when the root is
          355? The persister files its record under the epoch of the
          root it started from, 354, with the in-memory segments
          swapped for the new file: the same docs as 355, under the
          older number. The root has moved on, so the persister will
          persist again, but first it naps. When it wakes, it takes
          whatever root is latest then, which may skip 355 entirely.
          We'll see, after the merger.

  # ------------------------------------------------------------------
  - id: merger
    title: "The merger"
    color: scorch
    steps:

      - id: zoom
        view: { camera: merger, target: merger, token: auto, commit: release }
        text: |
          Lots of small files would make every query slower. So
          [[the merger]] compacts them. Our marker is on our file
          segment in the root.

      - id: open
        view: { open: [merger], target: mergerInside, commit: release }
        code: [merger.loop, merger.planMergeAtSnapshot]
        text: |
          It works on file segments only, in [[four phases]]: wait for
          a newly persisted epoch, plan, merge its tasks one after
          another, and introduce all the results to the introducer in
          one go. The merger is paced by the persister,
          and as we'll see, the persister is paced by the merger.

      - id: planning
        sim: { until: planning }
        view: { commit: wake, target: mergerInside }
        expect: ["reached:planning"]
        code: [merger.loop, merger.planMergeAtSnapshot]
        text: |
          The persister just persisted a newer epoch, which woke the
          merger. After its last plan, the merger had handed the
          persister an *epoch watcher* ("wake me once you've persisted
          something newer than epoch 316") and waited on it. Persisting
          354 closed it. Now the merger took a ref on the root, epoch
          355, with our file in it, and [[plans]]: which files, if any,
          should it merge?

      - id: make-room
        view: { camera: mergerDetail, target: merger }
        text: |
          How does [[the merger]] decide what to merge? Let's make room
          below it.

      - id: detail
        view: { bubble: [merger], plan: budget, target: stairs }
        code: [mergeplan.plan, mergeplan.CalcBudget, cbft.persisterDefaults]
        text: |
          With [[a staircase]]. bleve's tiered merge policy, a cousin
          of Lucene's, first sets a *budget*: how many files the index
          may have. Take an example index with 1.3GB of live data. The
          first tier is up to 10 files at the floor size (cbft sets
          `floorSegmentFileSize` to 20MB), each tier above is 10×
          bigger, and tiers stack until all the bytes fit. Here that's
          10 small stairs and 6 bigger ones: a budget of 16 files.

      - id: files
        view: { plan: files, target: stairFiles }
        text: |
          Now [[the actual files]], biggest first (by live doc count),
          as `Plan()` sorts them: a few big ones from earlier merges, and a tail of small
          fresh ones that the persister keeps writing.

      - id: over
        view: { plan: over, target: stairOver }
        text: |
          Twenty files on a budget of 16: there are more files than
          stairs, so [[the last four]] are over budget, and the planner
          must merge.

      - id: pick
        view: { plan: pick, target: stairPick }
        code: [mergeplan.plan, mergeplan.ScoreSegments]
        text: |
          Which files? The planner slides a window along the sorted
          files and scores every run of up to 10. Lower is better: runs
          of similar sizes win, since merging a big file with small
          ones rewrites the big one for little gain, and files with
          many deletes get a bonus. Here [[the winner]] is the ten
          smallest.

      - id: merged-file
        view: { plan: merged, target: stairMerged }
        text: |
          They become [[one 39MB file]], a step up the staircase, and
          eleven files fit the budget. A byte is rewritten about once
          per tier it climbs, so a few times over its life, rather than
          on every merge.

      - id: ours
        view: { plan: live, target: mergerDetail }
        expect: [filesOverBudget]
        text: |
          Back to [[our own index]], at epoch 355. It's small, a stair
          or two, but it has three files on a budget of two, so the
          plan has one task: merge two of them, our file included.

      - id: detail-close
        view: { unbubble: [merger], target: mergerInside }
        text: |
          With its plan made, [[the merger]] goes on to merge that
          task's files into one, then hands the result to the
          introducer.

      - id: merging
        sim: { until: merging }
        view: { target: ourSeg }
        expect: ["reached:merging"]
        code: [merger.planMergeAtSnapshot]
        text: |
          The merger is merging [[our file segment]] with one other
          into a new zap file. It reads them through its ref on epoch
          355; it doesn't take them out of the root. A root snapshot
          never changes, so both stay in it, still searchable, while
          the merger works.

      - id: merge-wide
        view: { camera: mergeDisk, target: disk }
        text: |
          Let's widen the view to take in [[the disk]] below.

      - id: merge-written
        sim: { until: mergeWritten }
        view: { target: mergedSeg, flow: mergeWrite }
        expect: ["reached:mergeWritten"]
        text: |
          It wrote the merged zap file down to disk and fsynced it, and
          opened it, mmapped, as [[a merged file segment]] holding our
          docs (and the other file's). On disk there are now two files with our docs in them:
          our old one, and this new one. The new one isn't in the root
          yet, though.

      - id: merge-up
        view: { camera: scorch, target: mergedSeg }
        text: |
          [[The merged file segment]] isn't in any root yet. Let's
          follow it.

      - id: merge-to-introducer
        sim: { until: mergeIntroducing }
        view: { target: mergedSeg }
        expect: ["reached:mergeIntroducing"]
        code: [introducer.introduceMerge]
        text: |
          Like the persister, the merger can't change the root itself.
          It hands [[the merged file segment]] up to the introducer,
          over the same `merges` channel.

      - id: merge-watch
        view: { camera: swap, target: rootFiles }
        text: |
          Now watch [[the root's file segments]] as the introducer
          builds a new root around the merged file.

      - id: merged
        sim: { until: merged }
        view: { swap: copy, target: root }
        expect: ["reached:merged"]
        code: [introducer.mergeSwap]
        text: |
          As before, the introducer starts [[a new root]] from a copy
          of epoch 355's segment list: three file segments.

      - id: merge-add
        view: { swap: add, target: rootFiles }
        code: [introducer.introduceMerge]
        text: |
          In goes [[the merged file segment]]. Any docs deleted while
          the merge ran are marked deleted in it too: the introducer
          remaps those deletes into the new segment.

      - id: merge-drop
        view: { swap: drop, target: rootFiles }
        text: |
          Out go [[the two file segments]] it replaces, ours among
          them. Our docs now live in the merged one, so our marker
          moves over. The new root lists the same docs, in two file
          segments instead of three.

      - id: merge-epoch
        view: { swap: epoch, target: rootEpoch }
        text: |
          Then the next epoch: [[355 + 1 = 356]].

      - id: merge-swapped
        view: { swap: settle, target: root }
        expect: ["rootEpoch:356", onlyRootLive]
        text: |
          And the introducer swaps [[the new root]] in. The merger,
          told its result is in, lets go of epoch 355; nothing else
          holds it, so it's freed. Our old file is no longer in any root: it's
          garbage on disk now.

      - id: to-disk
        view: { camera: lower, target: disk }
        code: [persister.removeOldData]
        text: |
          Old files stay in [[the directory]], gray, until no
          remaining `root.bolt` record lists them. The persister
          cleans up only when it's idle, so under steady ingest,
          garbage accumulates for a while.

      - id: caught-up
        sim: { until: caughtUp }
        view: { target: bolt }
        expect: ["reached:caughtUp", "rootEpoch:356"]
        code: [persister.loop, merger.loop]
        text: |
          The merger finishing its plan also woke the persister from
          its nap. It took a ref on the latest root, 356, with the
          merged file, and committed [[a record for it]]. Epoch 355
          was never written down on its own: that's the group commit
          again. Now disk and memory agree.

      - id: idle
        view: { camera: scorch, target: persister }
        text: |
          With 356 persisted and no new mutations coming in,
          [[the persister]] has caught up. What does it do now?

      - id: persister-waits
        sim: { until: persisterWaits }
        view: { target: introWatchers, flow: watcher }
        expect: ["reached:persisterWaits"]
        code: [persister.loop, introducer.loop]
        text: |
          It hands the introducer an epoch watcher of its own, over
          the introducer's `introducerNotifier` channel (the `watchers`
          chip): "wake me once the root
          is newer than epoch 356". [[The introducer]] holds it, and
          after every root it swaps in, closes the watchers it has now
          satisfied. So the wake-ups chain: a new root wakes the
          persister, and a newly persisted epoch wakes the merger. The
          persister waits on its watcher, and also on its channel from
          the merger, whichever comes first.

      - id: persister-nudged
        sim: { until: persisterNudged }
        view: { target: persister }
        expect: ["reached:persisterNudged"]
        code: [persister.loop, merger.loop]
        text: |
          The merger came first. It finished its own plan for 356
          (nothing left to merge) and handed [[the persister]] a
          watcher. That wakes the persister, which goes round its loop
          and naps again, for up to 2s. Its watcher stays with the
          introducer.

