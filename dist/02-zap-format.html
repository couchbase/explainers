<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside a zap segment: how scorch stores and finds your docs</title>
<meta name="description" content="What scorch reads, byte by byte, when a query asks for a word: the file layout, vellum FSTs, roaring bitmaps and stored fields.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout concept: story on the left, one large diagram in the middle
   that the story zooms around and opens up section by section, and
   charts on the right with leader lines into the diagram. Each section
   has its own color, used for its frame, lid, story headings and the
   "where am I" breadcrumb. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5a6977;
  --line: #d3dae0;
  --faint: #e7ecf0;
  --accent: #c2410c;
  --scan: #ffd98a; /* the copier scan's light */
  --flow: #7b8a97;
  --up: #6e5bd0;

  --busy: #1f8f58;
  --nap: #6e5bd0;
  --wait: #8b97a3;
  --stall: #d0342c;

  --sec-kv: #2b7c84;
  --sec-cbft: #a07408;
  --sec-bleve: #5b4fa8;
  --sec-scorch: #9c3f7c;
  --sec-disk: #7a5a3a;
  --sec-neutral: #5a6977;

  --seg-mem: #e8862a;
  --seg-file: #2d6cc9;
  --seg-garbage: #a9b4be;
  --seg-zombie: #d23a4e;

  --code-bg: #f6f8fa;
  --code-hl: #fff4d6;
  --code-kw: #a3266b;
  --code-str: #1d6a3a;
  --code-com: #6b7785;
  --code-fn: #1d5fb0;
  --code-num: #9a5b00;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
    --accent: #fb7a3c; --flow: #7f8f9c; --up: #9a8cf0; --scan: #fff1c4;
    --busy: #3cc283; --nap: #9a8cf0; --wait: #6f7d89; --stall: #ff6450;
    --sec-kv: #5fb8bf; --sec-cbft: #d9a63a; --sec-bleve: #a99cf0; --sec-scorch: #d97bb8; --sec-disk: #c19a72; --sec-neutral: #93a2ae;
    --seg-mem: #f59e4a; --seg-file: #5b93e8; --seg-garbage: #4f5d69; --seg-zombie: #ff5d72;
    --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
  --accent: #fb7a3c; --flow: #7f8f9c; --up: #9a8cf0; --scan: #fff1c4;
  --busy: #3cc283; --nap: #9a8cf0; --wait: #6f7d89; --stall: #ff6450;
  --sec-kv: #5fb8bf; --sec-cbft: #d9a63a; --sec-bleve: #a99cf0; --sec-scorch: #d97bb8; --sec-disk: #c19a72; --sec-neutral: #93a2ae;
  --seg-mem: #f59e4a; --seg-file: #5b93e8; --seg-garbage: #4f5d69; --seg-zombie: #ff5d72;
  --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); }
a { color: var(--accent); }
code, kbd { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.sec-kv { --sec: var(--sec-kv); }
.sec-cbft { --sec: var(--sec-cbft); }
.sec-bleve { --sec: var(--sec-bleve); }
.sec-scorch { --sec: var(--sec-scorch); }
.sec-disk { --sec: var(--sec-disk); }
.sec-neutral { --sec: var(--sec-neutral); }
.next-card { margin: 0 0 40vh; }
.next-link { font: 600 1.15rem var(--font-display); color: var(--accent); text-decoration: none; }
.next-link:hover { text-decoration: underline; }
/* the zap-format explainer's chapters */
.sec-file { --sec: var(--sec-disk); }
.sec-dict { --sec: var(--sec-bleve); }
.sec-postings { --sec: var(--sec-scorch); }
.sec-stored { --sec: var(--sec-kv); }

/* ---------- layout ----------
   Wide screens: the diagram fills the window behind a transparent story
   column whose text sits on opaque cards; the camera frames its region
   to the right of the story. The charts column opens on the right when
   --chrome (0..1, set from the scroll position) says so. */

.layout {
  --chrome: 0;
  --gutter: max(16px, 2vw);
  --story-w: min(27rem, 38vw);
  --charts-w: calc(var(--chrome) * 18rem);
  position: relative;
}
.story {
  position: relative;
  z-index: 2;
  width: var(--story-w);
  margin-left: var(--gutter);
  padding-block: 4.5rem 45vh;
  pointer-events: none; /* let drags reach the diagram between cards */
}
.story .card { pointer-events: auto; }
.stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.toolbar {
  position: absolute;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: calc(var(--gutter) + var(--story-w) + 1.5rem);
  right: calc(var(--charts-w) + 1rem);
}
.viewport {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.charts {
  /* transparent, like the story column: each chart is its own card */
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--charts-w);
  z-index: 1;
  padding: 4rem calc(var(--chrome) * 1rem) 1rem 0;
  pointer-events: none;
}
.charts .chart { pointer-events: auto; }
.diagram { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viewport.dragging .diagram { cursor: grabbing; }
.zoom { position: absolute; right: calc(var(--charts-w) + 0.6rem); bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.zbtn {
  width: 2rem; height: 2rem;
  font: 500 1rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer;
}
.zbtn:hover { border-color: var(--accent); }
.zoom-hint { font: 400 0.6875rem/1 var(--font-mono); color: var(--muted); }
@media (max-width: 1100px) { .zoom-hint { display: none; } }
.charts { display: flex; flex-direction: column; gap: 1.6rem; overflow: hidden; }
.chart { min-width: 15rem; padding: 0.7rem 0.85rem 0.8rem; }
.overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; overflow: visible; }

/* ---------- story ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--faint);
  border-radius: 10px;
  box-shadow: 0 4px 18px rgba(20, 30, 40, 0.08);
  padding: 1.1rem 1.35rem;
}
.hero { margin-bottom: 4rem; padding-block: 1.6rem; }
.eyebrow { font: 600 0.75rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.hero h1 { font: 600 2.4rem/1.08 var(--font-display); margin: 0.5rem 0 1rem; text-wrap: balance; }
.hero .subtitle { color: var(--muted); font-size: 1.15rem; line-height: 1.45; }
.hero .subtitle p { margin: 0; }
.hero .meta { margin-top: 1.25rem; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.hero .meta a { color: inherit; }
.scroll-hint { margin-top: 2.5rem; font: 500 0.875rem var(--font-body); color: var(--muted); }

.chapter-title {
  font: 600 1.5rem/1.15 var(--font-display);
  margin: 5rem 0 0;
  color: var(--ink);
  text-wrap: balance;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  width: fit-content;
  max-width: 100%;
  padding-block: 0.7rem;
}
.chapter-dot { flex: none; width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--sec); }
.step {
  min-height: 70vh;
  padding-block: 2rem;
  max-width: 62ch;
}
.step.step-long { min-height: 170vh; }
.step .card { opacity: 0.55; transition: opacity 0.4s ease; }
.step.active .card { opacity: 1; }
.step p { margin: 0 0 0.9em; }
.step ul, .step ol { padding-left: 1.3em; margin: 0 0 0.9em; }
.step li { margin-bottom: 0.3em; }
.step strong { font-weight: 600; }
.hl { font-weight: 600; }
.step.active .hl { color: var(--accent); }

.code-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.code-chip {
  font: 400 0.75rem/1.3 var(--font-mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
}
.code-chip:hover { border-color: var(--accent); color: var(--accent); }
.code-chip .repo { color: var(--muted); }

/* inline legend swatches in the prose */
.st { font-weight: 500; white-space: nowrap; }
.st::before { content: ""; display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%; margin-right: 0.3em; vertical-align: -0.02em; }
.st-busy::before { background: var(--busy); }
.st-sleep::before { background: var(--nap); }
.st-wait::before { background: transparent; border: 2px solid var(--wait); }
.st-stall::before { background: var(--stall); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; font: 400 0.75rem/1 var(--font-mono); color: var(--muted); }
.toolbar .spacer { flex: 1; }
.tools { display: grid; justify-items: end; align-items: center; }
.tools > * { grid-area: 1 / 1; }
.controls { display: inline-flex; align-items: center; gap: 0.5rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 9ch; }
.crumb { display: inline-flex; align-items: center; gap: 0.45rem; font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em; color: var(--ink); }
.crumb-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--sec); }
.btn {
  font: 500 0.75rem/1 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- charts ---------- */

.chart { font: 400 0.75rem/1.3 var(--font-mono); color: var(--muted); }
.chart.dim { opacity: 0.3; }
.chart.emph { color: var(--ink); }
.chart-head { display: flex; justify-content: space-between; gap: 0.5rem; }
.chart-head b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plot svg { display: block; width: 100%; height: 3.2rem; overflow: visible; margin-top: 0.3rem; }
.plot .area { fill: color-mix(in srgb, var(--seg-file) 14%, transparent); }
.plot .line { fill: none; stroke: var(--seg-file); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.chart.emph .line { stroke: var(--accent); }
.chart.emph .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.plot .ref { stroke: var(--stall); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.plot .grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* ---------- overlay lines ---------- */

.callout { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.callout-end { fill: var(--accent); }
.leader { fill: none; stroke: var(--muted); stroke-opacity: 0.45; stroke-width: 1; }
.leader-end { fill: var(--muted); fill-opacity: 0.7; }

/* ---------- diagram ---------- */

.diagram text { font-family: var(--font-mono); }
.frame { fill: color-mix(in srgb, var(--sec) 3%, var(--bg)); stroke: var(--sec); stroke-width: 1.6; }
.tab { fill: var(--sec); }
.diagram .tab-text { font: 600 11.5px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--panel); }
.flow { stroke: var(--flow); stroke-width: 1.4; fill: none; }
.flow-up { stroke: var(--up); stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
.flow-read { stroke: var(--flow); stroke-width: 1.2; fill: none; stroke-dasharray: 1.5 3; stroke-linecap: round; }
.arrowhead { fill: var(--flow); }
.arrowhead-up { fill: var(--up); }
.note { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.note-in { font-size: 11px; fill: var(--muted); }
.code-in { font-size: 11px; fill: var(--muted); }
.zone { fill: var(--panel); stroke: var(--line); }
.zone.strong { stroke: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.diagram .zone-title { font: 600 12px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; fill: var(--muted); }

.gbox { fill: var(--panel); stroke: var(--wait); stroke-width: 1.2; stroke-dasharray: 4 3; }
.gbox.s-busy { stroke: var(--busy); stroke-dasharray: none; }
.gbox.s-nap { stroke: var(--nap); stroke-dasharray: none; }
.gbox.s-stall { stroke: var(--stall); stroke-dasharray: none; stroke-width: 2; }
.gbox-header { fill: none; }
.gbox.behind { stroke-dasharray: none; stroke: var(--line); }
.gbox.behind.s-busy { stroke: color-mix(in srgb, var(--busy) 45%, var(--line)); }
.gbox.behind.s-stall { stroke: color-mix(in srgb, var(--stall) 60%, var(--line)); }
.gdot { fill: none; stroke: var(--wait); stroke-width: 1.5; }
.gdot.s-busy, .gdot.dot-busy { fill: var(--busy); stroke: none; }
.gdot.s-nap, .gdot.dot-nap { fill: var(--nap); stroke: none; }
.gdot.s-stall, .gdot.dot-stall { fill: var(--stall); stroke: none; }
.gtitle { font-size: 13px; font-weight: 600; fill: var(--ink); }
.glabel { font-size: 11px; fill: var(--muted); }
.glabel.small { font-size: 10px; }
.glabel.s-stall { fill: var(--stall); }
.gsince { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.badge { fill: var(--ink); }
.badge-text { font-size: 10.5px; font-weight: 600; fill: var(--panel); }

.gauge { fill: var(--faint); stroke: var(--line); }
.gauge-fill { fill: var(--seg-file); }
.gauge-fill.mem { fill: var(--seg-mem); }
.gauge-fill.warn { fill: var(--stall); }
.gauge-mark { stroke: var(--ink); stroke-width: 1.5; }
.gate { stroke: var(--stall); stroke-width: 1.6; stroke-dasharray: 10 3 2 3; }
.slot { fill: var(--panel); stroke: var(--line); }
.slot.full { fill: var(--accent); stroke: var(--accent); }
.cpu { fill: var(--panel); stroke: var(--line); }
.cpu.busy { fill: var(--busy); stroke: var(--busy); }
.chan { fill: var(--bg); stroke: var(--line); }
.chan.lit { fill: color-mix(in srgb, var(--busy) 18%, var(--panel)); stroke: var(--busy); }
.chan-text { font-size: 9px; fill: var(--ink); }

.cell { fill: none; stroke: none; }
.cell.mem { fill: var(--seg-mem); stroke: none; }
.fbar { fill: var(--seg-file); }
.fbar.merging { stroke: var(--ink); stroke-width: 1.5; }
.fbar.ours { stroke: var(--accent); stroke-width: 2; }
.fdel { fill: var(--panel); fill-opacity: 0.6; }
.target-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.5; }
.query { fill: var(--panel); stroke: var(--busy); }
.search-ring, .search-handle { fill: none; stroke: var(--busy); stroke-width: 1.6; }

/* File icons are <use>s of one symbol: their look comes in through
   custom properties, which (unlike descendant selectors) reach inside. */
.ficon-body { fill: var(--fi-fill, var(--seg-file)); stroke: var(--fi-stroke, var(--seg-file)); stroke-width: var(--fi-sw, 1); stroke-dasharray: var(--fi-dash, none); }
.ficon-fold { fill: none; stroke: var(--fi-fold, var(--panel)); stroke-width: 1; }
.ficon-garbage { --fi-fill: var(--seg-garbage); --fi-stroke: var(--seg-garbage); }
.ficon-new { --fi-fill: var(--panel); --fi-dash: 2 1.5; --fi-fold: var(--seg-file); }
.ficon-zombie { --fi-fill: var(--panel); --fi-stroke: var(--seg-zombie); --fi-sw: 1.4; --fi-fold: var(--seg-zombie); }
.ficon-ours { --fi-stroke: var(--accent); --fi-sw: 2; }
.del-ring { fill: var(--panel); fill-opacity: 0.5; stroke: var(--stall); stroke-width: 1.8; }
.del-slash { stroke: var(--stall); stroke-width: 1.8; }
.bolt { fill: var(--panel); stroke: var(--line); }
.bolt.latest { stroke: var(--seg-file); }
.bolt.protected { stroke: var(--muted); stroke-width: 2.5; }
.diagram .root-draft > rect.zone { stroke-dasharray: 6 4; }
.diagram .epoch-num.lit { fill: var(--accent); }
.diagram .copy-label { font-style: italic; }
/* the copier scan's light: a warm bulb, fading at its edges */
.diagram .scan-core { stop-color: var(--scan); stop-opacity: 0.85; }
.diagram .scan-edge { stop-color: var(--scan); stop-opacity: 0; }
.bolt.ours { stroke: var(--accent); stroke-width: 2; }

.panel-frame { fill: var(--panel); stroke: color-mix(in srgb, var(--sec-scorch) 55%, var(--line)); stroke-width: 1.3; }
.row { fill: var(--bg); stroke: var(--line); }
.row.lit { fill: color-mix(in srgb, var(--busy) 14%, var(--panel)); stroke: var(--busy); }
.row.lit.stall { fill: color-mix(in srgb, var(--stall) 12%, var(--panel)); stroke: var(--stall); }
.row-text { font-size: 11.5px; fill: var(--ink); }
.pw { fill: var(--panel); stroke: var(--wait); stroke-dasharray: 2 2; }
.pw.s-busy { fill: var(--busy); stroke: var(--busy); stroke-dasharray: none; }
.pw.s-stall { fill: var(--stall); stroke: var(--stall); stroke-dasharray: none; }
.back-fn { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.back-note { font-size: 10.5px; fill: var(--muted); }
.tok { fill: var(--panel-2); stroke: var(--line); }
.tok.gone { fill: none; stroke-dasharray: 2 2; }
.diagram .tok-text { font: 400 11px var(--font-mono); fill: var(--ink); }
.diagram .tok-text.gone { fill: var(--muted); text-decoration: line-through; }
.tier-line { stroke: var(--muted); stroke-dasharray: 3 3; stroke-opacity: 0.5; }
.stair-slot { fill: color-mix(in srgb, var(--sec-scorch) 7%, var(--panel)); stroke: var(--sec-scorch); stroke-dasharray: 3 2; }
.stair-over { fill: none; stroke: var(--stall); stroke-width: 1.8; }
.stair-pick { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); stroke-width: 1.8; }
.tier-line.stair-end { stroke: var(--stall); stroke-dasharray: none; stroke-opacity: 1; stroke-width: 1.5; }

/* lids sit inset inside their frame, so the colored border stays
   visible; the page sets their openness from the scroll position */
.lid-bg { fill: color-mix(in srgb, var(--sec) 11%, var(--panel)); }
.lid.stalled .lid-bg { fill: color-mix(in srgb, var(--stall) 10%, var(--panel)); }
.diagram .lid-title { font: 600 34px var(--font-display); fill: var(--ink); }
.diagram .lid-title-small { font: 600 18px var(--font-display); fill: var(--ink); }
.diagram .lid-sub { font: 400 17px var(--font-body); fill: var(--muted); }
.diagram .lid-sub-small { font: 400 12.5px var(--font-body); fill: var(--muted); }
.lid-status { font-size: 15px; fill: var(--ink); }
.lid-status-small { font-size: 11.5px; fill: var(--ink); }

/* detail bubbles, grown out of their panel by the page */
.bubble-box, .bubble-tail { fill: var(--panel); stroke: color-mix(in srgb, var(--sec-scorch) 70%, var(--line)); stroke-width: 1.5; }
.bubble-box { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.16)); }
.bubble-seam { stroke: var(--panel); stroke-width: 3; }
.diagram .bubble-title { font: 600 14px var(--font-display); fill: var(--ink); }

/* the marker for "our batch" */
.token-chip { fill: color-mix(in srgb, var(--accent) 22%, var(--panel)); stroke: var(--accent); stroke-width: 2.5; }
.token-chip.kind-mem { fill: var(--seg-mem); }
.token-chip.kind-file { fill: var(--seg-file); }
.token-sheet { fill: var(--panel); stroke: color-mix(in srgb, var(--ink) 35%, var(--line)); stroke-width: 1.2; }
.token-other { fill: color-mix(in srgb, var(--muted) 45%, var(--panel)); }
.token-sub { font-size: 10px; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.merged-chip { fill: var(--seg-file); stroke: var(--ink); stroke-width: 1.5; }
.merged-label { font-size: 11px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.token-label { font-size: 11px; font-weight: 600; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.doc-body { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
.doc-lines { stroke: var(--muted); stroke-width: 0.8; fill: none; }
.network { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }

/* ---------- contents ---------- */

.toc {
  position: fixed;
  z-index: 12;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: var(--gutter, 16px);
}
.toc-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.5rem 0.75rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.toc-btn:hover, .toc-btn[aria-expanded="true"] { border-color: var(--muted); }
.toc-icon { font-size: 0.95rem; color: var(--muted); }
.toc-panel {
  position: absolute; top: calc(100% + 0.4rem); left: 0;
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100vh - 5rem); overflow-y: auto;
  padding: 0.5rem;
  display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.toc-head { font: 600 0.6875rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.5rem 0.6rem 0.6rem; }
.toc-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  padding: 0.5rem 0.6rem; border-radius: var(--radius);
  font: 500 0.9375rem/1.25 var(--font-display); color: var(--ink); text-decoration: none;
}
.toc-item .chapter-dot { width: 0.6rem; height: 0.6rem; }
.toc-item:hover, .toc-item:focus-visible { background: var(--faint); outline: none; }
.toc-item.current { background: color-mix(in srgb, var(--sec) 12%, var(--panel)); font-weight: 600; }

/* ---------- drawers ---------- */

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(52rem, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
  z-index: 20;
  display: flex; flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 600 1rem/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; }
.drawer .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.drawer .tabs .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.drawer .body { flex: 1; overflow: auto; min-height: 0; }
.drawer .where { padding: 0.5rem 1rem; font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
.code { font: 400 0.78rem/1.55 var(--font-mono); background: var(--code-bg); margin: 0; padding: 0.5rem 0; overflow-x: auto; tab-size: 4; }
.code .ln { display: flex; white-space: pre; padding-right: 1rem; }
.code .ln.hl { background: var(--code-hl); font-weight: 400; }
.code .n { flex: none; width: 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--muted); user-select: none; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-number, .hljs-literal { color: var(--code-num); }
.knobs .body { padding: 0.5rem 1rem 2rem; }
.knobs fieldset { border: none; padding: 0; margin: 0 0 1rem; }
.knobs legend { font: 600 0.75rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.75rem 0 0.4rem; }
.knob { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 8rem) minmax(0, 1fr); gap: 0.25rem 0.75rem; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--line); }
.knob label { font: 500 0.75rem/1.3 var(--font-mono); }
.knob input[type="number"] { width: 100%; font: 400 0.75rem/1 var(--font-mono); padding: 0.3rem; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
.knob .doc { font-size: 0.75rem; color: var(--muted); line-height: 1.35; }
.knob .doc .dflt { font-family: var(--font-mono); }
.knobs .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0 0.25rem; }

/* ---------- narrower screens ---------- */

@media (max-width: 1250px) {
  .layout { --charts-w: 0px; --story-w: min(24rem, 40vw); }
  .charts { display: none; }
}
/* Phones: the diagram is a sticky panel on top; the story scrolls below. */
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; padding-inline: 16px; --story-w: 100%; --gutter: 0px; }
  .stage { position: sticky; inset: auto; top: 0; order: -1; height: 56vh; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; padding-block: 0.5rem; }
  .toolbar { position: static; flex-wrap: wrap; padding-left: 7.5rem; min-height: 2.1rem; }
  .toc { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); left: 16px; }
  .viewport { position: relative; inset: auto; flex: 1; min-height: 0; }
  .tools, .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; }
  .story { width: auto; margin-left: 0; padding-block: 1rem 60vh; pointer-events: auto; }
  .step { min-height: 50vh; scroll-margin-top: 58vh; }
  .hero h1 { font-size: 1.8rem; }
  .knob { grid-template-columns: minmax(0, 1fr) minmax(0, 7rem); }
  .knob .doc { grid-column: 1 / -1; }
}
/* ---------- the zap-format explainer's diagram ---------- */
.diagram .zstrip-title { font: 600 15px var(--font-display); fill: var(--ink); }
.diagram .zregion { fill: color-mix(in srgb, var(--rc) 16%, var(--panel)); stroke: color-mix(in srgb, var(--rc) 55%, var(--line)); stroke-width: 1.2; }
.diagram .zr-storedData, .diagram .zr-storedIndex { --rc: var(--sec-kv); }
.diagram .zr-nestedEdges { --rc: var(--sec-neutral); }
.diagram .zr-sectionBodies { --rc: var(--sec-scorch); }
.diagram .zr-sectionsInfo, .diagram .zr-sectionsIndex { --rc: var(--sec-bleve); }
.diagram .zr-footer { --rc: var(--sec-disk); }
.diagram .zregion-label { font: 600 12px var(--font-display); fill: var(--ink); }
.diagram .zregion-bytes { font: 11px var(--font-mono); fill: var(--muted); }
.diagram .zlid-bg { fill: var(--panel-2); stroke: var(--line); }
.diagram .zlid-q { font: 600 18px var(--font-display); fill: var(--muted); }
.diagram .ztick { stroke: var(--muted); }
.diagram .ztick-label { font: 10px var(--font-mono); fill: var(--muted); }
.diagram .zread { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1.5; }
.diagram .ztether { fill: none; stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
.diagram .zlens { fill: var(--panel); stroke: color-mix(in srgb, var(--ink) 30%, var(--line)); stroke-width: 1.2; }
.diagram .zlens-title { font: 600 13px var(--font-display); fill: var(--muted); letter-spacing: 0.02em; }
.diagram .zcell { fill: var(--panel-2); stroke: var(--line); }
.diagram .zcell-text { stroke: var(--sec-scorch); }
.diagram .zcell-empty { opacity: 0.55; }
.diagram .zcell-id { fill: color-mix(in srgb, var(--sec-kv) 14%, var(--panel)); }
.diagram .zcell-snappy, .diagram .zcell-bitmap { fill: color-mix(in srgb, var(--seg-file) 12%, var(--panel)); }
.diagram .zcell-label { font: 10px var(--font-mono); fill: var(--muted); }
.diagram .zcell-value { font: 600 13px var(--font-mono); fill: var(--ink); }
.diagram .zhex { font: 9px var(--font-mono); fill: var(--muted); }
.diagram .znote { font: 12px var(--font-mono); fill: var(--muted); }
.diagram .znote.strong { fill: var(--ink); font-weight: 600; }
.diagram .zarrow { fill: none; stroke: var(--muted); stroke-width: 1; }
.diagram .zstored-field { font: 12px var(--font-mono); fill: var(--ink); }
.diagram .znode { fill: var(--panel); stroke: color-mix(in srgb, var(--ink) 45%, var(--line)); stroke-width: 1.5; }
.diagram .znode.final { stroke: var(--sec-bleve); stroke-width: 3; }
.diagram .zedge { stroke: color-mix(in srgb, var(--ink) 35%, var(--line)); stroke-width: 1.4; }
.diagram .zedge-label { font: 600 12px var(--font-mono); fill: var(--ink); }
.diagram .zedge-label.big { font-size: 15px; }
.diagram .zedge-out { font: 600 11px var(--font-mono); fill: var(--accent); }
.diagram .zstub { stroke: var(--line); stroke-width: 1; }
.diagram .zstub-label { font: 9px var(--font-mono); fill: var(--muted); }
.diagram .zsum { font: 11px var(--font-mono); fill: var(--muted); }
.diagram .zvalue { font: 600 13px var(--font-mono); fill: var(--accent); }
.diagram .zchip { fill: var(--panel-2); stroke: var(--line); }
.diagram .zchip.on { fill: color-mix(in srgb, var(--seg-file) 22%, var(--panel)); stroke: var(--seg-file); stroke-width: 1.5; }
.diagram .zchip.dead { stroke: var(--stall); stroke-dasharray: 3 2; }
.diagram .zchip-label { font: 600 12px var(--font-mono); fill: var(--ink); }
.diagram .zdeleted { font: 12px var(--font-mono); fill: var(--stall); }
.diagram .zhit { font: 12px var(--font-mono); fill: var(--ink); }
.diagram .zhit.deleted { fill: var(--muted); text-decoration: line-through; }
.diagram .zfocus { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.diagram .zreader { fill: var(--accent); }
.diagram .zreader-label { font: 600 11px var(--font-display); fill: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<div id="app"></div>
<script type="application/json" id="bx-data">{"narrative":{"explainer":"zap-format","title":"Inside a zap segment: how scorch stores and finds your docs","subtitle":"What scorch reads, byte by byte, when a query asks for a word: the file layout, vellum FSTs, roaring bitmaps and stored fields.","audience":"Couchbase engineers and support","chapters":[{"id":"file","title":"One file","color":"file","steps":[{"id":"intro","view":{"camera":"file","target":"region.storedData"},"expect":["fact:file.size=5717","fact:docs=9"],"html":"\u003cp>The \u003ca href=\"01-indexing.html\">first explainer\u003c/a> ended with our\ndocs in a \u003cem>file segment\u003c/em>: a zap file on disk, listed by the\nroot snapshot. Here&#39;s one. It&#39;s a real segment, written by the\nzapx code cbft uses, from nine hotels in the travel-sample\ndataset: \u003cspan class=\"hl\">5,717 bytes\u003c/span>.\u003c/p>\n"},{"id":"mmapped","view":{"target":"region.sectionBodies"},"code":["zapx.open"],"html":"\u003cp>When scorch opens a segment, it maps the whole file into\nmemory (mmap). All of it is now addressable, but nothing has\nbeen read yet: the parts are still \u003cspan class=\"hl\">covered\u003c/span> here. Let&#39;s\nuncover them, front to back.\u003c/p>\n"}]},{"id":"layout","title":"Front to back","color":"file","steps":[{"id":"stored","view":{"open":["storedData"],"target":"region.storedData"},"expect":["fact:footer.storedIndexOffset=965"],"html":"\u003cp>First, \u003cspan class=\"hl\">the stored fields\u003c/span>: each doc&#39;s stored values, one\nrecord per doc, in doc-number order. 965 bytes here.\u003c/p>\n"},{"id":"stored-index","view":{"open":["storedIndex"],"target":"region.storedIndex"},"html":"\u003cp>Then \u003cspan class=\"hl\">the stored index\u003c/span>: one 8-byte offset per doc, to its\nrecord. Nine docs, 72 bytes.\u003c/p>\n"},{"id":"nested","view":{"open":["nestedEdges"],"target":"region.nestedEdges"},"html":"\u003cp>\u003cspan class=\"hl\">Nested docs\u003c/span>, new in this version (v17): pairs of child\nand parent doc numbers. Our hotels have none, so it&#39;s one\nbyte: a count of zero.\u003c/p>\n"},{"id":"bodies","view":{"open":["sectionBodies"],"target":"region.sectionBodies"},"html":"\u003cp>\u003cspan class=\"hl\">The sections\u003c/span>: the bulk of the file. Each field&#39;s term\ndictionary, postings lists and doc values live here.\u003c/p>\n"},{"id":"info","view":{"open":["sectionsInfo"],"target":"region.sectionsInfo"},"expect":["fact:sections.perField=3"],"html":"\u003cp>\u003cspan class=\"hl\">Field info\u003c/span>: for each field, its name, its options, and\nwhere its data is in each kind of section: text (the\ninverted index), synonyms and geo shapes. (zapx built with\nvector support, as cbft is, adds a fourth, for vectors. Our\nexample&#39;s zapx wasn&#39;t.)\u003c/p>\n"},{"id":"index","view":{"open":["sectionsIndex"],"target":"region.sectionsIndex"},"html":"\u003cp>\u003cspan class=\"hl\">The sections index\u003c/span>: where each field&#39;s info starts.\u003c/p>\n"},{"id":"footer","view":{"open":["footer"],"target":"region.footer"},"expect":["fact:footer.bytes=40"],"html":"\u003cp>And \u003cspan class=\"hl\">the footer\u003c/span>: the last 40 bytes. That&#39;s where a reader\nstarts.\u003c/p>\n"}]},{"id":"opening","title":"Opening it","color":"file","steps":[{"id":"zoom","view":{"camera":"footer","target":"region.footer"},"html":"\u003cp>Opening a segment starts at \u003cspan class=\"hl\">the end of the file\u003c/span>.\u003c/p>\n"},{"id":"footer-open","view":{"bubble":["footer"],"target":"lens.footer"},"code":["zapx.footer"],"html":"\u003cp>zapx reads \u003cspan class=\"hl\">the footer\u003c/span> backwards from the last byte. Every\nnumber in it is big-endian.\u003c/p>\n"},{"id":"crc","view":{"focus":"footer.crc","target":"footer.crc"},"html":"\u003cp>Last in the file, so read first: \u003cspan class=\"hl\">a CRC32\u003c/span> of everything\nbefore it. It&#39;s read here, but not checked when the file is\nopened.\u003c/p>\n"},{"id":"version","view":{"focus":"footer.version","target":"footer.version"},"expect":["fact:footer.version=17"],"html":"\u003cp>\u003cspan class=\"hl\">The format version\u003c/span>: 17. A v17 reader refuses anything\nelse; bleve picks the right zapx version for each file it\nopens.\u003c/p>\n"},{"id":"chunk-mode","view":{"focus":"footer.chunkMode","target":"footer.chunkMode"},"expect":["fact:footer.chunkMode=1026"],"html":"\u003cp>\u003cspan class=\"hl\">The chunk mode\u003c/span>, 1026: how this file chunks its postings\ndata. We&#39;ll meet the chunks later.\u003c/p>\n"},{"id":"sections-offset","view":{"focus":"footer.sectionsIndexOffset","target":"footer.sectionsIndexOffset"},"expect":["fact:footer.sectionsIndexOffset=5644"],"html":"\u003cp>\u003cspan class=\"hl\">Where the sections index is\u003c/span>: byte 5644.\u003c/p>\n"},{"id":"stored-offset","view":{"focus":"footer.storedIndexOffset","target":"footer.storedIndexOffset"},"html":"\u003cp>\u003cspan class=\"hl\">Where the stored index is\u003c/span>: byte 965. Stored fields come\nlast in our story.\u003c/p>\n"},{"id":"num-docs","view":{"focus":"footer.numDocs","target":"footer.numDocs"},"expect":["fact:footer.numDocs=9"],"html":"\u003cp>\u003cspan class=\"hl\">The number of docs\u003c/span>: 9. Before it, an ID length of 0: no\nwriter ID, which is only there when a file callback, such as\nencryption, wrote the file.\u003c/p>\n"},{"id":"to-sections","view":{"camera":"sections","target":"region.sectionsIndex"},"html":"\u003cp>Next, the reader follows the offset back to\n\u003cspan class=\"hl\">the sections index\u003c/span>.\u003c/p>\n"},{"id":"sections-open","view":{"bubble":["sections"],"target":"lens.sections"},"code":["zapx.loadFields"],"html":"\u003cp>\u003cspan class=\"hl\">The sections index\u003c/span>, and the field info it points to.\u003c/p>\n"},{"id":"nf","view":{"focus":"sections.nf","target":"sections.nf"},"expect":["fact:sections.nf=4","fact:fields=_id,city,description,name"],"html":"\u003cp>It starts with \u003cspan class=\"hl\">the number of fields\u003c/span>: 4. \u003ccode>_id\u003c/code> is always\nfirst, then the others by name: city, description, name.\u003c/p>\n"},{"id":"offsets","view":{"focus":"sections.off2","target":"sections.off2"},"html":"\u003cp>Then one 8-byte offset per field, to its info. Our query is\non description, so we follow \u003cspan class=\"hl\">its offset\u003c/span>.\u003c/p>\n"},{"id":"description-info","view":{"focus":"info.description","target":"info.description"},"html":"\u003cp>\u003cspan class=\"hl\">description&#39;s info\u003c/span>: its name, its options (what it\nindexes and stores), and one slot per section.\u003c/p>\n"},{"id":"text-slot","view":{"focus":"info.description.text","target":"info.description.text"},"html":"\u003cp>\u003cspan class=\"hl\">Its text slot\u003c/span> says its inverted index is at byte 4337;\nits synonym and geo slots are 0: no data. That&#39;s all opening\na segment reads: the footer, and every field&#39;s info. No\ndictionary or postings list is touched until a query needs\nit.\u003c/p>\n"}]},{"id":"address","title":"A term's address","color":"dict","steps":[{"id":"zoom","view":{"camera":"record","target":"info.description.text"},"html":"\u003cp>A query for \u003cem>quiet\u003c/em> in description starts at\n\u003cspan class=\"hl\">that address\u003c/span>.\u003c/p>\n"},{"id":"record-open","view":{"bubble":["record"],"target":"lens.record"},"code":["zapx.dictionary"],"html":"\u003cp>At byte 4337, \u003cspan class=\"hl\">description&#39;s record\u003c/span>: three numbers.\u003c/p>\n"},{"id":"doc-values","view":{"focus":"record.dvStart","target":"record.dvStart"},"html":"\u003cp>\u003cspan class=\"hl\">Where its doc values are\u003c/span>: bytes 3985 to 4337. Doc values\nare for sorting and facets; this query doesn&#39;t need them.\u003c/p>\n"},{"id":"dictionary","view":{"focus":"record.dictOffset","target":"record.dictOffset"},"expect":["fact:description.dictOffset=3519","fact:description.fstLen=464"],"html":"\u003cp>And \u003cspan class=\"hl\">where its term dictionary is\u003c/span>: byte 3519. There&#39;s a\nlength, 464 bytes, and then a vellum FST.\u003c/p>\n"}]},{"id":"fst","title":"What an FST is","color":"dict","steps":[{"id":"zoom","view":{"camera":"fst","target":"record.dictOffset"},"html":"\u003cp>Before we walk \u003cspan class=\"hl\">description&#39;s FST\u003c/span>, here&#39;s how one works,\non a smaller one.\u003c/p>\n"},{"id":"fst-open","view":{"bubble":["fst"],"target":"lens.fst"},"expect":["fact:city.terms=7"],"html":"\u003cp>An FST maps each term to a number. This one is\n\u003cspan class=\"hl\">city&#39;s\u003c/span>: 7 terms.\u003c/p>\n"},{"id":"trie","view":{"focus":"fst.trie","target":"fst.trie"},"expect":["fact:city.trieNodes=39"],"html":"\u003cp>Start with \u003cspan class=\"hl\">a trie\u003c/span>: one node per prefix, 39 of them\n(counting the empty one) for avignon, francisco, london,\nmonica, paris, san and santa. Terms that start alike, like\nsan and santa, already share their start.\u003c/p>\n"},{"id":"tails","view":{"focus":"fst.min","target":"fst.min"},"expect":["fact:city.fstStates=31"],"html":"\u003cp>An FST \u003cspan class=\"hl\">shares tails too\u003c/span>: nodes from which the rest of\nevery term is the same merge into one state. 39 nodes become\n31 states. The bigger the dictionary, the more this saves.\u003c/p>\n"},{"id":"outputs","view":{"focus":"fst.outputs","target":"fst.outputs"},"html":"\u003cp>And \u003cspan class=\"hl\">each transition can carry an output\u003c/span>: a term&#39;s value\nis the sum along its path. Here the first letter carries each\nterm&#39;s whole value, its postings offset, and the step from\nsan to santa adds 51 to san&#39;s 1638.\u003c/p>\n"}]},{"id":"lookup","title":"Looking up quiet","color":"dict","steps":[{"id":"zoom","view":{"camera":"walk","target":"lens.fst"},"html":"\u003cp>Back to \u003cspan class=\"hl\">description&#39;s dictionary\u003c/span>.\u003c/p>\n"},{"id":"walk-open","view":{"bubble":["walk"],"target":"lens.walk"},"code":["vellum.get"],"expect":["fact:description.terms=42","fact:description.fstStates=128"],"html":"\u003cp>\u003cspan class=\"hl\">description&#39;s FST\u003c/span> has 42 terms and 128 states. Looking\nup \u003cem>quiet\u003c/em> walks it one byte at a time, adding up outputs.\u003c/p>\n"},{"id":"start","view":{"focus":"walk.0","target":"walk.0"},"html":"\u003cp>\u003cspan class=\"hl\">The start state\u003c/span>: 19 ways out, one for each letter a term\nstarts with.\u003c/p>\n"},{"id":"q","view":{"focus":"walk.1","target":"walk.1"},"expect":["fact:quaint.value=3016"],"html":"\u003cp>Take q. Its transition carries \u003cspan class=\"hl\">3016\u003c/span>. That happens to be\n\u003cem>quaint\u003c/em>&#39;s whole value: the FST puts outputs as early as it\ncan.\u003c/p>\n"},{"id":"u","view":{"focus":"walk.2","target":"walk.2"},"html":"\u003cp>Then \u003cspan class=\"hl\">u\u003c/span>, which adds nothing.\u003c/p>\n"},{"id":"i","view":{"focus":"walk.3","target":"walk.3"},"html":"\u003cp>Two ways out here: a, toward quaint, and i, toward quiet.\n\u003cspan class=\"hl\">Taking i\u003c/span> adds 51.\u003c/p>\n"},{"id":"e","view":{"focus":"walk.4","target":"walk.4"},"html":"\u003cp>Then \u003cspan class=\"hl\">e\u003c/span>...\u003c/p>\n"},{"id":"t","view":{"focus":"walk.5","target":"walk.5"},"html":"\u003cp>...and t. \u003cspan class=\"hl\">This state\u003c/span> is final: quiet is a term in this\ndictionary.\u003c/p>\n"},{"id":"value","view":{"focus":"walk.value","target":"walk.value"},"expect":["fact:quiet.value=3067"],"html":"\u003cp>Its value: 3016 + 51 = \u003cspan class=\"hl\">3067\u003c/span>. The top two bits are 00, so\nit&#39;s an offset: quiet&#39;s postings list is at byte 3067. (A\nterm in a single doc can instead get 10: its doc number and\nfield length packed right into the value, with no postings\nlist at all. Only merges write those.)\u003c/p>\n"}]},{"id":"postings","title":"The postings","color":"postings","steps":[{"id":"zoom","view":{"camera":"postings","target":"walk.value"},"html":"\u003cp>Following \u003cspan class=\"hl\">that offset\u003c/span>.\u003c/p>\n"},{"id":"postings-open","view":{"bubble":["postings"],"target":"lens.postings"},"code":["zapx.postingsList"],"html":"\u003cp>At byte 3067, \u003cspan class=\"hl\">quiet&#39;s postings list\u003c/span>.\u003c/p>\n"},{"id":"header","view":{"focus":"postings.header","target":"postings.header"},"expect":["fact:quiet.bitmapLen=22"],"html":"\u003cp>\u003cspan class=\"hl\">A small header\u003c/span>: where its freq/norm data is (3039),\nwhere its locations are (3047), and the bitmap&#39;s length, 22\nbytes. The freq and location data were written just before\nit.\u003c/p>\n"},{"id":"bitmap","view":{"focus":"postings.bitmap","target":"postings.bitmap"},"html":"\u003cp>Then \u003cspan class=\"hl\">a roaring bitmap\u003c/span> of the docs with quiet, used right\nwhere it is in the mmapped file, without copying it.\u003c/p>\n"},{"id":"containers","view":{"focus":"postings.docs","target":"postings.docs"},"expect":["fact:quiet.docs=0,1,2"],"html":"\u003cp>Roaring splits each doc number into a 16-bit container key\nand a 16-bit value. With 9 docs it&#39;s one container, key 0,\nand with few values it&#39;s a sorted array:\n\u003cspan class=\"hl\">docs 0, 1 and 2\u003c/span>. (A container with more than 4096 values is a 65,536-bit\nbitmap instead.)\u003c/p>\n"}]},{"id":"deleted","title":"Minus the deleted","color":"postings","steps":[{"id":"deleted","view":{"focus":"postings.deleted","target":"postings.deleted"},"expect":["fact:deleted=2","fact:deleted.id=hotel_16521"],"html":"\u003cp>But doc 2, The Wellington, was updated after this segment\nwas written, so this copy is deleted. \u003cspan class=\"hl\">That fact\u003c/span> isn&#39;t in\nthis file: files never change once written. It&#39;s in the root\nsnapshot, as a roaring bitmap per segment, and persisted in\n\u003ccode>root.bolt\u003c/code>.\u003c/p>\n"},{"id":"live","view":{"focus":"postings.live","target":"postings.live"},"code":["zapx.postingsIterator"],"expect":["fact:quiet.live=0,1"],"html":"\u003cp>So the docs that count are the postings ANDNOT the deleted:\n\u003cspan class=\"hl\">0 and 1\u003c/span>.\u003c/p>\n"}]},{"id":"scoring","title":"Scoring","color":"postings","steps":[{"id":"zoom","view":{"camera":"freq","target":"postings.header"},"html":"\u003cp>To score them, the reader goes to \u003cspan class=\"hl\">the freq/norm data\u003c/span>.\u003c/p>\n"},{"id":"freq-open","view":{"bubble":["freq"],"target":"lens.freq"},"html":"\u003cp>At byte 3039, \u003cspan class=\"hl\">quiet&#39;s freq/norm data\u003c/span>.\u003c/p>\n"},{"id":"chunk","view":{"focus":"freq.chunk","target":"freq.chunk"},"expect":["fact:quiet.chunks=1"],"html":"\u003cp>It&#39;s split into chunks by doc number, so a reader can jump\nto the one it needs. In chunk mode 1026, chunks aim for\nabout 1024 hits each; quiet has three hits, so\n\u003cspan class=\"hl\">one chunk\u003c/span>.\u003c/p>\n"},{"id":"doc0","view":{"focus":"freq.hit0","target":"freq.hit0"},"expect":["fact:doc0.fieldLen=5"],"html":"\u003cp>\u003cspan class=\"hl\">Doc 0\u003c/span>: quiet appears once, with locations, in a\ndescription of 5 indexed terms. The &quot;norm&quot; stored here is\nreally that length; the score&#39;s 1/√5 is worked out when it&#39;s\nread. None of this is compressed: these are plain varints.\u003c/p>\n"},{"id":"doc2","view":{"focus":"freq.hit2","target":"freq.hit2"},"html":"\u003cp>\u003cspan class=\"hl\">Doc 2\u003c/span> is deleted. Its entry is still there, and the\nreader steps over it.\u003c/p>\n"}]},{"id":"two-terms","title":"Two terms","color":"postings","steps":[{"id":"zoom","view":{"camera":"and","target":"freq.hit0"},"html":"\u003cp>Now a query for \u003cem>quiet\u003c/em> AND \u003cem>hotel\u003c/em>, still in\n\u003cspan class=\"hl\">description\u003c/span>.\u003c/p>\n"},{"id":"and-open","view":{"bubble":["and"],"target":"lens.and"},"code":["scorch.conjunction"],"html":"\u003cp>\u003cspan class=\"hl\">Both terms\u003c/span>, per segment.\u003c/p>\n"},{"id":"quiet","view":{"focus":"and.quiet","target":"and.quiet"},"html":"\u003cp>\u003cspan class=\"hl\">quiet\u003c/span>, minus the deleted, as before: 0 and 1.\u003c/p>\n"},{"id":"hotel","view":{"focus":"and.hotel","target":"and.hotel"},"expect":["fact:hotel.docs=0,1,3,6,7"],"html":"\u003cp>\u003cspan class=\"hl\">hotel\u003c/span>, found the same way: its own walk, its own\npostings. Docs 0, 1, 3, 6 and 7.\u003c/p>\n"},{"id":"result","view":{"focus":"and.result","target":"and.result"},"expect":["fact:and.result=0,1"],"html":"\u003cp>AND the two bitmaps: \u003cspan class=\"hl\">docs 0 and 1\u003c/span>. Scorch really does\nAND the bitmaps, segment by segment, before scoring what&#39;s\nleft.\u003c/p>\n"}]},{"id":"stored","title":"Getting a hit back","color":"stored","steps":[{"id":"zoom","view":{"camera":"stored","target":"region.storedIndex"},"html":"\u003cp>For each hit, the search returns its ID, and maybe its\nfields, from \u003cspan class=\"hl\">the stored fields\u003c/span>.\u003c/p>\n"},{"id":"stored-open","view":{"bubble":["stored"],"target":"lens.stored"},"code":["zapx.storedFields"],"html":"\u003cp>\u003cspan class=\"hl\">Doc 0&#39;s stored fields\u003c/span>.\u003c/p>\n"},{"id":"index","view":{"focus":"stored.index","target":"stored.index"},"html":"\u003cp>The 8 bytes at 965, the first entry of\n\u003cspan class=\"hl\">the stored index\u003c/span>, say doc 0&#39;s record is at byte 0.\u003c/p>\n"},{"id":"record","view":{"focus":"stored.record","target":"stored.record"},"expect":["fact:stored0.metaLen=16"],"html":"\u003cp>\u003cspan class=\"hl\">The record\u003c/span>: two lengths, then 16 bytes of metadata (which\nfield each value is, and where), then the data.\u003c/p>\n"},{"id":"id","view":{"focus":"stored.id","target":"stored.id"},"expect":["fact:stored0.id=hotel_21844","fact:stored0.idLen=11"],"html":"\u003cp>The data starts with \u003cspan class=\"hl\">the doc&#39;s ID\u003c/span>, hotel_21844,\nuncompressed. Getting a hit&#39;s ID decompresses nothing.\u003c/p>\n"},{"id":"snappy","view":{"focus":"stored.snappy","target":"stored.snappy"},"expect":["fact:stored0.snappyLen=63"],"html":"\u003cp>\u003cspan class=\"hl\">The rest\u003c/span>, 63 bytes, is compressed with snappy, one doc\nat a time. It&#39;s decompressed only when the fields are\nasked for.\u003c/p>\n"},{"id":"fields","view":{"focus":"stored.fields","target":"stored.fields"},"html":"\u003cp>\u003cspan class=\"hl\">Decompressed\u003c/span>: Hôtel Astor Saint Honoré, in Paris, &quot;4-star\nhotel on a quiet street.&quot;\u003c/p>\n"},{"id":"overview","view":{"camera":"overview","target":"region.footer"},"html":"\u003cp>That&#39;s everything this query read: the footer, the field\ninfo, one record, one path through one FST, two postings\nlists and their freq/norm data, and one stored record. The\nlit bytes on the strip are \u003cspan class=\"hl\">a small part\u003c/span> of the file, and\nthe rest was never touched.\u003c/p>\n"}]}],"id":"02-zap-format","subtitleHtml":"\u003cp>What scorch reads, byte by byte, when a query asks for a word: the file layout, vellum FSTs, roaring bitmaps and stored fields.\u003c/p>\n"},"snippets":{"zapx.open":{"id":"zapx.open","repo":"zapx","path":"segment.go","title":"zapx open() — mmap the file, then read the footer and fields","start":52,"end":110,"highlight":[57,84,90],"url":"https://github.com/blevesearch/zapx/blob/6594f3d6bd0d/segment.go#L52-L110","lines":["\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-keyword\">func\u003c/span> \u003cspan class=\"hljs-params\">(*ZapPlugin)\u003c/span>\u003c/span> open(path \u003cspan class=\"hljs-type\">string\u003c/span>, config \u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>]\u003cspan class=\"hljs-keyword\">interface\u003c/span>{}) (segment.Segment, \u003cspan class=\"hljs-type\">error\u003c/span>) {","\tf, err := os.Open(path)","\t\u003cspan class=\"hljs-keyword\">if\u003c/span> err != \u003cspan class=\"hljs-literal\">nil\u003c/span> {","\t\t\u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-literal\">nil\u003c/span>, err","\t}","\tmm, err := mmap.Map(f, mmap.RDONLY, \u003cspan class=\"hljs-number\">0\u003c/span>)","\t\u003cspan class=\"hljs-keyword\">if\u003c/span> err != \u003cspan class=\"hljs-literal\">nil\u003c/span> {","\t\t\u003cspan class=\"hljs-comment\">// mmap failed, try to close the file\u003c/span>","\t\t_ = f.Close()","\t\t\u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-literal\">nil\u003c/span>, err","\t}","","\trv := &amp;Segment{","\t\tSegmentBase: SegmentBase{","\t\t\tfieldsMap:         \u003cspan class=\"hljs-built_in\">make\u003c/span>(\u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>]\u003cspan class=\"hljs-type\">uint16\u003c/span>),","\t\t\tfieldsOptions:     \u003cspan class=\"hljs-built_in\">make\u003c/span>(\u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>]index.FieldIndexingOptions),","\t\t\tinvIndexCache:     newInvertedIndexCache(),","\t\t\tvecIndexCache:     newVectorIndexCache(),","\t\t\tsynIndexCache:     newSynonymIndexCache(),","\t\t\tgeoIndexCache:     newGeoIndexCache(),","\t\t\tnstIndexCache:     newNestedIndexCache(),","\t\t\ttrainedIndexCache: newTrainedIndexCache(),","\t\t\tfieldDvReaders:    \u003cspan class=\"hljs-built_in\">make\u003c/span>([][]*docValueReader, \u003cspan class=\"hljs-built_in\">len\u003c/span>(segmentSections)),","\t\t\tconfig:            config,","\t\t},","\t\tf:    f,","\t\tmm:   mm,","\t\tpath: path,","\t\trefs: \u003cspan class=\"hljs-number\">1\u003c/span>,","\t}","\trv.SegmentBase.updateSize()","","\terr = rv.loadConfig()","\t\u003cspan class=\"hljs-keyword\">if\u003c/span> err != \u003cspan class=\"hljs-literal\">nil\u003c/span> {","\t\t_ = rv.Close()","\t\t\u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-literal\">nil\u003c/span>, err","\t}","","\terr = rv.loadFields()","\t\u003cspan class=\"hljs-keyword\">if\u003c/span> err != \u003cspan class=\"hljs-literal\">nil\u003c/span> {","\t\t_ = rv.Close()","\t\t\u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-literal\">nil\u003c/span>, err","\t}","","\terr = rv.loadDvReaders()","\t\u003cspan class=\"hljs-keyword\">if\u003c/span> err != \u003cspan class=\"hljs-literal\">nil\u003c/span> {","\t\t_ = rv.Close()","\t\t\u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-literal\">nil\u003c/span>, err","\t}","","\t\u003cspan class=\"hljs-comment\">// initialize any of the caches if needed\u003c/span>","\terr = rv.nstIndexCache.initialize(rv.numDocs, rv.getEdgeListOffset(), rv.mem)","\t\u003cspan class=\"hljs-keyword\">if\u003c/span> err != \u003cspan class=\"hljs-literal\">nil\u003c/span> {","\t\t_ = rv.Close()","\t\t\u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-literal\">nil\u003c/span>, err","\t}","","\t\u003cspan class=\"hljs-keyword\">return\u003c/span> rv, \u003cspan class=\"hljs-literal\">nil\u003c/span>","}"]},"zapx.footer":{"id":"zapx.footer","repo":"zapx","path":"segment.go","title":"zapx loadConfig() — the footer, read backwards from the end","start":243,"end":294,"highlight":[249,262,267],"url":"https://github.com/blevesearch/zapx/blob/6594f3d6bd0d/segment.go#L243-L294","lines":["\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-keyword\">func\u003c/span> \u003cspan class=\"hljs-params\">(s *Segment)\u003c/span>\u003c/span> loadConfig() \u003cspan class=\"hljs-type\">error\u003c/span> {","\t\u003cspan class=\"hljs-comment\">// read offsets of 32 bit values - crc, ver, chunk\u003c/span>","\tcrcOffset := \u003cspan class=\"hljs-built_in\">len\u003c/span>(s.mm) - \u003cspan class=\"hljs-number\">4\u003c/span>","\tverOf
