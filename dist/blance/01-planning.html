<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside blance: how partitions are assigned to nodes</title>
<meta name="description" content="How blance, a library for placing partitions on nodes, decides which node gets each partition's primary and replicas: greedily, one partition at a time, and what happens when nodes join and leave.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: story on the left, one large diagram in the middle
   that the story zooms around and opens up section by section, and
   charts on the right with leader lines into the diagram. Each section
   has its own color, used for its frame, lid, story headings and the
   "where am I" breadcrumb.

   These are the engine's neutral tokens and its default fonts. A
   topic's look (its palette, section colors, fonts) is in
   topics/<topic>/style.css, after these; an explainer's own styles,
   in topics/<topic>/<name>/style.css, come last. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5a6977;
  --line: #d3dae0;
  --faint: #e7ecf0;
  --accent: #c2410c;
  --flow: #7b8a97;

  --sec-neutral: #5a6977;

  --code-bg: #f6f8fa;
  --code-hl: #fff4d6;
  --code-kw: #a3266b;
  --code-str: #1d6a3a;
  --code-com: #6b7785;
  --code-fn: #1d5fb0;
  --code-num: #9a5b00;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
    --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
    --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
  --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
  --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); }
a { color: var(--accent); }
code, kbd { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.sec-neutral { --sec: var(--sec-neutral); }
/* the end card: after the last step has scrolled off, and, at the
   bottom of the page, stopped in the middle of the screen */
.next-card { margin: 85vh 0 calc(50vh - 4.5rem); }
.story:has(> .next-card) { padding-bottom: 0; }
.next-link { font: 600 1.15rem var(--font-display); color: var(--accent); text-decoration: none; }
.next-link:hover { text-decoration: underline; }
.next-link + .up-link, .end-note + .up-link { margin-top: 1rem; }
.up-link + .top-link { margin-top: 0.35rem; }
.next-link + .top-link, .end-note + .top-link { margin-top: 1rem; }
.end-note { font: 600 1.15rem var(--font-display); color: var(--ink); }
.up-link, .top-link { display: block; font: 500 0.95rem var(--font-body); color: var(--muted); text-decoration: none; }
.up-link:hover, .top-link:hover { color: var(--accent); text-decoration: underline; }

/* ---------- layout ----------
   Wide screens: the diagram fills the window behind a transparent story
   column whose text sits on opaque cards; the camera frames its region
   to the right of the story. The charts column opens on the right when
   --chrome (0..1, set from the scroll position) says so. */

.layout {
  --chrome: 0;
  --gutter: max(16px, 2vw);
  --story-w: min(27rem, 38vw);
  --charts-w: calc(var(--chrome) * 18rem);
  position: relative;
}
.story {
  position: relative;
  z-index: 2;
  width: var(--story-w);
  margin-left: var(--gutter);
  padding-block: 4.5rem 45vh;
  pointer-events: none; /* let drags reach the diagram between cards */
}
.story .card { pointer-events: auto; }
.stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.toolbar {
  position: absolute;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: calc(var(--gutter) + var(--story-w) + 1.5rem);
  right: calc(var(--charts-w) + 1rem);
}
.viewport {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.charts {
  /* transparent, like the story column: each chart is its own card */
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--charts-w);
  z-index: 1;
  padding: 4rem calc(var(--chrome) * 1rem) 1rem 0;
  pointer-events: none;
}
.charts .chart { pointer-events: auto; }
.diagram { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viewport.dragging .diagram { cursor: grabbing; }
.zoom { position: absolute; right: calc(var(--charts-w) + 0.6rem); bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.zbtn {
  width: 2rem; height: 2rem;
  font: 500 1rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer;
}
.zbtn:hover { border-color: var(--accent); }
.zoom-hint { font: 400 0.6875rem/1 var(--font-mono); color: var(--muted); }
@media (max-width: 1100px) { .zoom-hint { display: none; } }
.charts { display: flex; flex-direction: column; gap: 1.6rem; overflow: hidden; }
.chart { min-width: 15rem; padding: 0.7rem 0.85rem 0.8rem; }
.overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; overflow: visible; }

/* ---------- story ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--faint);
  border-radius: 10px;
  box-shadow: 0 4px 18px rgba(20, 30, 40, 0.08);
  padding: 1.1rem 1.35rem;
}
.hero { margin-bottom: 4rem; padding-block: 1.6rem; }
.eyebrow { font: 600 0.75rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
a.eyebrow { text-decoration: none; }
a.eyebrow:hover { text-decoration: underline; }
.hero h1 { font: 600 2.4rem/1.08 var(--font-display); margin: 0.5rem 0 1rem; text-wrap: balance; }
.hero .subtitle { color: var(--muted); font-size: 1.15rem; line-height: 1.45; }
.hero .subtitle p { margin: 0; }
.hero .meta { margin-top: 1.25rem; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.hero .meta a { color: inherit; }
.scroll-hint { margin-top: 2.5rem; font: 500 0.875rem var(--font-body); color: var(--muted); }

.chapter-title {
  font: 600 1.5rem/1.15 var(--font-display);
  margin: 5rem 0 0;
  color: var(--ink);
  text-wrap: balance;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  width: fit-content;
  max-width: 100%;
  padding-block: 0.7rem;
}
.chapter-dot { flex: none; width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--sec); }
.step {
  min-height: 70vh;
  padding-block: 2rem;
  max-width: 62ch;
}
.step.step-long { min-height: 170vh; }
/* a scrubbing step's text stays in view while it plays */
.card pre { font: 400 0.8rem/1.55 var(--font-mono); background: var(--code-bg); border-radius: 6px; padding: 0.7rem 0.9rem; margin: 0.9rem 0; overflow-x: auto; }
.card pre code { font-size: inherit; }
.step.step-scrub > .card { position: sticky; top: 18vh; }
.step .card { opacity: 0.55; transition: opacity 0.4s ease; }
.step.active .card { opacity: 1; }
.step p { margin: 0 0 0.9em; }
.step ul, .step ol { padding-left: 1.3em; margin: 0 0 0.9em; }
.step li { margin-bottom: 0.3em; }
.step strong { font-weight: 600; }
.hl { font-weight: 600; }
.step.active .hl { color: var(--accent); }

.code-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.code-chip {
  font: 400 0.75rem/1.3 var(--font-mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.7rem;
  text-align: left;
  cursor: pointer;
}
.code-chip.stacked { border-radius: 10px; }
.code-chip.stacked > .repo, .code-chip.stacked > .name { display: block; }
.code-chip.stacked > .sep { display: none; }
.code-chip .sep { color: var(--muted); }
.code-chip:hover { border-color: var(--accent); color: var(--accent); }
.code-chip .repo { color: var(--muted); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; font: 400 0.75rem/1 var(--font-mono); color: var(--muted); }
.toolbar .spacer { flex: 1; }
.tools { display: grid; justify-items: end; align-items: center; }
.tools > * { grid-area: 1 / 1; }
.controls { display: inline-flex; align-items: center; gap: 0.5rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 9ch; }
.crumb { display: inline-flex; align-items: center; gap: 0.45rem; font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em; color: var(--ink); }
.crumb-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--sec); }
.btn {
  font: 500 0.75rem/1 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- overlay lines ---------- */

.callout { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.callout-end { fill: var(--accent); }
.leader { fill: none; stroke: var(--muted); stroke-opacity: 0.45; stroke-width: 1; }
.leader-end { fill: var(--muted); fill-opacity: 0.7; }

/* ---------- diagram ----------
   Shared basics; each explainer's own diagram styles are in
   topics/<topic>/<name>/style.css, appended after these. */

.diagram text { font-family: var(--font-mono); }
.arrowhead { fill: var(--flow); }
.target-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.5; }
/* ---------- contents ---------- */

.toc {
  position: fixed;
  z-index: 12;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: var(--gutter, 16px);
}
.toc-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.5rem 0.75rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.toc-btn:hover, .toc-btn[aria-expanded="true"] { border-color: var(--muted); }
.toc-icon { font-size: 0.95rem; color: var(--muted); }
.toc-panel {
  position: absolute; top: calc(100% + 0.4rem); left: 0;
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100vh - 5rem); overflow-y: auto;
  padding: 0.5rem;
  display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.toc-head { font: 600 0.6875rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.5rem 0.6rem 0.6rem; }
.toc-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  padding: 0.5rem 0.6rem; border-radius: var(--radius);
  font: 500 0.9375rem/1.25 var(--font-display); color: var(--ink); text-decoration: none;
}
.toc-item .chapter-dot { width: 0.6rem; height: 0.6rem; }
.toc-item:hover, .toc-item:focus-visible { background: var(--faint); outline: none; }
.toc-item.current { background: color-mix(in srgb, var(--sec) 12%, var(--panel)); font-weight: 600; }

/* ---------- drawers ---------- */

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(52rem, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
  z-index: 20;
  display: flex; flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 600 1rem/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; }
.drawer .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.drawer .tabs .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.drawer .body { flex: 1; overflow: auto; min-height: 0; }
.drawer .where { padding: 0.5rem 1rem; font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
.code { font: 400 0.78rem/1.55 var(--font-mono); background: var(--code-bg); margin: 0; padding: 0.5rem 0; overflow-x: auto; tab-size: 4; }
.code .ln { display: flex; white-space: pre; padding-right: 1rem; }
.code .ln.hl { background: var(--code-hl); font-weight: 400; }
.code .n { flex: none; width: 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--muted); user-select: none; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-number, .hljs-literal { color: var(--code-num); }

/* ---------- narrower screens ---------- */

@media (max-width: 1250px) {
  .layout { --charts-w: 0px; --story-w: min(24rem, 40vw); }
  .charts { display: none; }
}
/* Phones: the diagram is a sticky panel on top; the story scrolls below. */
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; padding-inline: 16px; --story-w: 100%; --gutter: 0px; }
  .stage { position: sticky; inset: auto; top: 0; order: -1; height: 56vh; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; padding-block: 0.5rem; }
  .toolbar { position: static; flex-wrap: wrap; padding-left: 7.5rem; min-height: 2.1rem; }
  .toc { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); left: 16px; }
  .viewport { position: relative; inset: auto; flex: 1; min-height: 0; }
  .tools, .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; }
  .story { width: auto; margin-left: 0; padding-block: 1rem 60vh; pointer-events: auto; }
  .step { min-height: 50vh; scroll-margin-top: 58vh; }
  .step.step-scrub > .card { top: 60vh; }
  /* (the next card stops under the diagram, not behind it) */
  .story:has(> .next-card) { padding-bottom: 6vh; }
  .next-card { margin-bottom: 0; }
  .hero h1 { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The blance topic's look, shared by its explainers: warm paper and
   ink, teal primaries and amber replicas, and its own fonts (named in
   topic.yaml). After the engine's styles, before each explainer's. */
:root {
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg: #f5f0e6;
  --panel: #fffcf5;
  --panel-2: #f8f3e8;
  --ink: #1f1c17;
  --muted: #6b6253;
  --line: #ddd2bd;
  --faint: #ece4d3;
  --accent: #b3264f;
  --flow: #8a8172;

  --primary: #0e6b6b;
  --on-primary: #ffffff;
  --replica: #a86a00;
  --replica-bg: #fdf1d8;
  --join: #2f7d32;
  --leave: #c0392b;
  --focus: #2f6fd6;

  --sec-map: #5a5146;
  --sec-primary: #0e6b6b;
  --sec-replica: #a86a00;
  --sec-change: #b3264f;
  --sec-groups: #5b4fa8;
  --sec-neutral: #6b6253;

  --code-bg: #f8f3e8;
  --code-hl: #fbe9c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
    --accent: #f06b93; --flow: #8f8676;
    --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61; --focus: #7ea6ff;
    --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
    --code-bg: #191612; --code-hl: #3a3018;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
  --accent: #f06b93; --flow: #8f8676;
  --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61; --focus: #7ea6ff;
  --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
  --code-bg: #191612; --code-hl: #3a3018;
}

/* its chapters' colors */
.sec-map { --sec: var(--sec-map); }
.sec-primary { --sec: var(--sec-primary); }
.sec-replica { --sec: var(--sec-replica); }
.sec-change { --sec: var(--sec-change); }
.sec-groups { --sec: var(--sec-groups); }

/* The 01-planning explainer's diagram. Appended to the engine's styles
   and the blance topic's (../style.css), which has its palette. */

.diagram .btitle { font: 600 22px var(--font-display); fill: var(--ink); }
.diagram .bsub { font: 400 16px var(--font-body); fill: var(--muted); }
.diagram .brow { fill: var(--faint); opacity: 0.6; }
.diagram .brow-label { font: 500 14px var(--font-body); fill: var(--muted); }
.diagram .bband { fill: none; stroke: var(--accent); stroke-width: 2; }
.diagram .bcol-line { stroke: var(--line); }
.diagram .bnode { font: 600 16px var(--font-display); fill: var(--ink); }
.diagram .btag { font: 500 12px var(--font-body); }
.diagram .btag-absent { fill: var(--muted); }
.diagram .btag-joining { fill: var(--join); }
.diagram .btag-leaving { fill: var(--leave); }
.diagram .bgroup { fill: none; stroke: var(--sec-groups); stroke-width: 1.5; }
.diagram .bgroup-label { font: 600 13px var(--font-display); fill: var(--sec-groups); }
.diagram .chip { stroke-width: 1.5; }
.diagram .chip-primary { fill: var(--primary); stroke: var(--primary); }
.diagram .chip-replica { fill: var(--replica-bg); stroke: var(--replica); }
.diagram .chip-label { font: 600 13px var(--font-mono); }
.diagram .chip-label-primary { fill: var(--on-primary); }
.diagram .chip-label-replica { fill: var(--replica); }
.diagram .bchosen { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.diagram .tbar-primary { fill: var(--primary); }
.diagram .tbar-replica { fill: var(--replica); }
.diagram .tcount { font: 500 13px var(--font-mono); fill: var(--ink); }

.diagram .panel { fill: var(--panel); stroke: var(--line); }
.diagram .ptitle { font: 600 18px var(--font-display); fill: var(--ink); }
.diagram .pnote { font: 400 15px var(--font-body); fill: var(--muted); }
.diagram .paxis { stroke: var(--muted); }
.diagram .pgrid { stroke: var(--line); stroke-dasharray: 3 4; }
.diagram .paxis-label { font: 11px var(--font-mono); fill: var(--muted); }
.diagram .prow-node { font: 600 14px var(--font-display); fill: var(--ink); }
.diagram .prow-out { fill: var(--muted); font-weight: 400; }
.diagram .prow-won-bg { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); }
.diagram .pbar-primary { fill: var(--primary); }
.diagram .pbar-replica { fill: var(--replica); }
.diagram .pbar-spread { fill: url(#bspread); stroke: var(--sec-groups); stroke-width: 0.8; }
.diagram .bspread-bg { fill: var(--panel); }
.diagram .bspread-line { stroke: var(--sec-groups); stroke-width: 2.5; }
.diagram .pbar-fill { fill: var(--muted); }
.diagram .pbar-moves { fill: var(--accent); }
.diagram .psticky { stroke: var(--join); stroke-width: 2.5; stroke-dasharray: 5 3; fill: none; }
.diagram .pscore-dot { fill: var(--ink); }
.diagram .pscore { font: 500 14px var(--font-mono); fill: var(--ink); }
.diagram .pscore-won { fill: var(--accent); font-weight: 600; }
.diagram .pterm { font: 400 12px var(--font-mono); fill: var(--muted); }
.diagram .pterm-strong { fill: var(--ink); font-weight: 600; }
.diagram .pterm-sticky { fill: var(--join); }
.diagram .pkey { font: 400 12px var(--font-body); fill: var(--muted); }
.diagram .pmove { stroke-width: 1.2; }
.diagram .pmove-add { fill: color-mix(in srgb, var(--join) 14%, var(--panel)); stroke: var(--join); }
.diagram .pmove-del { fill: color-mix(in srgb, var(--leave) 12%, var(--panel)); stroke: var(--leave); }
.diagram .pmove-promote, .diagram .pmove-demote { fill: var(--panel-2); stroke: var(--muted); }
.diagram .pmove-label { font: 500 12px var(--font-mono); fill: var(--ink); }
.diagram .ptotal { font: 600 16px var(--font-display); fill: var(--accent); }
.diagram .tedge { stroke: var(--muted); }
.diagram .tnode { fill: var(--panel-2); stroke: var(--line); }
.diagram .tnode-from { fill: var(--primary); stroke: var(--primary); }
.diagram .tnode-in { fill: color-mix(in srgb, var(--join) 18%, var(--panel)); stroke: var(--join); }
.diagram .tnode-out { opacity: 0.45; }
.diagram .tnode-label { font: 500 13px var(--font-body); fill: var(--ink); }
.diagram .tnode-from + .tnode-label { fill: var(--on-primary); }

/* the score strip */
.diagram .swon { fill: color-mix(in srgb, var(--accent) 8%, transparent); stroke: var(--accent); stroke-width: 1.5; }
.diagram .pscore-line { stroke: var(--ink); stroke-width: 2; }
.diagram .pwon { font: 600 12px var(--font-body); fill: var(--accent); }
.diagram .staken { fill: var(--bg); opacity: 0.65; }

/* arrows from the board to the strip: where each term comes from */
.diagram .sarc { fill: none; stroke-linecap: round; }
.diagram .sarc-head { stroke: var(--bg); stroke-width: 1.2; stroke-linejoin: round; }
.diagram .sarc-halo { fill: none; stroke: var(--bg); stroke-linecap: round; }
.diagram .sarc-count.sarc-primary { stroke: var(--primary); }
.diagram .sarc-head.sarc-count.sarc-primary { fill: var(--primary); }
.diagram .sarc-count.sarc-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-count.sarc-replica { fill: var(--replica); }
.diagram .sarc-spread { stroke: var(--sec-groups); }
.diagram .sarc-head.sarc-spread { fill: var(--sec-groups); }
.diagram .sarc-fill { stroke: var(--muted); stroke-opacity: 0.8; }
.diagram .sarc-head.sarc-fill { fill: var(--muted); }
.diagram .sarc-sticky { stroke: var(--join); }
.diagram .sarc-head.sarc-sticky { fill: var(--join); }
.diagram .sarc-pick { stroke: var(--accent); }
.diagram .sarc-head.sarc-pick { fill: var(--accent); }

/* the attention box: what to look at, this step */
.diagram .bgreyed { fill: color-mix(in srgb, var(--muted) 22%, var(--bg)); fill-opacity: 0.75; }
.diagram .sfocus { fill: color-mix(in srgb, var(--focus) 5%, transparent); stroke: var(--focus); stroke-opacity: 0.6; stroke-width: 3; pointer-events: none; }

/* the moves: each node's copies built and deleted, and on the board */
.diagram .mbar-add { fill: color-mix(in srgb, var(--join) 70%, var(--panel)); }
.diagram .mbar-del { fill: color-mix(in srgb, var(--leave) 70%, var(--panel)); }
.diagram .mmark-built { fill: none; stroke: var(--join); stroke-width: 2.5; }
.diagram .lghost-label { font: 600 13px var(--font-mono); fill: var(--leave); fill-opacity: 0.85; }
.diagram .mmark-deleted { fill: color-mix(in srgb, var(--leave) 8%, transparent); stroke: var(--leave); stroke-width: 1.5; stroke-dasharray: 4 3; }

/* the pick's verdict on the board */
.diagram .vghost { fill: none; stroke-width: 1.5; stroke-dasharray: 4 3; }
.diagram .vghost-label { font: 600 13px var(--font-mono); stroke: none; fill-opacity: 0.7; }
.diagram .vghost-label.vghost-primary { fill: var(--primary); stroke: none; }
.diagram .vghost-label.vghost-replica { fill: var(--replica); stroke: none; }
.diagram .vghost-primary { stroke: var(--primary); }
.diagram .vghost-replica { stroke: var(--replica); }
.diagram .varrow { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 3; }
.diagram .varrow-head { fill: var(--accent); }
.diagram .vlabel { font: 700 14px var(--font-display); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.diagram .vlabel-moved { fill: var(--accent); }
.diagram .vlabel-stays { fill: var(--join); }

/* what the outlined row is about */
.diagram .bband-label { font: 600 12.5px var(--font-display); fill: var(--accent); }
.diagram .bband.pick-primary { stroke: var(--primary); }
.diagram .bband.pick-replica { stroke: var(--replica); }
.diagram .bband-label.pick-primary { fill: var(--primary); }
.diagram .bband-label.pick-replica { fill: var(--replica); }

/* the pick, in the color of the state being placed: primary or replica */
.diagram .swon.pick-primary { fill: color-mix(in srgb, var(--primary) 10%, transparent); stroke: var(--primary); }
.diagram .swon.pick-replica { fill: color-mix(in srgb, var(--replica) 12%, transparent); stroke: var(--replica); }
.diagram .bchosen.pick-primary { stroke: var(--primary); }
.diagram .bchosen.pick-replica { stroke: var(--replica); }
.diagram .sarc-pick.pick-primary { stroke: var(--primary); }
.diagram .sarc-head.sarc-pick.pick-primary { fill: var(--primary); }
.diagram .sarc-pick.pick-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-pick.pick-replica { fill: var(--replica); }
.diagram .pscore-won.pick-primary, .diagram .pwon.pick-primary { fill: var(--primary); }
.diagram .pscore-won.pick-replica, .diagram .pwon.pick-replica { fill: var(--replica); }

/* stickiness, in the color of the state being placed */
.diagram .psticky.pick-primary, .diagram .sarc-sticky.pick-primary { stroke: var(--primary); }
.diagram .psticky.pick-replica, .diagram .sarc-sticky.pick-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-sticky.pick-primary, .diagram .pterm-sticky.pick-primary { fill: var(--primary); }
.diagram .sarc-head.sarc-sticky.pick-replica, .diagram .pterm-sticky.pick-replica { fill: var(--replica); }

/* "reassigned!", and its arrow, in the color of the state that moved */
.diagram .vlabel-moved.pick-primary, .diagram .varrow-head.pick-primary { fill: var(--primary); }
.diagram .vlabel-moved.pick-replica, .diagram .varrow-head.pick-replica { fill: var(--replica); }
.diagram .varrow.pick-primary { stroke: var(--primary); }
.diagram .varrow.pick-replica { stroke: var(--replica); }

/* between the board and the area under it */
.diagram .bsep { stroke: var(--line); stroke-width: 1; }

/* an arrow for a term with nothing to count (it adds 0), from the tallies */
.diagram .sarc-zero { stroke-opacity: 0.7; }

</style>

<script type="application/json" id="bx-data">{"narrative":{"sources":["blance","cbgt"],"next":"02-moving","title":"Inside blance: how partitions are assigned to nodes","subtitle":"How blance, a library for placing partitions on nodes, decides which node gets each partition's primary and replicas: greedily, one partition at a time, and what happens when nodes join and leave.","audience":"Engineers who build or run distributed systems","chapters":[{"id":"map","title":"The partition map","color":"map","steps":[{"id":"intro","view":{"target":"board.title","focus":"board"},"code":["blance.PartitionMap"],"expect":["fact:fresh.end.counts=a3/3 b3/2 c2/3"],"html":"\u003cp>Many distributed systems split their data into partitions,\nor shards, and place each partition on some of the cluster&#39;s\nnodes: a primary on one node, replicas on others. Deciding\nwhere is a problem of its own, and\n\u003ca href=\"https://github.com/couchbase/blance\" target=\"_blank\" rel=\"noopener\">blance\u003c/a> is a small,\nopen-source library in Go for just that, for distributed systems with partitions to\nplace.\u003c/p>\n\u003cp>What blance computes is \u003cspan class=\"hl\">the partition map\u003c/span>: here, we see a\npartition map that blance computed with eight partitions across\nthree nodes. First, let&#39;s go over how to read this partition map; then, how\nblance computes it.\u003c/p>\n"},{"id":"model","view":{"target":"row.0"},"code":["blance.PartitionModel","cbgt.model"],"html":"\u003cp>The partition map has a row per partition and a column per\nnode. In a cell, a chip represents a state that the node holds\nthe partition in. The states come from the app&#39;s model:\nblance knows nothing about primaries or replicas, only states,\neach with a priority and how many nodes the state wants. A\ncommon model, and the model used here (Couchbase&#39;s cbgt uses\nit for its search indexes): a primary, with priority 0, on one\nnode, and replicas, with priority 1, one node each. So each of\n\u003cspan class=\"hl\">the partitions\u003c/span> wants a primary and a replica.\u003c/p>\n"},{"id":"primary","view":{"target":"chip.P"},"expect":["fact:fresh.end.counts=a3/3 b3/2 c2/3"],"html":"\u003cp>A \u003cspan class=\"hl\">P\u003c/span> chip represents a primary: the partition&#39;s main copy,\nthe copy that the app normally works with. Partition 0&#39;s\nprimary is on node a. To blance, the primary is just the state\nwith the highest priority (0), wanted on exactly one node.\u003c/p>\n"},{"id":"replica","view":{"target":"chip.R"},"html":"\u003cp>An \u003cspan class=\"hl\">R\u003c/span> chip represents a replica: a further copy, on\nanother node, ready to take over (be promoted) if the\nprimary&#39;s node is lost. Partition 0&#39;s replica is on node c.\nAnd, a replica never goes on its own primary&#39;s node: that\nwould be no help if the primary node fails.\u003c/p>\n"},{"id":"tallies","view":{"target":"tally.a","focus":"tallies"},"expect":["fact:fresh.end.counts=a3/3 b3/2 c2/3"],"html":"\u003cp>Under each node&#39;s column are \u003cspan class=\"hl\">its tallies\u003c/span>: how many\nprimaries (P) and how many replicas (R) the node holds, shown\nas two bars and their counts. Node a holds 3 primaries and 3\nreplicas, node b 3 and 2, and node c 2 and 3: as even as eight\npartitions on three nodes can be. Keeping the tallies even, so\nthat no node holds much more than the others, is most of what\nblance&#39;s planner is for.\u003c/p>\n"},{"id":"call","view":{"at":"fresh.prev","target":"node.a","focus":"board"},"code":["blance.PlanNextMapEx"],"expect":["fact:fresh.prev.counts=a0/0 b0/0 c0/0"],"html":"\u003cp>So how does blance compute the partition map? Its\n\u003ccode>PlanNextMapEx()\u003c/code> function takes the current partition map,\nall the nodes, the nodes joining and the nodes leaving, the\nmodel and some options, and computes the next partition map.\nLet&#39;s start from nothing: the current partition map has no\npartitions assigned yet, and \u003cspan class=\"hl\">nodes a, b and c\u003c/span> are all\njoining.\u003c/p>\n"}]},{"id":"primaries","title":"Primaries first","color":"primary","steps":[{"id":"states","view":{"panel":"score","target":"scores","focus":"strip"},"code":["blance.states","blance.assign"],"html":"\u003cp>The planner goes state by state, most important first: the\nplanner assigns every partition&#39;s primary first, then assigns\nevery partition&#39;s replicas. Within that outer loop, the\nplanner loops partition by partition, and for each partition\ngives every node \u003cspan class=\"hl\">a score\u003c/span>: the lowest scoring node wins\n(is assigned the partition). Let&#39;s walk through it.\u003c/p>\n"},{"id":"decision","view":{"at":"fresh.1~row","target":"deciding"},"expect":["fact:fresh.1.partition=0","fact:fresh.1.state=primary"],"html":"\u003cp>So each step of the planner is one decision, about one\npartition in one state. The first decision is\n\u003cspan class=\"hl\">partition 0\u003c/span>&#39;s primary, and partition 0&#39;s row is outlined\nin the partition map.\u003c/p>\n"},{"id":"first","view":{"at":"fresh.1","target":"winner","focus":"strip"},"code":["blance.nodeLess"],"expect":["fact:fresh.1.a=0.0000","fact:fresh.1.winner=a"],"html":"\u003cp>Under the partition map, the planner calculates each node&#39;s\nscore, shown in each node&#39;s column. Nothing is placed anywhere\nyet, so every node scores 0. A tie goes to the node that comes\nfirst in the node list, here the leftmost: node \u003cspan class=\"hl\">a\u003c/span> wins and\nis assigned partition 0&#39;s primary, so a P chip appears in node\na&#39;s column, above.\u003c/p>\n"},{"id":"next","view":{"at":"fresh.2~row","target":"deciding"},"expect":["fact:fresh.2.partition=1"],"html":"\u003cp>The next decision is \u003cspan class=\"hl\">partition 1\u003c/span>&#39;s primary. The scores at\nthe bottom start again at 0. The planner scores the nodes one\nat a time, so let&#39;s follow along.\u003c/p>\n"},{"id":"count","view":{"at":"fresh.2~a.count","target":"bar.a","focus":"col.a"},"code":["blance.nodeScore"],"expect":["fact:fresh.2.a.count=1"],"html":"\u003cp>Node a first, and the main term: how many partitions the node\nalready holds in this state. Node a holds one primary,\npartition 0&#39;s, so \u003cspan class=\"hl\">node a&#39;s bar\u003c/span> rises to 1.\u003c/p>\n"},{"id":"spread","view":{"at":"fresh.2~a.spread","target":"bar.a","focus":"col.a"},"html":"\u003cp>Then \u003cspan class=\"hl\">a hatched part\u003c/span>, which matters for replicas, coming\nup: how many partitions with the same primary node the node\nalready backs up, ÷ the number of partitions. For a primary\nthere&#39;s no primary node yet, so it counts every primary\nassigned so far in this pass, 1/8 each, and only node a has\none.\u003c/p>\n"},{"id":"fill","view":{"at":"fresh.2~a.fill","target":"bar.a","focus":"col.a"},"expect":["fact:fresh.2.a.pre=1.1251"],"html":"\u003cp>And a tie-breaker, too small to see: 0.001 × all the\npartitions on the node ÷ the number of partitions, 0.0001 for\nnode a. Node \u003cspan class=\"hl\">a&#39;s final score\u003c/span>: 1.1251.\u003c/p>\n"},{"id":"count-pick","view":{"at":"fresh.2","target":"winner","focus":"strip"},"expect":["fact:fresh.2.b=0.0000","fact:fresh.2.c=0.0000","fact:fresh.2.winner=b"],"html":"\u003cp>Then node b, and then node c, the same way: nodes b and c\nhold nothing, so both score 0. The lowest score wins: nodes b\nand c tie, and node \u003cspan class=\"hl\">b\u003c/span> is first in the list, so node b\nwins.\u003c/p>\n"},{"id":"round","view":{"at":"fresh.primaries","target":"tally.a","focus":"tallies"},"expect":["fact:fresh.primaries.counts=a3/0 b3/0 c2/0"],"html":"\u003cp>And so on, round the nodes: a, b, c, a, b, c, a, b. Eight\nprimaries on three nodes: node \u003cspan class=\"hl\">a has 3\u003c/span>, node b 3, and node\nc 2. Every partition&#39;s primary is assigned.\u003c/p>\n"}]},{"id":"replicas","title":"Then the replicas","color":"replica","steps":[{"id":"greyed","view":{"at":"fresh.9~row","target":"node.a","focus":"col.a"},"code":["blance.exclude"],"expect":["fact:fresh.9.partition=0","fact:fresh.9.state=replica"],"html":"\u003cp>The replicas start again at partition 0. Partition 0&#39;s\nprimary is on node a, so \u003cspan class=\"hl\">node a&#39;s column\u003c/span> is greyed out:\na replica never goes on its own primary&#39;s node, where it would\nbe no help if that node failed. So the planner doesn&#39;t score\nnode a at all.\u003c/p>\n"},{"id":"exclude","view":{"at":"fresh.9","target":"winner","focus":"strip"},"expect":["fact:fresh.9.partition=0","fact:fresh.9.b=0.0004","fact:fresh.9.c=0.0003","fact:fresh.9.winner=c"],"html":"\u003cp>Nodes b and c hold no replicas yet, and node c wins by\n0.0001. The tie-breaker, 0.001 × all the partitions on the\nnode ÷ the number of partitions, favours the emptier node,\nand node \u003cspan class=\"hl\">c\u003c/span> holds 2 primaries to node b&#39;s 3.\u003c/p>\n"},{"id":"next-two","view":{"at":"fresh.11","target":"winner","focus":"strip"},"expect":["fact:fresh.10.partition=1","fact:fresh.10.a=0.0004","fact:fresh.10.c=1.0004","fact:fresh.10.winner=a","fact:fresh.11.partition=2","fact:fresh.11.b=0.0004","fact:fresh.11.a=1.0005","fact:fresh.11.winner=b"],"html":"\u003cp>Partition 1&#39;s primary is on node b, so this time node b&#39;s\ncolumn is greyed out. Node a, with no replicas yet, wins at\n0.0004 to node c&#39;s 1.0004. Then partition 2&#39;s primary is on\nnode c, and node \u003cspan class=\"hl\">b\u003c/span>, with no replicas yet, wins at 0.0004\nto node a&#39;s 1.0005.\u003c/p>\n"},{"id":"spread","view":{"at":"fresh.12","target":"winner","focus":"strip"},"code":["blance.nodeScore"],"expect":["fact:fresh.12.partition=3","fact:fresh.12.b=1.0005","fact:fresh.12.c=1.1254","fact:fresh.12.winner=b"],"html":"\u003cp>Partition 3&#39;s primary is on node a, too, and node c already\nbacks up partition 0, another of node a&#39;s primaries. So node c\ngets the hatched 1/8 more. That&#39;s what the hatched term is\nfor: spreading node a&#39;s replicas over several nodes, so that\nif node a fails, several nodes share taking over for it, not\njust one. Node \u003cspan class=\"hl\">b\u003c/span> wins, at 1.0005 to node c&#39;s 1.1254.\u003c/p>\n"},{"id":"done","view":{"at":"fresh.replicas","target":"tally.b","focus":"tallies"},"expect":["fact:fresh.replicas.counts=a3/3 b3/2 c2/3"],"html":"\u003cp>The rest of the replicas go the same way. Every node ends up\nwith 5 or 6 partitions: node a with 3 primaries and 3\nreplicas, node \u003cspan class=\"hl\">b with 3 and 2\u003c/span>, and node c with 2 and 3.\u003c/p>\n"},{"id":"again","view":{"at":"fresh.end","target":"scores","focus":"strip"},"code":["blance.converge"],"expect":["fact:fresh.iterations=2"],"html":"\u003cp>Then blance does it all again, starting from the partition\nmap just computed, up to 10 times, until a pass changes\nnothing. Here the second pass changes nothing, so the planner\nis \u003cspan class=\"hl\">done\u003c/span>, in 2 passes.\u003c/p>\n"}]},{"id":"join","title":"A node joins","color":"change","steps":[{"id":"joins","view":{"at":"add.prev","target":"node.d","focus":"col.d"},"html":"\u003cp>Now \u003cspan class=\"hl\">node d\u003c/span> joins, and a rebalance asks for the next\npartition map: from the current partition map, with node d as\na node to add.\u003c/p>\n"},{"id":"order","view":{"at":"add.1~a.fill","target":"bar.a","focus":"col.a"},"code":["blance.partitionOrder","blance.nodeScore"],"expect":["fact:add.1.partition=0","fact:add.1.a.pre=3.0008"],"html":"\u003cp>Partitions not yet on a new node go first, so the first\ndecision is partition 0&#39;s primary. Node a first: node a holds\n3 primaries, and before stickiness node \u003cspan class=\"hl\">a\u003c/span> scores 3.0008.\u003c/p>\n"},{"id":"stickiness","view":{"at":"add.1~a.sticky","target":"bar.a","focus":"col.a"},"expect":["fact:add.1.a=1.5008"],"html":"\u003cp>But node a holds partition 0&#39;s primary now, and staying put\nis worth 1.5, the stickiness, taken off the score of the node\nthat already holds the partition in this state: node \u003cspan class=\"hl\">a\u003c/span>\nscores 1.5008.\u003c/p>\n"},{"id":"d-wins","view":{"at":"add.1","target":"winner","focus":"strip"},"expect":["fact:add.1.b=3.0006","fact:add.1.c=2.0006","fact:add.1.d=0.0000","fact:add.1.winner=d"],"html":"\u003cp>Then node b scores 3.0006, node c 2.0006, and node d, holding\nnothing, 0: the lowest, so node \u003cspan class=\"hl\">d\u003c/span> is assigned partition\n0&#39;s primary, and partition 0&#39;s primary is reassigned from node\na to node d.\u003c/p>\n"},{"id":"sticky","view":{"at":"add.3","target":"winner"},"expect":["fact:add.3.partition=2","fact:add.3.c=0.5006","fact:add.3.d=2.0002","fact:add.3.winner=c"],"html":"\u003cp>Partition 1&#39;s primary goes to node d, too. But by partition\n2, node d holds 2 primaries and scores 2.0002, while node c,\nholding partition 2&#39;s primary, scores 0.5006: partition 2&#39;s\nprimary \u003cspan class=\"hl\">stays on node c\u003c/span>.\u003c/p>\n"},{"id":"primaries-done","view":{"at":"add.primaries","target":"tally.d","focus":"tallies"},"expect":["fact:add.primaries.counts=a2/3 b2/2 c2/3 d2/0"],"html":"\u003cp>The other primaries stay where they are, and node \u003cspan class=\"hl\">d has 2\u003c/span>\nprimaries, like every node.\u003c/p>\n"},{"id":"replica-order","view":{"at":"add.9~row","target":"deciding","focus":"board"},"code":["blance.partitionOrder"],"expect":["fact:add.9.partition=2","fact:add.15.partition=0","fact:add.16.partition=1"],"html":"\u003cp>Then the replicas, and the planner orders the partitions\nagain, the same way: partitions not yet on the new node go\nfirst. Partitions 0 and 1 now have their primaries on node d,\nso they go last, and the first decision is\n\u003cspan class=\"hl\">partition 2\u003c/span>&#39;s replica.\u003c/p>\n"},{"id":"replica-d","view":{"at":"add.9","target":"winner","focus":"strip"},"expect":["fact:add.9.partition=2","fact:add.9.b=0.5005","fact:add.9.d=0.0003","fact:add.9.winner=d"],"html":"\u003cp>Partition 2&#39;s replica is on node b, which holds 2 replicas;\nnode d holds none, so even with node b&#39;s stickiness, node\n\u003cspan class=\"hl\">d\u003c/span> is assigned partition 2&#39;s replica.\u003c/p>\n"},{"id":"replica-stays","view":{"at":"add.10","target":"winner","focus":"strip"},"expect":["fact:add.10.partition=3","fact:add.10.b.pre=1.0004","fact:add.10.d=1.0004","fact:add.10.b=-0.4996","fact:add.10.winner=b"],"html":"\u003cp>Partition 3&#39;s replica is on node b, too. Node b and node d\nnow hold 1 replica each, and both score 1.0004 before\nstickiness. But stickiness takes 1.5 off node b&#39;s score, so\nnode \u003cspan class=\"hl\">b\u003c/span> scores -0.4996, and partition 3&#39;s replica stays on\nnode b.\u003c/p>\n"},{"id":"replica-c-d","view":{"at":"add.11","target":"winner","focus":"strip"},"expect":["fact:add.11.partition=4","fact:add.11.c=1.5006","fact:add.11.d=1.0004","fact:add.11.winner=d"],"html":"\u003cp>Partition 4&#39;s replica is on node c, which holds 3 replicas.\nEven with stickiness, node c scores 1.5006, and node \u003cspan class=\"hl\">d\u003c/span>,\nholding 1 replica, scores 1.0004: partition 4&#39;s replica is\nreassigned from node c to node d.\u003c/p>\n"},{"id":"replica-b","view":{"at":"add.12","target":"winner","focus":"strip"},"expect":["fact:add.12.partition=5","fact:add.12.a=1.5006","fact:add.12.b=1.0004","fact:add.12.winner=b"],"html":"\u003cp>Partition 5&#39;s replica is on node a, which holds 3 replicas,\nthe most. Node b, having given partition 2&#39;s replica up,\nholds only 1, and node \u003cspan class=\"hl\">b\u003c/span> is assigned partition 5&#39;s\nreplica, from node a.\u003c/p>\n"},{"id":"wrap","view":{"at":"add.16","target":"deciding","focus":"strip"},"expect":["fact:add.13.partition=6","fact:add.14.partition=7","fact:add.15.partition=0","fact:add.16.partition=1"],"html":"\u003cp>Let&#39;s run through the remaining partitions:\n\u003cspan class=\"hl\">partition 6\u003c/span>, then partition 7. And since the replicas\nstarted at partition 2, the planner then wraps around, back\nto partitions 0 and 1.\u003c/p>\n"},{"id":"balanced","view":{"at":"add.replicas","target":"tally.d","focus":"tallies"},"expect":["fact:add.replicas.counts=a2/2 b2/2 c2/2 d2/2"],"html":"\u003cp>The rest of the replicas stay where they are, partitions 0\nand 1 included. Every node ends with\n\u003cspan class=\"hl\">2 primaries and 2 replicas\u003c/span>.\u003c/p>\n"},{"id":"moves","view":{"panel":"moves","target":"moves.total","focus":"strip"},"code":["blance.CalcPartitionMoves"],"expect":["fact:add.moves=10","fact:add.moved=5"],"html":"\u003cp>As moves, from the old partition map to the new one (blance&#39;s\n\u003ccode>CalcPartitionMoves()\u003c/code>): \u003cspan class=\"hl\">10 moves\u003c/span>, over 5 partitions.\u003c/p>\n"},{"id":"optimal","view":{"target":"tally.d","focus":"tallies"},"expect":["fact:add.replicas.counts=a2/2 b2/2 c2/2 d2/2"],"html":"\u003cp>But this isn&#39;t the best partition map possible. Node d needs\n\u003cspan class=\"hl\">4 partitions\u003c/span>, 2 primaries and 2 replicas, and each one\ntakes 2 moves: a copy built on node d, and a copy deleted from\nanother node. So, theoretically 8 moves would be enough\ninstead of 10 moves. Where do the other 2 moves\ncome from?\u003c/p>\n"},{"id":"detour-out","view":{"target":"row.2","focus":"board","trace":"2"},"expect":["fact:add.moves.2=add d:replica, del b"],"html":"\u003cp>\u003cspan class=\"hl\">Partition 2\u003c/span>&#39;s replica moved from node b to node d: a copy\nbuilt on node d, and a copy deleted from node b.\u003c/p>\n"},{"id":"detour-back","view":{"target":"row.5","focus":"board","trace":"5"},"expect":["fact:add.moves.5=add b:replica, del a"],"html":"\u003cp>Then \u003cspan class=\"hl\">partition 5\u003c/span>&#39;s replica moved from node a to node b, to\nmake up for the replica that node b gave up: a copy built on\nnode b, and a copy deleted from node a.\u003c/p>\n"},{"id":"detour","view":{"target":"tally.b","focus":"tallies"},"expect":["fact:add.prev.counts=a3/3 b3/2 c2/3 d0/0","fact:add.replicas.counts=a2/2 b2/2 c2/2 d2/2"],"html":"\u003cp>So \u003cspan class=\"hl\">node b\u003c/span> ends where it started, with 2 replicas, and 2\nof the moves bought nothing. Moving partition 5&#39;s replica\nstraight from node a to node d, and leaving partition 2&#39;s\nreplica on node b would have meant just 8 moves instead of 10.\u003c/p>\n"},{"id":"greedy","view":{"target":"moves.total","focus":"strip"},"html":"\u003cp>Why does blance find 10 moves instead of 8 moves?\nIts planner is greedy: one\npartition at a time, with no look ahead. When the planner\ndecided partition 2&#39;s replica, node d held no replicas and\nscored the lowest, and the planner couldn&#39;t know that\npartition 5&#39;s replica, decided later, could go to node d\ninstead. So blance ends up computing \u003cspan class=\"hl\">10 moves\u003c/span>.\u003c/p>\n"}]},{"id":"leave","title":"A node leaves","color":"change","steps":[{"id":"leaves","view":{"at":"remove.prev","target":"node.b","focus":"col.b"},"html":"\u003cp>Now \u003cspan class=\"hl\">node b\u003c/span> leaves, in a rebalance that removes node b.\u003c/p>\n"},{"id":"drop","view":{"at":"remove.0","target":"row.4","focus":"board"},"html":"\u003cp>First, the planner takes node b out of every partition: \u003cspan class=\"hl\">partition 4\u003c/span> loses its primary, as does partition 7,\nand partitions 3 and 5 lose their replicas.\u003c/p>\n"},{"id":"scores","view":{"panel":"score","target":"scores","focus":"strip"},"html":"\u003cp>Partitions that were on a leaving node go first, before the\nrest. Back to \u003cspan class=\"hl\">the scores\u003c/span>.\u003c/p>\n"},{"id":"no-promote","view":{"at":"remove.1","target":"winner","focus":"strip"},"expect":["fact:remove.1.partition=4","fact:remove.1.a=2.0005","fact:remove.1.d=2.0005","fact:remove.1.winner=a"],"html":"\u003cp>Partition 4&#39;s replica is on node d, so promoting node d&#39;s\nreplica would be cheap, with no data to copy. But stickiness\nonly counts for a node already in the same state: node d is\none of three nodes tied at 2.0005, and node \u003cspan class=\"hl\">a\u003c/span>, first in\nthe list, is assigned partition 4&#39;s primary, as a whole new\ncopy.\u003c/p>\n"},{"id":"left","view":{"at":"remove.replicas","target":"tally.a","focus":"tallies"},"expect":["fact:remove.replicas.counts=a3/3 c3/2 d2/3"],"html":"\u003cp>The rest go the same way: node \u003cspan class=\"hl\">a with 3 and 3\u003c/span>, node c with\n3 and 2, and node d with 2 and 3.\u003c/p>\n"},{"id":"moves","view":{"panel":"moves","target":"row.4","focus":"strip","trace":"4"},"code":["cbgt.failover"],"expect":["fact:remove.moves=8","fact:remove.moves.4=add a:primary, del b"],"html":"\u003cp>8 moves, among them \u003cspan class=\"hl\">partition 4\u003c/span>&#39;s: add node a as\npartition 4&#39;s primary, then delete node b&#39;s copy. (An app can\nhandle a failed node outside blance: cbgt, for one, promotes a\nsurviving replica itself, and uses blance&#39;s partition map only\nfor a partition with no surviving replica.)\u003c/p>\n"},{"id":"gone","view":{"at":"remove.after","target":"board.title","focus":"board"},"expect":["fact:remove.replicas.counts=a3/3 c3/2 d2/3"],"html":"\u003cp>Once the moves are done, node b is out of the cluster, and\nnode b&#39;s column goes away:\n\u003cspan class=\"hl\">nodes a, c and d hold every partition\u003c/span>.\u003c/p>\n"}]},{"id":"knobs","title":"Knobs","color":"neutral","steps":[{"id":"options","view":{"panel":"none","target":"board.title","focus":"board"},"code":["blance.options"],"html":"\u003cp>\u003ccode>PlanNextMapEx()\u003c/code> also takes options, knobs that an app can\nset to shape \u003cspan class=\"hl\">the partition map\u003c/span>:\u003c/p>\n\u003cul>\n\u003cli>the stickiness per state, \u003ccode>StateStickiness\u003c/code>: say, higher\nfor primaries, to keep primaries in place;\u003c/li>\n\u003cli>partition weights, \u003ccode>PartitionWeights\u003c/code>: a heavier partition\ncounts as more than one partition;\u003c/li>\n\u003cli>node weights, \u003ccode>NodeWeights\u003c/code>: a node&#39;s score is divided by\nthe node&#39;s weight, so a bigger node gets more partitions;\u003c/li>\n\u003cli>how many nodes each state wants, \u003ccode>ModelStateConstraints\u003c/code>:\nsay, 2 replicas instead of 1;\u003c/li>\n\u003cli>and a tree of the nodes with rules for the replicas,\n\u003ccode>NodeHierarchy\u003c/code> and \u003ccode>HierarchyRules\u003c/code>, for server groups such\nas for dealing with server racks, rows, cloud regions, etc. (see: \u003ca href=\"03-groups.html\">the third explainer\u003c/a>)\u003c/li>\n\u003c/ul>\n"}]},{"id":"summary","title":"Summary","color":"map","steps":[{"id":"loops","view":{"target":"board.title","focus":"board"},"code":["blance.assign","blance.nodeScore"],"html":"\u003cp>Whether blance is assigning primaries or replicas, and\nwhether nodes are joining or leaving, the planner is two\nnested for-loops: for each state, and for each partition, sum\nup a score for every node, then \u003cspan class=\"hl\">assign the partition\u003c/span> to\nthe node with the lowest score.\u003c/p>\n\u003cpre>\u003ccode>for each state, most important first:\n  for each partition:\n    for each candidate node:\n      score = count + spread\n            + tie-breaker - stickiness\n    assign the lowest scoring node\n\u003c/code>\u003c/pre>\n\u003cp>A state that wants more than one node, say 2 replicas, gets\nthe lowest scoring nodes. And around both loops, a third loop\nruns the whole pass again, up to 10 times, until a pass\nchanges nothing.\u003c/p>\n"},{"id":"takeaway","view":{"target":"tally.a"},"expect":["fact:add.moves=10"],"html":"\u003cp>Joining and leaving nodes only change the inputs to the\nloops: which nodes are candidates, which partitions go first,\nand which nodes get the stickiness.\u003c/p>\n\u003cp>So the takeaway: blance is simple.\u003c/p>\n\u003cp>There&#39;s no search over possible partition maps and no\nlook ahead, just a greedy pass that fills in the partition\nmap one partition at a time, with a score that is mostly a\ncount of what each node already holds. The result is fast,\neasy to calculate and \u003cspan class=\"hl\">close to balanced\u003c/span>.\u003c/p>\n\u003cp>Although blance might not produce the most optimally perfect\npartition maps in all situations,\nit&#39;s simple, straightforward and relatively easy to understand.\u003c/p>\n"}]}],"id":"blance/01-planning","subtitleHtml":"\u003cp>How blance, a library for placing partitions on nodes, decides which node gets each partition&#39;s primary and replicas: greedily, one partition at a time, and what happens when nodes join and leave.\u003c/p>\n"},"snippets":{"blance.PartitionMap":{"id":"blance.PartitionMap","repo":"blance","path":"api.go","title":"blance PartitionMap — each partition's nodes, by state","start":24,"end":36,"highlight":[35],"url":"https://github.com/couchbase/blance/blob/a63f0a3c43ed2794d965d6b869220010ed4b72b7/api.go#L24-L36","lines":["\u003cspan class=\"hljs-keyword\">type\u003c/span> PartitionMap \u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>]*Partition \u003cspan class=\"hljs-comment\">// Keyed by Partition.Name.\u003c/span>","","\u003cspan class=\"hljs-comment\">// A Partition represents a distinct, non-overlapping subset (or a\u003c/span>","\u003cspan class=\"hljs-comment\">// shard) of some logical resource.\u003c/span>","\u003cspan class=\"hljs-keyword\">type\u003c/span> Partition \u003cspan class=\"hljs-keyword\">struct\u003c/span> {","\t\u003cspan class=\"hljs-comment\">// The Name of a Partition must be unique within a PartitionMap.\u003c/span>","\tName \u003cspan class=\"hljs-type\">string\u003c/span> \u003cspan class=\"hljs-string\">`json:&quot;name&quot;`\u003c/span>","","\t\u003cspan class=\"hljs-comment\">// NodesByState is keyed is stateName, and the values are an array\u003c/span>","\t\u003cspan class=\"hljs-comment\">// of node names.  For example, {&quot;primary&quot;: [&quot;a&quot;], &quot;replica&quot;: [&quot;b&quot;,\u003c/span>","\t\u003cspan class=\"hljs-comment\">// &quot;c&quot;]}.\u003c/span>","\tNodesByState \u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>][]\u003cspan class=\"hljs-type\">string\u003c/span> \u003cspan class=\"hljs-string\">`json:&quot;nodesByState&quot;`\u003c/span>","}"]},"blance.PartitionModel":{"id":"blance.PartitionModel","repo":"blance","path":"api.go","title":"blance PartitionModelState — a state's priority, and how many nodes","start":46,"end":62,"highlight":[50,61],"url":"https://github.com/couchbase/blance/blob/a63f0a3c43ed2794d965d6b869220010ed4b72b7/api.go#L46-L62","lines":["\u003cspan class=\"hljs-keyword\">type\u003c/span> PartitionModelState \u003cspan class=\"hljs-keyword\">struct\u003c/span> {","\t\u003cspan class=\"hljs-comment\">// Priority of zero is the highest.  e.g., &quot;primary&quot; Priority\u003c/span>","\t\u003cspan class=\"hljs-comment\">// should be &lt; than &quot;replica&quot; Priority, so we can define that\u003c/span>","\t\u003cspan class=\"hljs-comment\">// as &quot;primary&quot; Priority of 0 and &quot;replica&quot; priority of 1.\u003c/span>","\tPriority \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-string\">`json:&quot;priority&quot;`\u003c/span>","","\t\u003cspan class=\"hljs-comment\">// A Constraint defines how many nodes the algorithm strives to\u003c/span>","\t\u003cspan class=\"hljs-comment\">// assign a partition.  For example, for any given partition,\u003c/span>","\t\u003cspan class=\"hljs-comment\">// perhaps the application wants 1 node to have &quot;primary&quot; state and\u003c/span>","\t\u003cspan class=\"hljs-comment\">// wants 2 nodes to have &quot;replica&quot; state.  That
