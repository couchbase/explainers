<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside blance: how a plan places partitions</title>
<meta name="description" content="How blance, a library for placing partitions on nodes, decides which node gets each partition's primary and replicas: greedily, one partition at a time, and what that means when nodes join and leave.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: story on the left, one large diagram in the middle
   that the story zooms around and opens up section by section, and
   charts on the right with leader lines into the diagram. Each section
   has its own color, used for its frame, lid, story headings and the
   "where am I" breadcrumb.

   These are the engine's neutral tokens and its default fonts. A
   topic's look (its palette, section colors, fonts) is in
   topics/<topic>/style.css, after these; an explainer's own styles,
   in topics/<topic>/<name>/style.css, come last. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5a6977;
  --line: #d3dae0;
  --faint: #e7ecf0;
  --accent: #c2410c;
  --flow: #7b8a97;

  --sec-neutral: #5a6977;

  --code-bg: #f6f8fa;
  --code-hl: #fff4d6;
  --code-kw: #a3266b;
  --code-str: #1d6a3a;
  --code-com: #6b7785;
  --code-fn: #1d5fb0;
  --code-num: #9a5b00;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
    --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
    --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
  --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
  --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); }
a { color: var(--accent); }
code, kbd { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.sec-neutral { --sec: var(--sec-neutral); }
.next-card { margin: 0 0 40vh; }
.next-link { font: 600 1.15rem var(--font-display); color: var(--accent); text-decoration: none; }
.next-link:hover { text-decoration: underline; }
.next-link + .up-link { margin-top: 1rem; }
.up-link { display: block; font: 500 0.95rem var(--font-body); color: var(--muted); text-decoration: none; }
.up-link:hover { color: var(--accent); text-decoration: underline; }

/* ---------- layout ----------
   Wide screens: the diagram fills the window behind a transparent story
   column whose text sits on opaque cards; the camera frames its region
   to the right of the story. The charts column opens on the right when
   --chrome (0..1, set from the scroll position) says so. */

.layout {
  --chrome: 0;
  --gutter: max(16px, 2vw);
  --story-w: min(27rem, 38vw);
  --charts-w: calc(var(--chrome) * 18rem);
  position: relative;
}
.story {
  position: relative;
  z-index: 2;
  width: var(--story-w);
  margin-left: var(--gutter);
  padding-block: 4.5rem 45vh;
  pointer-events: none; /* let drags reach the diagram between cards */
}
.story .card { pointer-events: auto; }
.stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.toolbar {
  position: absolute;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: calc(var(--gutter) + var(--story-w) + 1.5rem);
  right: calc(var(--charts-w) + 1rem);
}
.viewport {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.charts {
  /* transparent, like the story column: each chart is its own card */
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--charts-w);
  z-index: 1;
  padding: 4rem calc(var(--chrome) * 1rem) 1rem 0;
  pointer-events: none;
}
.charts .chart { pointer-events: auto; }
.diagram { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viewport.dragging .diagram { cursor: grabbing; }
.zoom { position: absolute; right: calc(var(--charts-w) + 0.6rem); bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.zbtn {
  width: 2rem; height: 2rem;
  font: 500 1rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer;
}
.zbtn:hover { border-color: var(--accent); }
.zoom-hint { font: 400 0.6875rem/1 var(--font-mono); color: var(--muted); }
@media (max-width: 1100px) { .zoom-hint { display: none; } }
.charts { display: flex; flex-direction: column; gap: 1.6rem; overflow: hidden; }
.chart { min-width: 15rem; padding: 0.7rem 0.85rem 0.8rem; }
.overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; overflow: visible; }

/* ---------- story ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--faint);
  border-radius: 10px;
  box-shadow: 0 4px 18px rgba(20, 30, 40, 0.08);
  padding: 1.1rem 1.35rem;
}
.hero { margin-bottom: 4rem; padding-block: 1.6rem; }
.eyebrow { font: 600 0.75rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
a.eyebrow { text-decoration: none; }
a.eyebrow:hover { text-decoration: underline; }
.hero h1 { font: 600 2.4rem/1.08 var(--font-display); margin: 0.5rem 0 1rem; text-wrap: balance; }
.hero .subtitle { color: var(--muted); font-size: 1.15rem; line-height: 1.45; }
.hero .subtitle p { margin: 0; }
.hero .meta { margin-top: 1.25rem; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.hero .meta a { color: inherit; }
.scroll-hint { margin-top: 2.5rem; font: 500 0.875rem var(--font-body); color: var(--muted); }

.chapter-title {
  font: 600 1.5rem/1.15 var(--font-display);
  margin: 5rem 0 0;
  color: var(--ink);
  text-wrap: balance;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  width: fit-content;
  max-width: 100%;
  padding-block: 0.7rem;
}
.chapter-dot { flex: none; width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--sec); }
.step {
  min-height: 70vh;
  padding-block: 2rem;
  max-width: 62ch;
}
.step.step-long { min-height: 170vh; }
.step .card { opacity: 0.55; transition: opacity 0.4s ease; }
.step.active .card { opacity: 1; }
.step p { margin: 0 0 0.9em; }
.step ul, .step ol { padding-left: 1.3em; margin: 0 0 0.9em; }
.step li { margin-bottom: 0.3em; }
.step strong { font-weight: 600; }
.hl { font-weight: 600; }
.step.active .hl { color: var(--accent); }

.code-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.code-chip {
  font: 400 0.75rem/1.3 var(--font-mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
}
.code-chip:hover { border-color: var(--accent); color: var(--accent); }
.code-chip .repo { color: var(--muted); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; font: 400 0.75rem/1 var(--font-mono); color: var(--muted); }
.toolbar .spacer { flex: 1; }
.tools { display: grid; justify-items: end; align-items: center; }
.tools > * { grid-area: 1 / 1; }
.controls { display: inline-flex; align-items: center; gap: 0.5rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 9ch; }
.crumb { display: inline-flex; align-items: center; gap: 0.45rem; font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em; color: var(--ink); }
.crumb-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--sec); }
.btn {
  font: 500 0.75rem/1 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- overlay lines ---------- */

.callout { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.callout-end { fill: var(--accent); }
.leader { fill: none; stroke: var(--muted); stroke-opacity: 0.45; stroke-width: 1; }
.leader-end { fill: var(--muted); fill-opacity: 0.7; }

/* ---------- diagram ----------
   Shared basics; each explainer's own diagram styles are in
   topics/<topic>/<name>/style.css, appended after these. */

.diagram text { font-family: var(--font-mono); }
.arrowhead { fill: var(--flow); }
.target-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.5; }
/* ---------- contents ---------- */

.toc {
  position: fixed;
  z-index: 12;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: var(--gutter, 16px);
}
.toc-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.5rem 0.75rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.toc-btn:hover, .toc-btn[aria-expanded="true"] { border-color: var(--muted); }
.toc-icon { font-size: 0.95rem; color: var(--muted); }
.toc-panel {
  position: absolute; top: calc(100% + 0.4rem); left: 0;
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100vh - 5rem); overflow-y: auto;
  padding: 0.5rem;
  display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.toc-head { font: 600 0.6875rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.5rem 0.6rem 0.6rem; }
.toc-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  padding: 0.5rem 0.6rem; border-radius: var(--radius);
  font: 500 0.9375rem/1.25 var(--font-display); color: var(--ink); text-decoration: none;
}
.toc-item .chapter-dot { width: 0.6rem; height: 0.6rem; }
.toc-item:hover, .toc-item:focus-visible { background: var(--faint); outline: none; }
.toc-item.current { background: color-mix(in srgb, var(--sec) 12%, var(--panel)); font-weight: 600; }

/* ---------- drawers ---------- */

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(52rem, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
  z-index: 20;
  display: flex; flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 600 1rem/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; }
.drawer .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.drawer .tabs .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.drawer .body { flex: 1; overflow: auto; min-height: 0; }
.drawer .where { padding: 0.5rem 1rem; font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
.code { font: 400 0.78rem/1.55 var(--font-mono); background: var(--code-bg); margin: 0; padding: 0.5rem 0; overflow-x: auto; tab-size: 4; }
.code .ln { display: flex; white-space: pre; padding-right: 1rem; }
.code .ln.hl { background: var(--code-hl); font-weight: 400; }
.code .n { flex: none; width: 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--muted); user-select: none; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-number, .hljs-literal { color: var(--code-num); }

/* ---------- narrower screens ---------- */

@media (max-width: 1250px) {
  .layout { --charts-w: 0px; --story-w: min(24rem, 40vw); }
  .charts { display: none; }
}
/* Phones: the diagram is a sticky panel on top; the story scrolls below. */
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; padding-inline: 16px; --story-w: 100%; --gutter: 0px; }
  .stage { position: sticky; inset: auto; top: 0; order: -1; height: 56vh; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; padding-block: 0.5rem; }
  .toolbar { position: static; flex-wrap: wrap; padding-left: 7.5rem; min-height: 2.1rem; }
  .toc { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); left: 16px; }
  .viewport { position: relative; inset: auto; flex: 1; min-height: 0; }
  .tools, .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; }
  .story { width: auto; margin-left: 0; padding-block: 1rem 60vh; pointer-events: auto; }
  .step { min-height: 50vh; scroll-margin-top: 58vh; }
  .hero h1 { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The blance topic's look, shared by its explainers: warm paper and
   ink, teal primaries and amber replicas, and its own fonts (named in
   topic.yaml). After the engine's styles, before each explainer's. */
:root {
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg: #f5f0e6;
  --panel: #fffcf5;
  --panel-2: #f8f3e8;
  --ink: #1f1c17;
  --muted: #6b6253;
  --line: #ddd2bd;
  --faint: #ece4d3;
  --accent: #b3264f;
  --flow: #8a8172;

  --primary: #0e6b6b;
  --on-primary: #ffffff;
  --replica: #a86a00;
  --replica-bg: #fdf1d8;
  --join: #2f7d32;
  --leave: #c0392b;

  --sec-map: #5a5146;
  --sec-primary: #0e6b6b;
  --sec-replica: #a86a00;
  --sec-change: #b3264f;
  --sec-groups: #5b4fa8;
  --sec-neutral: #6b6253;

  --code-bg: #f8f3e8;
  --code-hl: #fbe9c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
    --accent: #f06b93; --flow: #8f8676;
    --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61;
    --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
    --code-bg: #191612; --code-hl: #3a3018;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
  --accent: #f06b93; --flow: #8f8676;
  --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61;
  --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
  --code-bg: #191612; --code-hl: #3a3018;
}

/* its chapters' colors */
.sec-map { --sec: var(--sec-map); }
.sec-primary { --sec: var(--sec-primary); }
.sec-replica { --sec: var(--sec-replica); }
.sec-change { --sec: var(--sec-change); }
.sec-groups { --sec: var(--sec-groups); }

/* The 01-planning explainer's diagram. Appended to the engine's styles
   and the blance topic's (../style.css), which has its palette. */

.diagram .btitle { font: 600 22px var(--font-display); fill: var(--ink); }
.diagram .bsub { font: 400 16px var(--font-body); fill: var(--muted); }
.diagram .brow { fill: var(--faint); opacity: 0.6; }
.diagram .brow-label { font: 500 14px var(--font-body); fill: var(--muted); }
.diagram .bband { fill: none; stroke: var(--accent); stroke-width: 2; }
.diagram .bcol-line { stroke: var(--line); }

.diagram .btag-absent { fill: var(--muted); }
.diagram .btag-joining { fill: var(--join); }

.diagram .chip-label-replica { fill: var(--replica); }
.diagram .bchosen { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.diagram .tbar-primary { fill: var(--primary); }
.diagram .tbar-replica { fill: var(--replica); }
.diagram .tcount { font: 500 13px var(--font-mono); fill: var(--ink); }

.diagram .panel { fill: var(--panel); stroke: var(--line); }
.diagram .ptitle { font: 600 18px var(--font-display); fill: var(--ink); }
.diagram .pnote { font: 400 15px var(--font-body); fill: var(--muted); }
.diagram .paxis { stroke: var(--muted); }
.diagram .pgrid { stroke: var(--line); stroke-dasharray: 3 4; }
.diagram .paxis-label { font: 11px var(--font-mono); fill: var(--muted); }

.diagram .prow-out { fill: var(--muted); font-weight: 400; }

.diagram .pbar-primary { fill: var(--primary); }

.diagram .pscore-dot { fill: var(--ink); }
.diagram .pscore { font: 500 14px var(--font-mono); fill: var(--ink); }
.diagram .pscore-won { fill: var(--accent); font-weight: 600; }
.diagram .pterm { font: 400 12px var(--font-mono); fill: var(--muted); }
.diagram .pterm-strong { fill: var(--ink); font-weight: 600; }
.diagram .pterm-sticky { fill: var(--join); }
.diagram .pkey { font: 400 12px var(--font-body); fill: var(--muted); }
.diagram .pmove { stroke-width: 1.2; }
.diagram .pmove-add { fill: color-mix(in srgb, var(--join) 14%, var(--panel)); stroke: var(--join); }
.diagram .pmove-del { fill: color-mix(in srgb, var(--leave) 12%, var(--panel)); stroke: var(--leave); }
.diagram .pmove-promote, .diagram .pmove-demote { fill: var(--panel-2); stroke: var(--muted); }
.diagram .pmove-label { font: 500 12px var(--font-mono); fill: var(--ink); }
.diagram .ptotal { font: 600 16px var(--font-display); fill: var(--accent); }
.diagram .tedge { stroke: var(--muted); }
.diagram .tnode { fill: var(--panel-2); stroke: var(--line); }
.diagram .tnode-from { fill: var(--primary); stroke: var(--primary); }
.diagram .tnode-in { fill: color-mix(in srgb, var(--join) 18%, var(--panel)); stroke: var(--join); }
.diagram .tnode-out { opacity: 0.45; }
.diagram .tnode-label { font: 500 13px var(--font-body); fill: var(--ink); }
.diagram .tnode-from + .tnode-label { fill: var(--on-primary); }

/* the score strip */
.diagram .swon { fill: color-mix(in srgb, var(--accent) 8%, transparent); stroke: var(--accent); stroke-width: 1.5; }
.diagram .pscore-line { stroke: var(--ink); stroke-width: 2; }
.diagram .pwon { font: 600 12px var(--font-body); fill: var(--accent); }
.diagram .staken { fill: var(--bg); opacity: 0.65; }

/* arrows from the board to the strip: where each term comes from */
.diagram .sarc { fill: none; stroke-width: 1.6; stroke-linecap: round; }
.diagram .sarc-head { stroke: none; }
.diagram .sarc-count.sarc-primary { stroke: var(--primary); }
.diagram .sarc-head.sarc-count.sarc-primary { fill: var(--primary); }
.diagram .sarc-count.sarc-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-count.sarc-replica { fill: var(--replica); }
.diagram .sarc-spread { stroke: var(--sec-groups); }
.diagram .sarc-head.sarc-spread { fill: var(--sec-groups); }
.diagram .sarc-fill { stroke: var(--muted); stroke-width: 1; stroke-opacity: 0.55; }
.diagram .sarc-head.sarc-fill { fill: var(--muted); }
.diagram .sarc-sticky { stroke: var(--join); stroke-dasharray: none; }
.diagram .sarc-head.sarc-sticky { fill: var(--join); }
.diagram .sarc-pick { stroke: var(--accent); stroke-width: 2; }
.diagram .sarc-head.sarc-pick { fill: var(--accent); }

</style>

<script type="application/json" id="bx-data">{"narrative":{"sources":["blance","cbgt"],"next":"02-moving","title":"Inside blance: how a plan places partitions","subtitle":"How blance, a library for placing partitions on nodes, decides which node gets each partition's primary and replicas: greedily, one partition at a time, and what that means when nodes join and leave.","audience":"Engineers who build or run partitioned systems","chapters":[{"id":"map","title":"The partition map","color":"map","steps":[{"id":"intro","view":{"target":"board.title"},"code":["blance.PartitionMap"],"html":"\u003cp>Many distributed systems split their data into partitions,\nor shards, and place each one on some of the cluster&#39;s nodes:\na primary here, replicas there. Deciding where is a problem\nof its own, and \u003ca href=\"https://github.com/couchbase/blance\" target=\"_blank\" rel=\"noopener\">blance\u003c/a>\nis a small library for just that, for any system with\npartitions to place. What it decides is \u003cspan class=\"hl\">the partition map\u003c/span>:\nfor each partition, its nodes, by state.\u003c/p>\n"},{"id":"model","view":{"target":"row.0"},"code":["blance.PartitionModel","cbgt.model"],"html":"\u003cp>blance knows nothing about primaries or replicas: the states\ncome from the app&#39;s model, each with a priority and how many\nnodes it wants. A common model, and the one here (it&#39;s what\nCouchbase&#39;s cbgt uses for its search indexes): a primary, with\npriority 0 and 1 node, and replicas, with priority 1 and one\nnode per replica. Here, eight partitions and one replica:\n\u003cspan class=\"hl\">partition 0\u003c/span> needs a primary and a replica, on different\nnodes, and so does each of the others.\u003c/p>\n"},{"id":"call","view":{"target":"node.a"},"code":["blance.PlanNextMapEx"],"html":"\u003cp>blance&#39;s \u003ccode>PlanNextMapEx\u003c/code> takes the map as it is, all the\nnodes, the ones joining and the ones leaving, the model and\nsome options, and returns the next map. Here everything is\nnew: nothing is placed yet, and \u003cspan class=\"hl\">nodes a, b and c\u003c/span> are all\njoining.\u003c/p>\n"}]},{"id":"primaries","title":"Primaries first","color":"primary","steps":[{"id":"states","view":{"panel":"score","target":"scores"},"code":["blance.states","blance.assign"],"html":"\u003cp>The planner goes state by state, most important first: every\npartition&#39;s primary, then every partition&#39;s replicas. Within\na state, it goes partition by partition, and for each one it\ngives every node \u003cspan class=\"hl\">a score\u003c/span>: lowest wins.\u003c/p>\n"},{"id":"decision","view":{"at":"fresh.1~row","target":"deciding"},"expect":["fact:fresh.1.partition=0","fact:fresh.1.state=primary"],"html":"\u003cp>So each step of the planner is one decision, about one\npartition in one state. The first: \u003cspan class=\"hl\">partition 0\u003c/span>&#39;s primary,\nits row outlined on the board.\u003c/p>\n"},{"id":"first","view":{"at":"fresh.1","target":"winner"},"code":["blance.nodeLess"],"expect":["fact:fresh.1.a=0.0000","fact:fresh.1.winner=a"],"html":"\u003cp>Under the board, each node&#39;s score for it, in the node&#39;s own\ncolumn. Nothing is placed anywhere yet, so every node scores\n0. A tie goes to the node that comes first in the node list,\nhere the leftmost: \u003cspan class=\"hl\">a\u003c/span> gets partition 0&#39;s primary, and its\nchip appears in a&#39;s column, above.\u003c/p>\n"},{"id":"next","view":{"at":"fresh.2~row","target":"deciding"},"expect":["fact:fresh.2.partition=1"],"html":"\u003cp>The next decision: \u003cspan class=\"hl\">partition 1\u003c/span>&#39;s primary. The bars start\nagain at 0, and this time we&#39;ll add up the score a term at a\ntime.\u003c/p>\n"},{"id":"count","view":{"at":"fresh.2~count","target":"bar.a"},"code":["blance.nodeScore"],"expect":["fact:fresh.2.a.count=1","fact:fresh.2.b.count=0"],"html":"\u003cp>The main term: how many partitions a node already holds in\nthis state. a holds one primary, partition 0&#39;s, so \u003cspan class=\"hl\">a&#39;s bar\u003c/span>\nrises to 1; b and c hold none.\u003c/p>\n"},{"id":"spread","view":{"at":"fresh.2~spread","target":"bar.a"},"html":"\u003cp>Then \u003cspan class=\"hl\">a hatched part\u003c/span>: how often the node already backs the\nsame primary node, ÷ the number of partitions. It&#39;s for\nreplicas, coming up; for a primary there&#39;s no primary node\nyet, so it counts the partitions already placed, 1/8 per\npartition, and only on a.\u003c/p>\n"},{"id":"fill","view":{"at":"fresh.2~fill","target":"bar.a"},"expect":["fact:fresh.2.a.pre=1.1251","fact:fresh.2.b.pre=0.0000"],"html":"\u003cp>And a tie-breaker, too small to see: 0.001 × all the\npartitions on the node ÷ the number of partitions, 0.0001 for\na. \u003cspan class=\"hl\">a&#39;s score\u003c/span>: 1.1251. (A node that already held partition\n1 would now have the stickiness taken off; none does.)\u003c/p>\n"},{"id":"count-pick","view":{"at":"fresh.2","target":"winner"},"expect":["fact:fresh.2.winner=b"],"html":"\u003cp>The lowest wins: b and c tie at 0, and \u003cspan class=\"hl\">b\u003c/span> is first in the\nlist.\u003c/p>\n"},{"id":"round","view":{"at":"fresh.8","target":"tally.a"},"expect":["fact:fresh.8.counts=a3/0 b3/0 c2/0"],"html":"\u003cp>And so on, round the nodes: a, b, c, a, b, c, a, b. Eight\nprimaries on three nodes: \u003cspan class=\"hl\">a has 3\u003c/span>, b 3, and c 2.\u003c/p>\n"}]},{"id":"replicas","title":"Then the replicas","color":"replica","steps":[{"id":"exclude","view":{"at":"fresh.9","target":"winner"},"code":["blance.exclude"],"expect":["fact:fresh.9.partition=0","fact:fresh.9.b=0.0004","fact:fresh.9.c=0.0003","fact:fresh.9.winner=c"],"html":"\u003cp>Partition 0&#39;s replica. Its primary is on a, so a isn&#39;t a\ncandidate (its column says &quot;its primary&quot;): a replica never\ngoes on its primary&#39;s node. b and\nc hold no replicas yet, and c wins by 0.0001: the tie-breaker,\n0.001 × all the partitions on the node ÷ the number of\npartitions, favours the emptier node, and \u003cspan class=\"hl\">c\u003c/span> holds 2\nprimaries to b&#39;s 3.\u003c/p>\n"},{"id":"spread","view":{"at":"fresh.12","target":"winner"},"code":["blance.nodeScore"],"expect":["fact:fresh.12.partition=3","fact:fresh.12.b=1.0005","fact:fresh.12.c=1.1254","fact:fresh.12.winner=b"],"html":"\u003cp>Partition 3&#39;s primary is on a, too, and c already holds the\nreplica of partition 0, another of a&#39;s. So c gets 1/8 more:\nthat term counts how often a node already backs the same\nprimary node, so that if a fails, the replicas taking over\nfor it are spread over several nodes. \u003cspan class=\"hl\">b\u003c/span> wins, at 1.0005\nto c&#39;s 1.1254.\u003c/p>\n"},{"id":"done","view":{"at":"fresh.16","target":"tally.b"},"expect":["fact:fresh.16.counts=a3/3 b3/2 c2/3"],"html":"\u003cp>The rest go the same way. Every node ends up with 5 or 6\npartitions: a with 3 primaries and 3 replicas, \u003cspan class=\"hl\">b with 3 and 2\u003c/span>, c with 2 and 3.\u003c/p>\n"},{"id":"again","view":{"at":"fresh.end","target":"scores"},"code":["blance.converge"],"expect":["fact:fresh.iterations=2"],"html":"\u003cp>Then blance does it all again, starting from its result, up\nto 10 times, until a pass changes nothing. Here the second\npass changes nothing: \u003cspan class=\"hl\">done\u003c/span>, in 2 passes.\u003c/p>\n"}]},{"id":"join","title":"A node joins","color":"change","steps":[{"id":"joins","view":{"at":"add.prev","target":"node.d"},"html":"\u003cp>Now \u003cspan class=\"hl\">node d\u003c/span> joins, and a rebalance asks for the next map:\nfrom the current one, with d as a node to add.\u003c/p>\n"},{"id":"order","view":{"at":"add.1~fill","target":"bar.a"},"code":["blance.partitionOrder","blance.nodeScore"],"expect":["fact:add.1.partition=0","fact:add.1.a.pre=3.0008","fact:add.1.d.pre=0.0000"],"html":"\u003cp>Partitions not yet on a new node go first, so partition 0&#39;s\nprimary. Before stickiness, \u003cspan class=\"hl\">a\u003c/span>, which holds 3 primaries,\nscores 3.0008, and d, with none, 0.\u003c/p>\n"},{"id":"stickiness","view":{"at":"add.1~sticky","target":"bar.a"},"expect":["fact:add.1.a=1.5008"],"html":"\u003cp>But a holds partition 0&#39;s primary now, and staying put is\nworth 1.5, the stickiness, taken off the score of the node\nthat already holds the partition in this state: \u003cspan class=\"hl\">a\u003c/span> scores\n1.5008.\u003c/p>\n"},{"id":"d-wins","view":{"at":"add.1","target":"winner"},"expect":["fact:add.1.d=0.0000","fact:add.1.winner=d"],"html":"\u003cp>Still more than d&#39;s 0: \u003cspan class=\"hl\">d\u003c/span> gets partition 0&#39;s primary.\u003c/p>\n"},{"id":"sticky","view":{"at":"add.3","target":"winner"},"expect":["fact:add.3.partition=2","fact:add.3.c=0.5006","fact:add.3.d=2.0002","fact:add.3.winner=c"],"html":"\u003cp>Partition 1&#39;s primary goes to d, too. But by partition 2, d\nholds 2 and scores 2.0002, while c, holding it, scores 0.5006:\nit \u003cspan class=\"hl\">stays on c\u003c/span>.\u003c/p>\n"},{"id":"primaries-done","view":{"at":"add.8","target":"tally.d"},"expect":["fact:add.8.counts=a2/3 b2/2 c2/3 d2/0"],"html":"\u003cp>The other primaries stay where they are, and \u003cspan class=\"hl\">d has 2\u003c/span>, like\nevery node.\u003c/p>\n"},{"id":"replica-d","view":{"at":"add.9","target":"winner"},"expect":["fact:add.9.partition=2","fact:add.9.b=0.5005","fact:add.9.d=0.0003","fact:add.9.winner=d"],"html":"\u003cp>Then the replicas. Partition 2&#39;s is on b, which holds 2; d\nholds none, so even with b&#39;s stickiness, \u003cspan class=\"hl\">d\u003c/span> gets it.\u003c/p>\n"},{"id":"replica-b","view":{"at":"add.12","target":"winner"},"expect":["fact:add.12.partition=5","fact:add.12.a=1.5006","fact:add.12.b=1.0004","fact:add.12.winner=b"],"html":"\u003cp>Partition 5&#39;s replica is on a, which holds 3, the most. b,\nhaving just given one up, holds only 1, and \u003cspan class=\"hl\">b\u003c/span> takes it\nfrom a.\u003c/p>\n"},{"id":"balanced","view":{"at":"add.16","target":"tally.d"},"expect":["fact:add.16.counts=a2/2 b2/2 c2/2 d2/2"],"html":"\u003cp>The rest stay. Every node ends with \u003cspan class=\"hl\">2 primaries and 2 replicas\u003c/span>.\u003c/p>\n"},{"id":"moves","view":{"panel":"moves","target":"moves.total"},"code":["blance.CalcPartitionMoves"],"expect":["fact:add.moves=10","fact:add.moved=5","fact:add.moves.2=add d:replica, del b","fact:add.moves.5=add b:replica, del a"],"html":"\u003cp>As moves, from the old map to the new (blance&#39;s\n\u003ccode>CalcPartitionMoves\u003c/code>): \u003cspan class=\"hl\">10 moves\u003c/span>, over 5 partitions. d\nneeds 4 partitions, so 8 would do: partition 2&#39;s replica went\nfrom b to d, then partition 5&#39;s from a to b, where a to d\nwould have been one move. The planner is greedy: one\npartition at a time, with no look ahead.\u003c/p>\n"}]},{"id":"leave","title":"A node leaves","color":"change","steps":[{"id":"leaves","view":{"at":"remove.prev","target":"node.b"},"html":"\u003cp>Now \u003cspan class=\"hl\">node b\u003c/span> leaves, in a rebalance that removes it.\u003c/p>\n"},{"id":"drop","view":{"at":"remove.0","target":"row.4"},"html":"\u003cp>First the planner takes b out of every partition: \u003cspan class=\"hl\">partition 4\u003c/span> loses its primary, as does partition 7, and partitions 3\nand 5 their replicas.\u003c/p>\n"},{"id":"scores","view":{"panel":"score","target":"scores"},"html":"\u003cp>Partitions that were on a leaving node go first, before the\nrest. Back to \u003cspan class=\"hl\">the scores\u003c/span>.\u003c/p>\n"},{"id":"no-promote","view":{"at":"remove.1","target":"winner"},"expect":["fact:remove.1.partition=4","fact:remove.1.a=2.0005","fact:remove.1.d=2.0005","fact:remove.1.winner=a"],"html":"\u003cp>Partition 4&#39;s replica is on d, so promoting d would be cheap,\nwith no data to copy. But stickiness only counts for a node\nalready in the same state: d is one of three nodes tied at\n2.0005, and \u003cspan class=\"hl\">a\u003c/span>, first in the list, gets partition 4&#39;s\nprimary, as a whole new copy.\u003c/p>\n"},{"id":"left","view":{"at":"remove.16","target":"tally.a"},"expect":["fact:remove.16.counts=a3/3 c3/2 d2/3"],"html":"\u003cp>The rest: \u003cspan class=\"hl\">a with 3 and 3\u003c/span>, c with 3 and 2, and d with 2\nand 3.\u003c/p>\n"},{"id":"moves","view":{"panel":"moves","target":"moves.4"},"code":["cbgt.failover"],"expect":["fact:remove.moves=8","fact:remove.moves.4=add a:primary, del b"],"html":"\u003cp>8 moves, among them \u003cspan class=\"hl\">partition 4\u003c/span>&#39;s: add a as its primary,\nthen delete b. (An app can handle a failed node outside\nblance: cbgt, for one, promotes a surviving replica itself,\nand uses blance&#39;s plan only for a partition with none.)\u003c/p>\n"}]},{"id":"groups","title":"Server groups","color":"groups","steps":[{"id":"tree","view":{"panel":"tree","target":"tree"},"code":["blance.HierarchyRule"],"html":"\u003cp>Nodes can sit in server groups, say racks or availability\nzones. blance takes them as \u003cspan class=\"hl\">a tree\u003c/span>: each node&#39;s parent.\nHere, a and b are in group g1, and c and d in g2.\u003c/p>\n"},{"id":"without","view":{"at":"nogroups.end","target":"row.0"},"expect":["fact:nogroups.sameGroup=4"],"html":"\u003cp>Planned without the groups, on all four nodes, \u003cspan class=\"hl\">partition 0\u003c/span> gets its primary on a and its replica on b, both in g1,\nand so do 4 of the 8 partitions: lose g1, and partitions 0\nand 1 are gone.\u003c/p>\n"},{"id":"with","view":{"at":"groups.end","target":"row.0"},"code":["cbgt.groupsRule"],"expect":["fact:groups.sameGroup=0"],"html":"\u003cp>A rule for replicas (the app&#39;s to give; this one is cbgt&#39;s\ndefault when there are groups): include level 2, exclude\nlevel 1. From the primary&#39;s node, go up 2 levels (to dc) for\nthe candidates, and take away everything up 1 level (its own\ngroup). Now \u003cspan class=\"hl\">partition 0\u003c/span>&#39;s replica is on c,\nand every replica is in the other group from its primary.\u003c/p>\n"}]},{"id":"sticky","title":"Stickiness, and a quirk","color":"neutral","steps":[{"id":"default","view":{"panel":"stick","target":"stick.default"},"expect":["fact:stick.default=10"],"html":"\u003cp>Stickiness is 1.5 unless the app says otherwise: staying put\nis worth one and a half partitions of imbalance. An app can\nset it per state, say very high for primaries, to keep them\nin place. Adding d to the first map, \u003cspan class=\"hl\">as before\u003c/span>: 10\nmoves.\u003c/p>\n"},{"id":"ignored","view":{"target":"stick.nil"},"code":["blance.stickiness"],"expect":["fact:stick.nil=10"],"html":"\u003cp>But \u003cspan class=\"hl\">set it to 100000\u003c/span> for both states, and it&#39;s still 10\nmoves: blance only reads the per-state stickiness when the\npartition weights option isn&#39;t nil (and then a partition&#39;s\nweight, if it has one, is its stickiness).\u003c/p>\n"},{"id":"honored","view":{"target":"stick.empty"},"expect":["fact:stick.empty=0","fact:stick.zero=13"],"html":"\u003cp>Pass \u003cspan class=\"hl\">an empty partition weights map\u003c/span> instead, and the same\nstickiness keeps everything where it is: 0 moves. (A\nstickiness of 0 gives 13.)\u003c/p>\n"},{"id":"so","html":"\u003cp>So an app that sets per-state stickiness, and no partition\nweights, quietly gets the default. It looks like a bug in\nblance, and one easy to work around: pass an empty map.\u003c/p>\n"}]}],"id":"blance/01-planning","subtitleHtml":"\u003cp>How blance, a library for placing partitions on nodes, decides which node gets each partition&#39;s primary and replicas: greedily, one partition at a time, and what that means when nodes join and leave.\u003c/p>\n"},"snippets":{"blance.PartitionMap":{"id":"blance.PartitionMap","repo":"blance","path":"api.go","title":"blance PartitionMap — each partition's nodes, by state","start":2
