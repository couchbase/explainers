<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside blance: server groups</title>
<meta name="description" content="Telling blance that nodes sit in racks or zones, as a tree and a rule for replicas, so a partition's copies don't all share one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: story on the left, one large diagram in the middle
   that the story zooms around and opens up section by section, and
   charts on the right with leader lines into the diagram. Each section
   has its own color, used for its frame, lid, story headings and the
   "where am I" breadcrumb.

   These are the engine's neutral tokens and its default fonts. A
   topic's look (its palette, section colors, fonts) is in
   topics/<topic>/style.css, after these; an explainer's own styles,
   in topics/<topic>/<name>/style.css, come last. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5a6977;
  --line: #d3dae0;
  --faint: #e7ecf0;
  --accent: #c2410c;
  --flow: #7b8a97;

  --sec-neutral: #5a6977;

  --code-bg: #f6f8fa;
  --code-hl: #fff4d6;
  --code-kw: #a3266b;
  --code-str: #1d6a3a;
  --code-com: #6b7785;
  --code-fn: #1d5fb0;
  --code-num: #9a5b00;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
    --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
    --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
  --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
  --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); }
a { color: var(--accent); }
code, kbd { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.sec-neutral { --sec: var(--sec-neutral); }
/* the end card: after the last step has scrolled off, and, at the
   bottom of the page, stopped in the middle of the screen */
.next-card { margin: 85vh 0 calc(50vh - 4.5rem); }
.story:has(> .next-card) { padding-bottom: 0; }
.next-link { font: 600 1.15rem var(--font-display); color: var(--accent); text-decoration: none; }
.next-link:hover { text-decoration: underline; }
.next-link + .up-link, .end-note + .up-link { margin-top: 1rem; }
.end-note { font: 600 1.15rem var(--font-display); color: var(--ink); }
.up-link { display: block; font: 500 0.95rem var(--font-body); color: var(--muted); text-decoration: none; }
.up-link:hover { color: var(--accent); text-decoration: underline; }

/* ---------- layout ----------
   Wide screens: the diagram fills the window behind a transparent story
   column whose text sits on opaque cards; the camera frames its region
   to the right of the story. The charts column opens on the right when
   --chrome (0..1, set from the scroll position) says so. */

.layout {
  --chrome: 0;
  --gutter: max(16px, 2vw);
  --story-w: min(27rem, 38vw);
  --charts-w: calc(var(--chrome) * 18rem);
  position: relative;
}
.story {
  position: relative;
  z-index: 2;
  width: var(--story-w);
  margin-left: var(--gutter);
  padding-block: 4.5rem 45vh;
  pointer-events: none; /* let drags reach the diagram between cards */
}
.story .card { pointer-events: auto; }
.stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.toolbar {
  position: absolute;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: calc(var(--gutter) + var(--story-w) + 1.5rem);
  right: calc(var(--charts-w) + 1rem);
}
.viewport {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.charts {
  /* transparent, like the story column: each chart is its own card */
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--charts-w);
  z-index: 1;
  padding: 4rem calc(var(--chrome) * 1rem) 1rem 0;
  pointer-events: none;
}
.charts .chart { pointer-events: auto; }
.diagram { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viewport.dragging .diagram { cursor: grabbing; }
.zoom { position: absolute; right: calc(var(--charts-w) + 0.6rem); bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.zbtn {
  width: 2rem; height: 2rem;
  font: 500 1rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer;
}
.zbtn:hover { border-color: var(--accent); }
.zoom-hint { font: 400 0.6875rem/1 var(--font-mono); color: var(--muted); }
@media (max-width: 1100px) { .zoom-hint { display: none; } }
.charts { display: flex; flex-direction: column; gap: 1.6rem; overflow: hidden; }
.chart { min-width: 15rem; padding: 0.7rem 0.85rem 0.8rem; }
.overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; overflow: visible; }

/* ---------- story ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--faint);
  border-radius: 10px;
  box-shadow: 0 4px 18px rgba(20, 30, 40, 0.08);
  padding: 1.1rem 1.35rem;
}
.hero { margin-bottom: 4rem; padding-block: 1.6rem; }
.eyebrow { font: 600 0.75rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
a.eyebrow { text-decoration: none; }
a.eyebrow:hover { text-decoration: underline; }
.hero h1 { font: 600 2.4rem/1.08 var(--font-display); margin: 0.5rem 0 1rem; text-wrap: balance; }
.hero .subtitle { color: var(--muted); font-size: 1.15rem; line-height: 1.45; }
.hero .subtitle p { margin: 0; }
.hero .meta { margin-top: 1.25rem; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.hero .meta a { color: inherit; }
.scroll-hint { margin-top: 2.5rem; font: 500 0.875rem var(--font-body); color: var(--muted); }

.chapter-title {
  font: 600 1.5rem/1.15 var(--font-display);
  margin: 5rem 0 0;
  color: var(--ink);
  text-wrap: balance;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  width: fit-content;
  max-width: 100%;
  padding-block: 0.7rem;
}
.chapter-dot { flex: none; width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--sec); }
.step {
  min-height: 70vh;
  padding-block: 2rem;
  max-width: 62ch;
}
.step.step-long { min-height: 170vh; }
/* a scrubbing step's text stays in view while it plays */
.card pre { font: 400 0.8rem/1.55 var(--font-mono); background: var(--code-bg); border-radius: 6px; padding: 0.7rem 0.9rem; margin: 0.9rem 0; overflow-x: auto; }
.card pre code { font-size: inherit; }
.step.step-scrub > .card { position: sticky; top: 18vh; }
.step .card { opacity: 0.55; transition: opacity 0.4s ease; }
.step.active .card { opacity: 1; }
.step p { margin: 0 0 0.9em; }
.step ul, .step ol { padding-left: 1.3em; margin: 0 0 0.9em; }
.step li { margin-bottom: 0.3em; }
.step strong { font-weight: 600; }
.hl { font-weight: 600; }
.step.active .hl { color: var(--accent); }

.code-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.code-chip {
  font: 400 0.75rem/1.3 var(--font-mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
}
.code-chip:hover { border-color: var(--accent); color: var(--accent); }
.code-chip .repo { color: var(--muted); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; font: 400 0.75rem/1 var(--font-mono); color: var(--muted); }
.toolbar .spacer { flex: 1; }
.tools { display: grid; justify-items: end; align-items: center; }
.tools > * { grid-area: 1 / 1; }
.controls { display: inline-flex; align-items: center; gap: 0.5rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 9ch; }
.crumb { display: inline-flex; align-items: center; gap: 0.45rem; font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em; color: var(--ink); }
.crumb-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--sec); }
.btn {
  font: 500 0.75rem/1 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- overlay lines ---------- */

.callout { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.callout-end { fill: var(--accent); }
.leader { fill: none; stroke: var(--muted); stroke-opacity: 0.45; stroke-width: 1; }
.leader-end { fill: var(--muted); fill-opacity: 0.7; }

/* ---------- diagram ----------
   Shared basics; each explainer's own diagram styles are in
   topics/<topic>/<name>/style.css, appended after these. */

.diagram text { font-family: var(--font-mono); }
.arrowhead { fill: var(--flow); }
.target-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.5; }
/* ---------- contents ---------- */

.toc {
  position: fixed;
  z-index: 12;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: var(--gutter, 16px);
}
.toc-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.5rem 0.75rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.toc-btn:hover, .toc-btn[aria-expanded="true"] { border-color: var(--muted); }
.toc-icon { font-size: 0.95rem; color: var(--muted); }
.toc-panel {
  position: absolute; top: calc(100% + 0.4rem); left: 0;
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100vh - 5rem); overflow-y: auto;
  padding: 0.5rem;
  display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.toc-head { font: 600 0.6875rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.5rem 0.6rem 0.6rem; }
.toc-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  padding: 0.5rem 0.6rem; border-radius: var(--radius);
  font: 500 0.9375rem/1.25 var(--font-display); color: var(--ink); text-decoration: none;
}
.toc-item .chapter-dot { width: 0.6rem; height: 0.6rem; }
.toc-item:hover, .toc-item:focus-visible { background: var(--faint); outline: none; }
.toc-item.current { background: color-mix(in srgb, var(--sec) 12%, var(--panel)); font-weight: 600; }

/* ---------- drawers ---------- */

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(52rem, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
  z-index: 20;
  display: flex; flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 600 1rem/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; }
.drawer .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.drawer .tabs .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.drawer .body { flex: 1; overflow: auto; min-height: 0; }
.drawer .where { padding: 0.5rem 1rem; font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
.code { font: 400 0.78rem/1.55 var(--font-mono); background: var(--code-bg); margin: 0; padding: 0.5rem 0; overflow-x: auto; tab-size: 4; }
.code .ln { display: flex; white-space: pre; padding-right: 1rem; }
.code .ln.hl { background: var(--code-hl); font-weight: 400; }
.code .n { flex: none; width: 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--muted); user-select: none; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-number, .hljs-literal { color: var(--code-num); }

/* ---------- narrower screens ---------- */

@media (max-width: 1250px) {
  .layout { --charts-w: 0px; --story-w: min(24rem, 40vw); }
  .charts { display: none; }
}
/* Phones: the diagram is a sticky panel on top; the story scrolls below. */
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; padding-inline: 16px; --story-w: 100%; --gutter: 0px; }
  .stage { position: sticky; inset: auto; top: 0; order: -1; height: 56vh; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; padding-block: 0.5rem; }
  .toolbar { position: static; flex-wrap: wrap; padding-left: 7.5rem; min-height: 2.1rem; }
  .toc { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); left: 16px; }
  .viewport { position: relative; inset: auto; flex: 1; min-height: 0; }
  .tools, .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; }
  .story { width: auto; margin-left: 0; padding-block: 1rem 60vh; pointer-events: auto; }
  .step { min-height: 50vh; scroll-margin-top: 58vh; }
  .step.step-scrub > .card { top: 60vh; }
  /* (the next card stops under the diagram, not behind it) */
  .story:has(> .next-card) { padding-bottom: 6vh; }
  .next-card { margin-bottom: 0; }
  .hero h1 { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The blance topic's look, shared by its explainers: warm paper and
   ink, teal primaries and amber replicas, and its own fonts (named in
   topic.yaml). After the engine's styles, before each explainer's. */
:root {
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg: #f5f0e6;
  --panel: #fffcf5;
  --panel-2: #f8f3e8;
  --ink: #1f1c17;
  --muted: #6b6253;
  --line: #ddd2bd;
  --faint: #ece4d3;
  --accent: #b3264f;
  --flow: #8a8172;

  --primary: #0e6b6b;
  --on-primary: #ffffff;
  --replica: #a86a00;
  --replica-bg: #fdf1d8;
  --join: #2f7d32;
  --leave: #c0392b;
  --focus: #2f6fd6;

  --sec-map: #5a5146;
  --sec-primary: #0e6b6b;
  --sec-replica: #a86a00;
  --sec-change: #b3264f;
  --sec-groups: #5b4fa8;
  --sec-neutral: #6b6253;

  --code-bg: #f8f3e8;
  --code-hl: #fbe9c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
    --accent: #f06b93; --flow: #8f8676;
    --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61; --focus: #7ea6ff;
    --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
    --code-bg: #191612; --code-hl: #3a3018;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
  --accent: #f06b93; --flow: #8f8676;
  --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61; --focus: #7ea6ff;
  --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
  --code-bg: #191612; --code-hl: #3a3018;
}

/* its chapters' colors */
.sec-map { --sec: var(--sec-map); }
.sec-primary { --sec: var(--sec-primary); }
.sec-replica { --sec: var(--sec-replica); }
.sec-change { --sec: var(--sec-change); }
.sec-groups { --sec: var(--sec-groups); }

/* The 01-planning explainer's diagram. Appended to the engine's styles
   and the blance topic's (../style.css), which has its palette. */

.diagram .btitle { font: 600 22px var(--font-display); fill: var(--ink); }
.diagram .bsub { font: 400 16px var(--font-body); fill: var(--muted); }
.diagram .brow { fill: var(--faint); opacity: 0.6; }
.diagram .brow-label { font: 500 14px var(--font-body); fill: var(--muted); }
.diagram .bband { fill: none; stroke: var(--accent); stroke-width: 2; }
.diagram .bcol-line { stroke: var(--line); }
.diagram .bnode { font: 600 16px var(--font-display); fill: var(--ink); }
.diagram .btag { font: 500 12px var(--font-body); }
.diagram .btag-absent { fill: var(--muted); }
.diagram .btag-joining { fill: var(--join); }
.diagram .btag-leaving { fill: var(--leave); }
.diagram .bgroup { fill: none; stroke: var(--sec-groups); stroke-width: 1.5; }
.diagram .bgroup-label { font: 600 13px var(--font-display); fill: var(--sec-groups); }
.diagram .chip { stroke-width: 1.5; }
.diagram .chip-primary { fill: var(--primary); stroke: var(--primary); }
.diagram .chip-replica { fill: var(--replica-bg); stroke: var(--replica); }
.diagram .chip-label { font: 600 13px var(--font-mono); }
.diagram .chip-label-primary { fill: var(--on-primary); }
.diagram .chip-label-replica { fill: var(--replica); }
.diagram .bchosen { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.diagram .tbar-primary { fill: var(--primary); }
.diagram .tbar-replica { fill: var(--replica); }
.diagram .tcount { font: 500 13px var(--font-mono); fill: var(--ink); }

.diagram .panel { fill: var(--panel); stroke: var(--line); }
.diagram .ptitle { font: 600 18px var(--font-display); fill: var(--ink); }
.diagram .pnote { font: 400 15px var(--font-body); fill: var(--muted); }
.diagram .paxis { stroke: var(--muted); }
.diagram .pgrid { stroke: var(--line); stroke-dasharray: 3 4; }
.diagram .paxis-label { font: 11px var(--font-mono); fill: var(--muted); }
.diagram .prow-node { font: 600 14px var(--font-display); fill: var(--ink); }
.diagram .prow-out { fill: var(--muted); font-weight: 400; }
.diagram .prow-won-bg { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); }
.diagram .pbar-primary { fill: var(--primary); }
.diagram .pbar-replica { fill: var(--replica); }
.diagram .pbar-spread { fill: url(#bspread); stroke: var(--sec-groups); stroke-width: 0.8; }
.diagram .bspread-bg { fill: var(--panel); }
.diagram .bspread-line { stroke: var(--sec-groups); stroke-width: 2.5; }
.diagram .pbar-fill { fill: var(--muted); }
.diagram .pbar-moves { fill: var(--accent); }
.diagram .psticky { stroke: var(--join); stroke-width: 2.5; stroke-dasharray: 5 3; fill: none; }
.diagram .pscore-dot { fill: var(--ink); }
.diagram .pscore { font: 500 14px var(--font-mono); fill: var(--ink); }
.diagram .pscore-won { fill: var(--accent); font-weight: 600; }
.diagram .pterm { font: 400 12px var(--font-mono); fill: var(--muted); }
.diagram .pterm-strong { fill: var(--ink); font-weight: 600; }
.diagram .pterm-sticky { fill: var(--join); }
.diagram .pkey { font: 400 12px var(--font-body); fill: var(--muted); }
.diagram .pmove { stroke-width: 1.2; }
.diagram .pmove-add { fill: color-mix(in srgb, var(--join) 14%, var(--panel)); stroke: var(--join); }
.diagram .pmove-del { fill: color-mix(in srgb, var(--leave) 12%, var(--panel)); stroke: var(--leave); }
.diagram .pmove-promote, .diagram .pmove-demote { fill: var(--panel-2); stroke: var(--muted); }
.diagram .pmove-label { font: 500 12px var(--font-mono); fill: var(--ink); }
.diagram .ptotal { font: 600 16px var(--font-display); fill: var(--accent); }
.diagram .tedge { stroke: var(--muted); }
.diagram .tnode { fill: var(--panel-2); stroke: var(--line); }
.diagram .tnode-from { fill: var(--primary); stroke: var(--primary); }
.diagram .tnode-in { fill: color-mix(in srgb, var(--join) 18%, var(--panel)); stroke: var(--join); }
.diagram .tnode-out { opacity: 0.45; }
.diagram .tnode-label { font: 500 13px var(--font-body); fill: var(--ink); }
.diagram .tnode-from + .tnode-label { fill: var(--on-primary); }

/* the score strip */
.diagram .swon { fill: color-mix(in srgb, var(--accent) 8%, transparent); stroke: var(--accent); stroke-width: 1.5; }
.diagram .pscore-line { stroke: var(--ink); stroke-width: 2; }
.diagram .pwon { font: 600 12px var(--font-body); fill: var(--accent); }
.diagram .staken { fill: var(--bg); opacity: 0.65; }

/* arrows from the board to the strip: where each term comes from */
.diagram .sarc { fill: none; stroke-linecap: round; }
.diagram .sarc-head { stroke: var(--bg); stroke-width: 1.2; stroke-linejoin: round; }
.diagram .sarc-halo { fill: none; stroke: var(--bg); stroke-linecap: round; }
.diagram .sarc-count.sarc-primary { stroke: var(--primary); }
.diagram .sarc-head.sarc-count.sarc-primary { fill: var(--primary); }
.diagram .sarc-count.sarc-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-count.sarc-replica { fill: var(--replica); }
.diagram .sarc-spread { stroke: var(--sec-groups); }
.diagram .sarc-head.sarc-spread { fill: var(--sec-groups); }
.diagram .sarc-fill { stroke: var(--muted); stroke-opacity: 0.8; }
.diagram .sarc-head.sarc-fill { fill: var(--muted); }
.diagram .sarc-sticky { stroke: var(--join); }
.diagram .sarc-head.sarc-sticky { fill: var(--join); }
.diagram .sarc-pick { stroke: var(--accent); }
.diagram .sarc-head.sarc-pick { fill: var(--accent); }

/* the attention box: what to look at, this step */
.diagram .sfocus { fill: color-mix(in srgb, var(--focus) 5%, transparent); stroke: var(--focus); stroke-opacity: 0.6; stroke-width: 3; pointer-events: none; }

/* the moves: each node's copies built and deleted, and on the board */
.diagram .mbar-add { fill: color-mix(in srgb, var(--join) 70%, var(--panel)); }
.diagram .mbar-del { fill: color-mix(in srgb, var(--leave) 70%, var(--panel)); }
.diagram .mmark-built { fill: none; stroke: var(--join); stroke-width: 2.5; }
.diagram .lghost-label { font: 600 13px var(--font-mono); fill: var(--leave); fill-opacity: 0.85; }
.diagram .mmark-deleted { fill: color-mix(in srgb, var(--leave) 8%, transparent); stroke: var(--leave); stroke-width: 1.5; stroke-dasharray: 4 3; }

/* the pick's verdict on the board */
.diagram .vghost { fill: none; stroke-width: 1.5; stroke-dasharray: 4 3; }
.diagram .vghost-label { font: 600 13px var(--font-mono); stroke: none; fill-opacity: 0.7; }
.diagram .vghost-label.vghost-primary { fill: var(--primary); stroke: none; }
.diagram .vghost-label.vghost-replica { fill: var(--replica); stroke: none; }
.diagram .vghost-primary { stroke: var(--primary); }
.diagram .vghost-replica { stroke: var(--replica); }
.diagram .varrow { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 3; }
.diagram .varrow-head { fill: var(--accent); }
.diagram .vlabel { font: 700 14px var(--font-display); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.diagram .vlabel-moved { fill: var(--accent); }
.diagram .vlabel-stays { fill: var(--join); }

/* what the outlined row is about */
.diagram .bband-label { font: 600 12.5px var(--font-display); fill: var(--accent); }

/* the pick, in the color of the state being placed: primary or replica */
.diagram .swon.pick-primary { fill: color-mix(in srgb, var(--primary) 10%, transparent); stroke: var(--primary); }
.diagram .swon.pick-replica { fill: color-mix(in srgb, var(--replica) 12%, transparent); stroke: var(--replica); }
.diagram .bchosen.pick-primary { stroke: var(--primary); }
.diagram .bchosen.pick-replica { stroke: var(--replica); }
.diagram .sarc-pick.pick-primary { stroke: var(--primary); }
.diagram .sarc-head.sarc-pick.pick-primary { fill: var(--primary); }
.diagram .sarc-pick.pick-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-pick.pick-replica { fill: var(--replica); }
.diagram .pscore-won.pick-primary, .diagram .pwon.pick-primary { fill: var(--primary); }
.diagram .pscore-won.pick-replica, .diagram .pwon.pick-replica { fill: var(--replica); }

/* stickiness, in the color of the state being placed */
.diagram .psticky.pick-primary, .diagram .sarc-sticky.pick-primary { stroke: var(--primary); }
.diagram .psticky.pick-replica, .diagram .sarc-sticky.pick-replica { stroke: var(--replica); }
.diagram .sarc-head.sarc-sticky.pick-primary, .diagram .pterm-sticky.pick-primary { fill: var(--primary); }
.diagram .sarc-head.sarc-sticky.pick-replica, .diagram .pterm-sticky.pick-replica { fill: var(--replica); }

/* "reassigned!", and its arrow, in the color of the state that moved */
.diagram .vlabel-moved.pick-primary, .diagram .varrow-head.pick-primary { fill: var(--primary); }
.diagram .vlabel-moved.pick-replica, .diagram .varrow-head.pick-replica { fill: var(--replica); }
.diagram .varrow.pick-primary { stroke: var(--primary); }
.diagram .varrow.pick-replica { stroke: var(--replica); }

/* between the board and the area under it */
.diagram .bsep { stroke: var(--line); stroke-width: 1; }

/* an arrow for a term with nothing to count (it adds 0), from the tallies */
.diagram .sarc-zero { stroke-opacity: 0.7; }

<script type="application/json" id="bx-data">{"narrative":{"sources":["blance","cbgt"],"title":"Inside blance: server groups","subtitle":"Telling blance that nodes sit in racks or zones, as a tree and a rule for replicas, so a partition's copies don't all share one.","audience":"Engineers who build or run distributed systems","chapters":[{"id":"groups","title":"Server groups","color":"groups","steps":[{"id":"without","view":{"at":"nogroups.end","target":"row.0","focus":"board"},"expect":["fact:nogroups.sameGroup=4"],"html":"\u003cp>In \u003ca href=\"01-planning.html\">the first explainer\u003c/a>, blance computed\nwhere each partition&#39;s primary and replicas go. But nodes\noften sit in server groups: racks, or availability zones.\nHere nodes a and b are in group g1, and nodes c and d are in\ngroup g2. Computed from scratch without telling blance about\nthe groups, \u003cspan class=\"hl\">partition 0\u003c/span> gets its primary on node a and its\nreplica on node b, both in group g1, and so do 4 of the 8\npartitions: lose group g1, and partitions 0 and 1 are gone.\u003c/p>\n"},{"id":"tree","view":{"panel":"tree","target":"tree","focus":"strip"},"code":["blance.HierarchyRule"],"html":"\u003cp>The app tells blance about the groups as \u003cspan class=\"hl\">a tree\u003c/span>: each\nnode&#39;s parent (nodes a and b have parent g1, nodes c and d\nhave parent g2, and the groups have parent dc, the\ndatacenter), and a rule for where replicas go, as levels up\nthat tree.\u003c/p>\n"},{"id":"rule","code":["cbgt.groupsRule","blance.includeExclude"],"html":"\u003cp>The rule here is cbgt&#39;s default when there are groups:\ninclude level 2, exclude level 1. From the primary&#39;s node, go\nup 2 levels, to dc, for the candidates: nodes a, b, c and d.\nThen take away everything up 1 level, the primary node&#39;s own\ngroup: from node a, that&#39;s group g1&#39;s nodes a and b. What&#39;s\nleft, nodes c and d, is the other group.\u003c/p>\n"}]},{"id":"decision","title":"One replica, by the rule","color":"replica","steps":[{"id":"row","view":{"at":"groups.9~row","target":"deciding","focus":"board"},"expect":["fact:groups.9.partition=0","fact:groups.9.state=replica"],"html":"\u003cp>Let&#39;s compute the partition map again from scratch, with the\ngroups and the rule. The primaries go as before, and then\ncomes \u003cspan class=\"hl\">partition 0\u003c/span>&#39;s replica. Partition 0&#39;s primary is on\nnode a, in group g1, so the rule&#39;s candidates are nodes c and\nd.\u003c/p>\n"},{"id":"scores","view":{"panel":"score","target":"scores","focus":"strip"},"html":"\u003cp>The planner scores each node just as before, one at a time,\nterm by term: the rule doesn&#39;t change \u003cspan class=\"hl\">the scores\u003c/span>, only\nwhich nodes can win.\u003c/p>\n"},{"id":"scored","view":{"at":"groups.9~d.fill","target":"bar.b","focus":"strip"},"expect":["fact:groups.9.b=0.0003","fact:groups.9.c=0.0003","fact:groups.9.d=0.0003"],"html":"\u003cp>Nodes b, c and d all score 0.0003. Without the rule, node\n\u003cspan class=\"hl\">b\u003c/span>, first in the list, would win, as node b did in the\npartition map without groups. But node b is in node a&#39;s own\ngroup.\u003c/p>\n"},{"id":"pick","view":{"at":"groups.9","target":"winner","focus":"strip"},"code":["blance.hierarchyPicks"],"expect":["fact:groups.9.winner=c"],"html":"\u003cp>The rule&#39;s candidates go first, best score first, so the\nlowest scoring of nodes c and d wins, however well node b\nscores: node \u003cspan class=\"hl\">c\u003c/span>, the first of the two in the list.\u003c/p>\n"},{"id":"rest","view":{"at":"groups.end","target":"row.0","focus":"board"},"expect":["fact:groups.sameGroup=0"],"html":"\u003cp>The rest of the replicas go the same way. In the partition\nmap with the rule, \u003cspan class=\"hl\">partition 0\u003c/span>&#39;s replica is on node c, and\nevery replica is in the other group from the replica&#39;s\nprimary: lose either group, and every partition still has a\ncopy.\u003c/p>\n"}]}],"id":"blance/03-groups","subtitleHtml":"\u003cp>Telling blance that nodes sit in racks or zones, as a tree and a rule for replicas, so a partition&#39;s copies don&#39;t all share one.\u003c/p>\n"},"snippets":{"blance.HierarchyRule":{"id":"blance.HierarchyRule","repo":"blance","path":"api.go","title":"blance HierarchyRule — up how many levels to include, and to exclude","start":96,"end":105,"highlight":[99,104],"url":"https://github.com/couchbase/blance/blob/a63f0a3c43ed2794d965d6b869220010ed4b72b7/api.go#L96-L105","lines":["\u003cspan class=\"hljs-keyword\">type\u003c/span> HierarchyRule \u003cspan class=\"hljs-keyword\">struct\u003c/span> {","\t\u003cspan class=\"hljs-comment\">// IncludeLevel defines how many parents or ancestors to traverse\u003c/span>","\t\u003cspan class=\"hljs-comment\">// upwards in a containment hierarchy to find candidate nodes.\u003c/span>","\tIncludeLevel \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-string\">`json:&quot;includeLevel&quot;`\u003c/span>","","\t\u003cspan class=\"hljs-comment\">// ExcludeLevel defines how many parents or ancestors to traverse\u003c/span>","\t\u003cspan class=\"hljs-comment\">// upwards in a containment hierarchy to find an exclusion set of\u003c/span>","\t\u003cspan class=\"hljs-comment\">// nodes.\u003c/span>","\tExcludeLevel \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-string\">`json:&quot;excludeLevel&quot;`\u003c/span>","}"]},"cbgt.groupsRule":{"id":"cbgt.groupsRule","repo":"cbgt","path":"manager_planner.go","title":"cbgt — by default, a replica in another server group","start":912,"end":915,"highlight":[914,915],"url":"https://github.com/couchbase/cbgt/blob/d0afea68bde6f1a1dca67847499a588777076db7/manager_planner.go#L912-L915","lines":["\t\tindexDef.PlanParams.HierarchyRules = blance.HierarchyRules{","\t\t\t\u003cspan class=\"hljs-string\">&quot;replica&quot;\u003c/span>: []*blance.HierarchyRule{{","\t\t\t\tIncludeLevel: \u003c
