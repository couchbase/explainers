<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside blance: how a rebalance moves partitions</title>
<meta name="description" content="From one partition map to the next, while the partitions stay in use: each partition's moves, a mover per node, and a controller that keeps every node busy, one round at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: story on the left, one large diagram in the middle
   that the story zooms around and opens up section by section, and
   charts on the right with leader lines into the diagram. Each section
   has its own color, used for its frame, lid, story headings and the
   "where am I" breadcrumb.

   These are the engine's neutral tokens and its default fonts. A
   topic's look (its palette, section colors, fonts) is in
   topics/<topic>/style.css, after these; an explainer's own styles,
   in topics/<topic>/<name>/style.css, come last. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5a6977;
  --line: #d3dae0;
  --faint: #e7ecf0;
  --accent: #c2410c;
  --flow: #7b8a97;

  --sec-neutral: #5a6977;

  --code-bg: #f6f8fa;
  --code-hl: #fff4d6;
  --code-kw: #a3266b;
  --code-str: #1d6a3a;
  --code-com: #6b7785;
  --code-fn: #1d5fb0;
  --code-num: #9a5b00;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
    --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
    --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
  --accent: #fb7a3c; --flow: #7f8f9c; --sec-neutral: #93a2ae;
  --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); }
a { color: var(--accent); }
code, kbd { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.sec-neutral { --sec: var(--sec-neutral); }
.next-card { margin: 0 0 40vh; }
.next-link { font: 600 1.15rem var(--font-display); color: var(--accent); text-decoration: none; }
.next-link:hover { text-decoration: underline; }
.next-link + .up-link { margin-top: 1rem; }
.up-link { display: block; font: 500 0.95rem var(--font-body); color: var(--muted); text-decoration: none; }
.up-link:hover { color: var(--accent); text-decoration: underline; }

/* ---------- layout ----------
   Wide screens: the diagram fills the window behind a transparent story
   column whose text sits on opaque cards; the camera frames its region
   to the right of the story. The charts column opens on the right when
   --chrome (0..1, set from the scroll position) says so. */

.layout {
  --chrome: 0;
  --gutter: max(16px, 2vw);
  --story-w: min(27rem, 38vw);
  --charts-w: calc(var(--chrome) * 18rem);
  position: relative;
}
.story {
  position: relative;
  z-index: 2;
  width: var(--story-w);
  margin-left: var(--gutter);
  padding-block: 4.5rem 45vh;
  pointer-events: none; /* let drags reach the diagram between cards */
}
.story .card { pointer-events: auto; }
.stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.toolbar {
  position: absolute;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: calc(var(--gutter) + var(--story-w) + 1.5rem);
  right: calc(var(--charts-w) + 1rem);
}
.viewport {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.charts {
  /* transparent, like the story column: each chart is its own card */
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--charts-w);
  z-index: 1;
  padding: 4rem calc(var(--chrome) * 1rem) 1rem 0;
  pointer-events: none;
}
.charts .chart { pointer-events: auto; }
.diagram { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viewport.dragging .diagram { cursor: grabbing; }
.zoom { position: absolute; right: calc(var(--charts-w) + 0.6rem); bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.zbtn {
  width: 2rem; height: 2rem;
  font: 500 1rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer;
}
.zbtn:hover { border-color: var(--accent); }
.zoom-hint { font: 400 0.6875rem/1 var(--font-mono); color: var(--muted); }
@media (max-width: 1100px) { .zoom-hint { display: none; } }
.charts { display: flex; flex-direction: column; gap: 1.6rem; overflow: hidden; }
.chart { min-width: 15rem; padding: 0.7rem 0.85rem 0.8rem; }
.overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; overflow: visible; }

/* ---------- story ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--faint);
  border-radius: 10px;
  box-shadow: 0 4px 18px rgba(20, 30, 40, 0.08);
  padding: 1.1rem 1.35rem;
}
.hero { margin-bottom: 4rem; padding-block: 1.6rem; }
.eyebrow { font: 600 0.75rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
a.eyebrow { text-decoration: none; }
a.eyebrow:hover { text-decoration: underline; }
.hero h1 { font: 600 2.4rem/1.08 var(--font-display); margin: 0.5rem 0 1rem; text-wrap: balance; }
.hero .subtitle { color: var(--muted); font-size: 1.15rem; line-height: 1.45; }
.hero .subtitle p { margin: 0; }
.hero .meta { margin-top: 1.25rem; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.hero .meta a { color: inherit; }
.scroll-hint { margin-top: 2.5rem; font: 500 0.875rem var(--font-body); color: var(--muted); }

.chapter-title {
  font: 600 1.5rem/1.15 var(--font-display);
  margin: 5rem 0 0;
  color: var(--ink);
  text-wrap: balance;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  width: fit-content;
  max-width: 100%;
  padding-block: 0.7rem;
}
.chapter-dot { flex: none; width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--sec); }
.step {
  min-height: 70vh;
  padding-block: 2rem;
  max-width: 62ch;
}
.step.step-long { min-height: 170vh; }
.step .card { opacity: 0.55; transition: opacity 0.4s ease; }
.step.active .card { opacity: 1; }
.step p { margin: 0 0 0.9em; }
.step ul, .step ol { padding-left: 1.3em; margin: 0 0 0.9em; }
.step li { margin-bottom: 0.3em; }
.step strong { font-weight: 600; }
.hl { font-weight: 600; }
.step.active .hl { color: var(--accent); }

.code-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.code-chip {
  font: 400 0.75rem/1.3 var(--font-mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
}
.code-chip:hover { border-color: var(--accent); color: var(--accent); }
.code-chip .repo { color: var(--muted); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; font: 400 0.75rem/1 var(--font-mono); color: var(--muted); }
.toolbar .spacer { flex: 1; }
.tools { display: grid; justify-items: end; align-items: center; }
.tools > * { grid-area: 1 / 1; }
.controls { display: inline-flex; align-items: center; gap: 0.5rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 9ch; }
.crumb { display: inline-flex; align-items: center; gap: 0.45rem; font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em; color: var(--ink); }
.crumb-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--sec); }
.btn {
  font: 500 0.75rem/1 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- overlay lines ---------- */

.callout { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.callout-end { fill: var(--accent); }
.leader { fill: none; stroke: var(--muted); stroke-opacity: 0.45; stroke-width: 1; }
.leader-end { fill: var(--muted); fill-opacity: 0.7; }

/* ---------- diagram ----------
   Shared basics; each explainer's own diagram styles are in
   topics/<topic>/<name>/style.css, appended after these. */

.diagram text { font-family: var(--font-mono); }
.arrowhead { fill: var(--flow); }
.target-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.5; }
/* ---------- contents ---------- */

.toc {
  position: fixed;
  z-index: 12;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: var(--gutter, 16px);
}
.toc-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.5rem 0.75rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.toc-btn:hover, .toc-btn[aria-expanded="true"] { border-color: var(--muted); }
.toc-icon { font-size: 0.95rem; color: var(--muted); }
.toc-panel {
  position: absolute; top: calc(100% + 0.4rem); left: 0;
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100vh - 5rem); overflow-y: auto;
  padding: 0.5rem;
  display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.toc-head { font: 600 0.6875rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.5rem 0.6rem 0.6rem; }
.toc-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  padding: 0.5rem 0.6rem; border-radius: var(--radius);
  font: 500 0.9375rem/1.25 var(--font-display); color: var(--ink); text-decoration: none;
}
.toc-item .chapter-dot { width: 0.6rem; height: 0.6rem; }
.toc-item:hover, .toc-item:focus-visible { background: var(--faint); outline: none; }
.toc-item.current { background: color-mix(in srgb, var(--sec) 12%, var(--panel)); font-weight: 600; }

/* ---------- drawers ---------- */

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(52rem, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
  z-index: 20;
  display: flex; flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 600 1rem/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; }
.drawer .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.drawer .tabs .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.drawer .body { flex: 1; overflow: auto; min-height: 0; }
.drawer .where { padding: 0.5rem 1rem; font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
.code { font: 400 0.78rem/1.55 var(--font-mono); background: var(--code-bg); margin: 0; padding: 0.5rem 0; overflow-x: auto; tab-size: 4; }
.code .ln { display: flex; white-space: pre; padding-right: 1rem; }
.code .ln.hl { background: var(--code-hl); font-weight: 400; }
.code .n { flex: none; width: 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--muted); user-select: none; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-number, .hljs-literal { color: var(--code-num); }

/* ---------- narrower screens ---------- */

@media (max-width: 1250px) {
  .layout { --charts-w: 0px; --story-w: min(24rem, 40vw); }
  .charts { display: none; }
}
/* Phones: the diagram is a sticky panel on top; the story scrolls below. */
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; padding-inline: 16px; --story-w: 100%; --gutter: 0px; }
  .stage { position: sticky; inset: auto; top: 0; order: -1; height: 56vh; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; padding-block: 0.5rem; }
  .toolbar { position: static; flex-wrap: wrap; padding-left: 7.5rem; min-height: 2.1rem; }
  .toc { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); left: 16px; }
  .viewport { position: relative; inset: auto; flex: 1; min-height: 0; }
  .tools, .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; }
  .story { width: auto; margin-left: 0; padding-block: 1rem 60vh; pointer-events: auto; }
  .step { min-height: 50vh; scroll-margin-top: 58vh; }
  .hero h1 { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The blance topic's look, shared by its explainers: warm paper and
   ink, teal primaries and amber replicas, and its own fonts (named in
   topic.yaml). After the engine's styles, before each explainer's. */
:root {
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg: #f5f0e6;
  --panel: #fffcf5;
  --panel-2: #f8f3e8;
  --ink: #1f1c17;
  --muted: #6b6253;
  --line: #ddd2bd;
  --faint: #ece4d3;
  --accent: #b3264f;
  --flow: #8a8172;

  --primary: #0e6b6b;
  --on-primary: #ffffff;
  --replica: #a86a00;
  --replica-bg: #fdf1d8;
  --join: #2f7d32;
  --leave: #c0392b;

  --sec-map: #5a5146;
  --sec-primary: #0e6b6b;
  --sec-replica: #a86a00;
  --sec-change: #b3264f;
  --sec-groups: #5b4fa8;
  --sec-neutral: #6b6253;

  --code-bg: #f8f3e8;
  --code-hl: #fbe9c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
    --accent: #f06b93; --flow: #8f8676;
    --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61;
    --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
    --code-bg: #191612; --code-hl: #3a3018;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b16; --panel-2: #191612; --ink: #ede6d8; --muted: #a89f8e; --line: #3a342a; --faint: #26221b;
  --accent: #f06b93; --flow: #8f8676;
  --primary: #3bb3ad; --on-primary: #0d1716; --replica: #e6ad45; --replica-bg: #2c2414; --join: #6cc070; --leave: #ef6f61;
  --sec-map: #b5ab98; --sec-primary: #3bb3ad; --sec-replica: #e6ad45; --sec-change: #f06b93; --sec-groups: #a99cf0; --sec-neutral: #a89f8e;
  --code-bg: #191612; --code-hl: #3a3018;
}

/* its chapters' colors */
.sec-map { --sec: var(--sec-map); }
.sec-primary { --sec: var(--sec-primary); }
.sec-replica { --sec: var(--sec-replica); }
.sec-change { --sec: var(--sec-change); }
.sec-groups { --sec: var(--sec-groups); }

/* The 02-moving explainer's diagram. Appended to the engine's styles
   and the blance topic's (../style.css), which has its palette. */

.diagram .btitle { font: 600 22px var(--font-display); fill: var(--ink); }
.diagram .bsub { font: 400 16px var(--font-body); fill: var(--muted); }
.diagram .brow { fill: var(--faint); opacity: 0.6; }
.diagram .brow-label { font: 500 14px var(--font-body); fill: var(--muted); }
.diagram .bnoprimary { fill: color-mix(in srgb, var(--leave) 12%, transparent); stroke: var(--leave); stroke-dasharray: 5 4; }
.diagram .bcol-line { stroke: var(--line); }
.diagram .bnode { font: 600 16px var(--font-display); fill: var(--ink); }
.diagram .btag { font: 500 12px var(--font-body); }
.diagram .btag-joining { fill: var(--join); }
.diagram .chip { stroke-width: 1.5; }
.diagram .chip-primary { fill: var(--primary); stroke: var(--primary); }
.diagram .chip-replica { fill: var(--replica-bg); stroke: var(--replica); }
.diagram .chip-ghost { fill: none; stroke-width: 1.5; stroke-dasharray: 3 3; }
.diagram .chip-ghost-primary { stroke: var(--primary); }
.diagram .chip-ghost-replica { stroke: var(--replica); }
.diagram .chip-label { font: 600 13px var(--font-mono); }
.diagram .chip-label-primary { fill: var(--ink); }
.diagram .chip-label-replica { fill: var(--replica); }
.diagram .mover { fill: var(--panel); stroke: var(--line); }
.diagram .mover-fill { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
.diagram .mover-label { font: 500 12px var(--font-mono); fill: var(--ink); }

.diagram .panel { fill: var(--panel); stroke: var(--line); }
.diagram .ptitle { font: 600 18px var(--font-display); fill: var(--ink); }
.diagram .prow-node { font: 600 14px var(--font-display); fill: var(--ink); }
.diagram .prow-out { fill: var(--muted); font-weight: 400; }
.diagram .pterm { font: 400 12px var(--font-mono); fill: var(--muted); }
.diagram .ptotal { font: 600 16px var(--font-display); fill: var(--accent); }
.diagram .pgrid { stroke: var(--line); stroke-dasharray: 3 4; }
.diagram .paxis { stroke: var(--muted); }
.diagram .paxis-label { font: 11px var(--font-mono); fill: var(--muted); }
.diagram .pmove { stroke-width: 1.2; fill: var(--panel); }
.diagram .pmove-add { stroke: var(--join); }
.diagram .pmove-del { stroke: var(--leave); }
.diagram .pmove-promote, .diagram .pmove-demote { stroke: var(--muted); }
.diagram .pmove-done { stroke-width: 2; }
.diagram .pmove-flying { stroke-width: 2; stroke-dasharray: 4 3; }
.diagram .pmove-prog { pointer-events: none; }
.diagram .pmove-prog-add { fill: color-mix(in srgb, var(--join) 22%, transparent); }
.diagram .pmove-prog-del { fill: color-mix(in srgb, var(--leave) 20%, transparent); }
.diagram .pmove-label { font: 500 12px var(--font-mono); fill: var(--ink); }
.diagram .tround { fill: var(--accent); }
.diagram .tbar { stroke-width: 1.2; }
.diagram .tbar-add { fill: color-mix(in srgb, var(--join) 30%, var(--panel)); stroke: var(--join); }
.diagram .tbar-del { fill: color-mix(in srgb, var(--leave) 25%, var(--panel)); stroke: var(--leave); }

<script type="application/json" id="bx-data">{"narrative":{"sources":["blance","cbgt"],"title":"Inside blance: how a rebalance moves partitions","subtitle":"From one partition map to the next, while the partitions stay in use: each partition's moves, a mover per node, and a controller that keeps every node busy, one round at a time.","audience":"Engineers who build or run partitioned systems","chapters":[{"id":"plans","title":"From maps to moves","color":"change","steps":[{"id":"intro","view":{"target":"node.d"},"html":"\u003cp>In \u003ca href=\"01-planning.html\">the first explainer\u003c/a>, blance planned\nthe next partition map for \u003cspan class=\"hl\">node d\u003c/span> joining a cluster of\nthree. The plan is only where to end up. Getting there means\nbuilding copies of partitions on their new nodes, and\nremoving old ones, while the partitions stay in use.\u003c/p>\n"},{"id":"moves","view":{"panel":"plans","target":"plan.0"},"code":["blance.CalcPartitionMoves"],"expect":["fact:one.plan.0=add d:primary, del a"],"html":"\u003cp>First, each partition&#39;s own moves, from its nodes before to\nits nodes after (blance&#39;s \u003ccode>CalcPartitionMoves\u003c/code>). For\n\u003cspan class=\"hl\">partition 0\u003c/span>: add d as its primary, then delete it from a.\nThe copy comes first, so the partition is never short of one.\u003c/p>\n"},{"id":"count","view":{"target":"plan.3"},"expect":["fact:one.moves=10","fact:one.moved=5"],"html":"\u003cp>10 moves over 5 partitions, two each; \u003cspan class=\"hl\">partition 3\u003c/span>, and\nthe others that stay put, have none. Each partition&#39;s moves\nhave to happen in order, but different partitions&#39; moves can\nhappen at once.\u003c/p>\n"}]},{"id":"movers","title":"A mover per node","color":"primary","steps":[{"id":"movers","view":{"panel":"timeline","target":"controller"},"code":["blance.analogy","blance.mover"],"html":"\u003cp>blance&#39;s \u003ccode>OrchestrateMoves\u003c/code> runs them. Each node gets a mover\nthat does one batch of moves at a time, by calling the app\nback to do the real work; and one \u003cspan class=\"hl\">controller\u003c/span> decides what\neach mover does next. The code&#39;s own analogy: each partition&#39;s\nmoves are a flight plan, each node an airport with one runway,\nand the controller decides which plane takes off next where.\u003c/p>\n"},{"id":"round1","view":{"target":"lane.d"},"code":["blance.weights"],"expect":["fact:one.round@0=b:5, d:0"],"html":"\u003cp>The first round: each partition&#39;s next move is its first, and\nthey&#39;re on b and d. \u003cspan class=\"hl\">d\u003c/span> has four to choose from, all copies;\nit takes the lowest weight (promote first, then demote, add,\nand delete last), and among equals, here, the first by name:\npartition 0. b has just one, partition 5&#39;s copy.\u003c/p>\n"},{"id":"first-done","view":{"at":"one@270","target":"lane.a"},"code":["blance.supply"],"expect":["fact:one@270.starts.a=del 0","fact:one@270.starts.d=add 1","fact:one.round@270=a:0, b:5 waits, d:1"],"html":"\u003cp>At 270 ms, d has finished partition 0&#39;s copy. A round ends as\nsoon as any mover finishes, and the next starts: partition 0&#39;s\nnext move is now \u003cspan class=\"hl\">on a\u003c/span>, deleting its old copy, and d starts\non partition 1. b is still building partition 5&#39;s copy: its\nbest move is the one in flight, so it waits.\u003c/p>\n"},{"id":"bottleneck","view":{"at":"one@1323","target":"lane.d"},"expect":["fact:one.end=1323","fact:one.busy.d=1269"],"html":"\u003cp>And so on: every round, each node&#39;s next move. But \u003cspan class=\"hl\">d\u003c/span> has\nfour copies to build, one after another, and every other move\nis quick: the whole rebalance takes 1323 ms, d busy for 1269\nof them.\u003c/p>\n"},{"id":"races","view":{"panel":"plans","target":"plan.0"},"code":["blance.supplyMove"],"html":"\u003cp>All done: \u003cspan class=\"hl\">every move\u003c/span> made. Two things this simplifies.\nblance breaks ties between equal moves by Go map order, in\neffect at random, where here the first by name wins. And in\nthe real code, when two moves finish at the same moment,\nwhich one the controller hears of first is a race, and real\nruns differ. (These runs are timed so that none do; on them,\nthis simulation and the real orchestrator agree, move for\nmove.)\u003c/p>\n"}]},{"id":"more","title":"More at once","color":"replica","steps":[{"id":"four","view":{"at":"four@0","target":"mover.d"},"code":["blance.batch"],"expect":["fact:four@0.starts.d=add 0,add 1,add 2,add 4","fact:four.round@0=b:5, d:0+1+2+4"],"html":"\u003cp>A mover can take several moves at once: up to\n\u003ccode>MaxConcurrentPartitionMovesPerNode\u003c/code>, best first, as one\nbatch. (cbft, for one, sets 1 unless told otherwise.) At 4,\n\u003cspan class=\"hl\">d&#39;s mover\u003c/span> takes all four copies in one batch.\u003c/p>\n"},{"id":"four-timeline","view":{"panel":"timeline","target":"lane.d"},"html":"\u003cp>On the timeline, \u003cspan class=\"hl\">d\u003c/span> has one batch in flight, of four\ncopies, and b its one.\u003c/p>\n"},{"id":"four-waits","view":{"at":"four@378","target":"lane.b"},"expect":["fact:four.round@378=a:0, b:5+1+2 waits, c:4"],"html":"\u003cp>At 378 ms d&#39;s batch is done, and partitions 1 and 2 can be\ndeleted from b. But \u003cspan class=\"hl\">b\u003c/span>&#39;s best moves still include partition\n5&#39;s copy, in flight, so b waits for it before starting the\ndeletes.\u003c/p>\n"},{"id":"four-done","view":{"at":"four@468","target":"now"},"code":["cbgt.assign"],"expect":["fact:four.end=468"],"html":"\u003cp>Done at \u003cspan class=\"hl\">468 ms\u003c/span>, not 1323. Here a batch takes as long as\nits slowest move (cbgt, for one, waits for all of a batch&#39;s\npartitions); on a real node, four copies at once share its\ndisk, CPU and network, so the win is smaller than this.\u003c/p>\n"}]},{"id":"fewer","title":"Fewer copies, or more","color":"groups","steps":[{"id":"min-plans","view":{"at":"min@0","target":"plan.0"},"expect":["fact:min.plan.0=del a, add d:primary"],"html":"\u003cp>With \u003ccode>FavorMinNodes\u003c/code>, each partition&#39;s moves go the other way\nround: deletes first, so a partition is on as few nodes as\npossible at any time. For \u003cspan class=\"hl\">partition 0\u003c/span>: delete it from a,\nthen add d as its primary.\u003c/p>\n"},{"id":"min-timeline","view":{"panel":"timeline","target":"lane.a"},"expect":["fact:min.round@0=a:0, b:1, c:4"],"html":"\u003cp>The first round now starts the deletes: on \u003cspan class=\"hl\">a\u003c/span>, b and c.\u003c/p>\n"},{"id":"min-gap","view":{"at":"min@288","target":"row.1"},"expect":["fact:min.noPrimary.0=18-288","fact:min.noPrimary.1=27-585"],"html":"\u003cp>But partition 0&#39;s only primary was on a. From 18 ms, when\nit&#39;s deleted, until 288 ms, when d&#39;s copy is built, partition\n0 has no primary; and \u003cspan class=\"hl\">partition 1\u003c/span> has none from 27 ms\nuntil 585. The code says as much: it favours &quot;max of single\nprimary, if even there are temporarily no primaries for a\ntime&quot;.\u003c/p>\n"},{"id":"min-done","view":{"at":"min@1287","target":"now"},"expect":["fact:min.end=1287","fact:one.end=1323"],"html":"\u003cp>Done at \u003cspan class=\"hl\">1287 ms\u003c/span>, about as long as copies first. The trade\nisn&#39;t time but copies: never more than needed, against never\nfewer than before. Most apps that serve reads, cbft among\nthem, keep copies first.\u003c/p>\n"},{"id":"pause","code":["blance.pause"],"html":"\u003cp>The app can also pause a rebalance: no new moves start, the\nones in flight finish. Then resume it, or stop it. A stopped\nrebalance leaves a map partway between the two, and the next\nplan starts from there.\u003c/p>\n"}]}],"id":"blance/02-moving","subtitleHtml":"\u003cp>From one partition map to the next, while the partitions stay in use: each partition&#39;s moves, a mover per node, and a controller that keeps every node busy, one round at a time.\u003c/p>\n"},"snippets":{"blance.CalcPartitionMoves":{"id":"blance.CalcPartitionMoves","repo":"blance","path":"moves.go","title":"blance CalcPartitionMoves() — one partition's moves, old map to new","start":41,"end":119,"highlight":[66,82,88],"url":"https://github.com/couchbase/blance/blob/a63f0a3c43ed2794d965d6b869220010ed4b72b7/moves.go#L41-L119","lines":["\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-keyword\">func\u003c/span> \u003cspan class=\"hljs-title\">CalcPartitionMoves\u003c/span>\u003cspan class=\"hljs-params\">(\u003c/span>\u003c/span>","\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-params\">\tstates []\u003cspan class=\"hljs-type\">string\u003c/span>,\u003c/span>\u003c/span>","\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-params\">\tbegNodesByState \u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>][]\u003cspan class=\"hljs-type\">string\u003c/span>,\u003c/span>\u003c/span>","\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-params\">\tendNodesByState \u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>][]\u003cspan class=\"hljs-type\">string\u003c/span>,\u003c/span>\u003c/span>","\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-params\">\tfavorMinNodes \u003cspan class=\"hljs-type\">bool\u003c/span>,\u003c/span>\u003c/span>","\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-params\">)\u003c/span>\u003c/span> []NodeStateOp {","\t\u003cspan class=\"hljs-keyword\">var\u003c/span> moves []NodeStateOp","","\tseen := \u003cspan class=\"hljs-keyword\">map\u003c/span>[\u003cspan class=\"hljs-type\">string\u003c/span>]\u003cspan class=\"hljs-type\">bool\u003c/span>{}","","\taddMoves := \u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-keyword\">func\u003c/span>\u003cspan class=\"hljs-params\">(nodes []\u003cspan class=\"hljs-type\">string\u003c/span>,
