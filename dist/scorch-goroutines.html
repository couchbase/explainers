<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside bleve / scorch: introducer, persister, merger</title>
<meta name="description" content="How a Couchbase FTS index turns a stream of DCP mutations into searchable, durable segments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout concept: story on the left, one large diagram in the middle
   that the story zooms around and opens up section by section, and
   charts on the right with leader lines into the diagram. Each section
   has its own color, used for its frame, lid, story headings and the
   "where am I" breadcrumb. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --panel-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5a6977;
  --line: #d3dae0;
  --faint: #e7ecf0;
  --accent: #c2410c;
  --scan: #ffd98a; /* the copier scan's light */
  --flow: #7b8a97;
  --up: #6e5bd0;

  --busy: #1f8f58;
  --nap: #6e5bd0;
  --wait: #8b97a3;
  --stall: #d0342c;

  --sec-kv: #2b7c84;
  --sec-cbft: #a07408;
  --sec-bleve: #5b4fa8;
  --sec-scorch: #9c3f7c;
  --sec-disk: #7a5a3a;
  --sec-neutral: #5a6977;

  --seg-mem: #e8862a;
  --seg-file: #2d6cc9;
  --seg-garbage: #a9b4be;
  --seg-zombie: #d23a4e;

  --code-bg: #f6f8fa;
  --code-hl: #fff4d6;
  --code-kw: #a3266b;
  --code-str: #1d6a3a;
  --code-com: #6b7785;
  --code-fn: #1d5fb0;
  --code-num: #9a5b00;

  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
    --accent: #fb7a3c; --flow: #7f8f9c; --up: #9a8cf0; --scan: #fff1c4;
    --busy: #3cc283; --nap: #9a8cf0; --wait: #6f7d89; --stall: #ff6450;
    --sec-kv: #5fb8bf; --sec-cbft: #d9a63a; --sec-bleve: #a99cf0; --sec-scorch: #d97bb8; --sec-disk: #c19a72; --sec-neutral: #93a2ae;
    --seg-mem: #f59e4a; --seg-file: #5b93e8; --seg-garbage: #4f5d69; --seg-zombie: #ff5d72;
    --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #151c22; --panel-2: #11171c; --ink: #e2e8ed; --muted: #93a2ae; --line: #2c3740; --faint: #1f272e;
  --accent: #fb7a3c; --flow: #7f8f9c; --up: #9a8cf0; --scan: #fff1c4;
  --busy: #3cc283; --nap: #9a8cf0; --wait: #6f7d89; --stall: #ff6450;
  --sec-kv: #5fb8bf; --sec-cbft: #d9a63a; --sec-bleve: #a99cf0; --sec-scorch: #d97bb8; --sec-disk: #c19a72; --sec-neutral: #93a2ae;
  --seg-mem: #f59e4a; --seg-file: #5b93e8; --seg-garbage: #4f5d69; --seg-zombie: #ff5d72;
  --code-bg: #11171c; --code-hl: #3a3218; --code-kw: #f07ab8; --code-str: #7fd29a; --code-com: #7c8a96; --code-fn: #8cb8ff; --code-num: #f0b35a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); }
a { color: var(--accent); }
code, kbd { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.sec-kv { --sec: var(--sec-kv); }
.sec-cbft { --sec: var(--sec-cbft); }
.sec-bleve { --sec: var(--sec-bleve); }
.sec-scorch { --sec: var(--sec-scorch); }
.sec-disk { --sec: var(--sec-disk); }
.sec-neutral { --sec: var(--sec-neutral); }

/* ---------- layout ----------
   Wide screens: the diagram fills the window behind a transparent story
   column whose text sits on opaque cards; the camera frames its region
   to the right of the story. The charts column opens on the right when
   --chrome (0..1, set from the scroll position) says so. */

.layout {
  --chrome: 0;
  --gutter: max(16px, 2vw);
  --story-w: min(27rem, 38vw);
  --charts-w: calc(var(--chrome) * 18rem);
  position: relative;
}
.story {
  position: relative;
  z-index: 2;
  width: var(--story-w);
  margin-left: var(--gutter);
  padding-block: 4.5rem 45vh;
  pointer-events: none; /* let drags reach the diagram between cards */
}
.story .card { pointer-events: auto; }
.stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}
.toolbar {
  position: absolute;
  z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: calc(var(--gutter) + var(--story-w) + 1.5rem);
  right: calc(var(--charts-w) + 1rem);
}
.viewport {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.charts {
  /* transparent, like the story column: each chart is its own card */
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--charts-w);
  z-index: 1;
  padding: 4rem calc(var(--chrome) * 1rem) 1rem 0;
  pointer-events: none;
}
.charts .chart { pointer-events: auto; }
.diagram { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viewport.dragging .diagram { cursor: grabbing; }
.zoom { position: absolute; right: calc(var(--charts-w) + 0.6rem); bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.zbtn {
  width: 2rem; height: 2rem;
  font: 500 1rem/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer;
}
.zbtn:hover { border-color: var(--accent); }
.zoom-hint { font: 400 0.6875rem/1 var(--font-mono); color: var(--muted); }
@media (max-width: 1100px) { .zoom-hint { display: none; } }
.charts { display: flex; flex-direction: column; gap: 1.6rem; overflow: hidden; }
.chart { min-width: 15rem; padding: 0.7rem 0.85rem 0.8rem; }
.overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; overflow: visible; }

/* ---------- story ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--faint);
  border-radius: 10px;
  box-shadow: 0 4px 18px rgba(20, 30, 40, 0.08);
  padding: 1.1rem 1.35rem;
}
.hero { margin-bottom: 4rem; padding-block: 1.6rem; }
.eyebrow { font: 600 0.75rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.hero h1 { font: 600 2.4rem/1.08 var(--font-display); margin: 0.5rem 0 1rem; text-wrap: balance; }
.hero .subtitle { color: var(--muted); font-size: 1.15rem; line-height: 1.45; }
.hero .subtitle p { margin: 0; }
.hero .meta { margin-top: 1.25rem; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.hero .meta a { color: inherit; }
.scroll-hint { margin-top: 2.5rem; font: 500 0.875rem var(--font-body); color: var(--muted); }

.chapter-title {
  font: 600 1.5rem/1.15 var(--font-display);
  margin: 5rem 0 0;
  color: var(--ink);
  text-wrap: balance;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  width: fit-content;
  max-width: 100%;
  padding-block: 0.7rem;
}
.chapter-dot { flex: none; width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--sec); }
.step {
  min-height: 70vh;
  padding-block: 2rem;
  max-width: 62ch;
}
.step.step-long { min-height: 170vh; }
.step .card { opacity: 0.55; transition: opacity 0.4s ease; }
.step.active .card { opacity: 1; }
.step p { margin: 0 0 0.9em; }
.step ul, .step ol { padding-left: 1.3em; margin: 0 0 0.9em; }
.step li { margin-bottom: 0.3em; }
.step strong { font-weight: 600; }
.hl { font-weight: 600; }
.step.active .hl { color: var(--accent); }

.code-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.code-chip {
  font: 400 0.75rem/1.3 var(--font-mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
}
.code-chip:hover { border-color: var(--accent); color: var(--accent); }
.code-chip .repo { color: var(--muted); }

/* inline legend swatches in the prose */
.st { font-weight: 500; white-space: nowrap; }
.st::before { content: ""; display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%; margin-right: 0.3em; vertical-align: -0.02em; }
.st-busy::before { background: var(--busy); }
.st-sleep::before { background: var(--nap); }
.st-wait::before { background: transparent; border: 2px solid var(--wait); }
.st-stall::before { background: var(--stall); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; min-width: 0; font: 400 0.75rem/1 var(--font-mono); color: var(--muted); }
.toolbar .spacer { flex: 1; }
.tools { display: grid; justify-items: end; align-items: center; }
.tools > * { grid-area: 1 / 1; }
.controls { display: inline-flex; align-items: center; gap: 0.5rem; }
.clock { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 9ch; }
.crumb { display: inline-flex; align-items: center; gap: 0.45rem; font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em; color: var(--ink); }
.crumb-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--sec); }
.btn {
  font: 500 0.75rem/1 var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.4rem 0.65rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- charts ---------- */

.chart { font: 400 0.75rem/1.3 var(--font-mono); color: var(--muted); }
.chart.dim { opacity: 0.3; }
.chart.emph { color: var(--ink); }
.chart-head { display: flex; justify-content: space-between; gap: 0.5rem; }
.chart-head b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plot svg { display: block; width: 100%; height: 3.2rem; overflow: visible; margin-top: 0.3rem; }
.plot .area { fill: color-mix(in srgb, var(--seg-file) 14%, transparent); }
.plot .line { fill: none; stroke: var(--seg-file); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.chart.emph .line { stroke: var(--accent); }
.chart.emph .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.plot .ref { stroke: var(--stall); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.plot .grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* ---------- overlay lines ---------- */

.callout { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.callout-end { fill: var(--accent); }
.leader { fill: none; stroke: var(--muted); stroke-opacity: 0.45; stroke-width: 1; }
.leader-end { fill: var(--muted); fill-opacity: 0.7; }

/* ---------- diagram ---------- */

.diagram text { font-family: var(--font-mono); }
.frame { fill: color-mix(in srgb, var(--sec) 3%, var(--bg)); stroke: var(--sec); stroke-width: 1.6; }
.tab { fill: var(--sec); }
.diagram .tab-text { font: 600 11.5px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--panel); }
.flow { stroke: var(--flow); stroke-width: 1.4; fill: none; }
.flow-up { stroke: var(--up); stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
.flow-read { stroke: var(--flow); stroke-width: 1.2; fill: none; stroke-dasharray: 1.5 3; stroke-linecap: round; }
.arrowhead { fill: var(--flow); }
.arrowhead-up { fill: var(--up); }
.note { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.note-in { font-size: 11px; fill: var(--muted); }
.code-in { font-size: 11px; fill: var(--muted); }
.zone { fill: var(--panel); stroke: var(--line); }
.zone.strong { stroke: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.diagram .zone-title { font: 600 12px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; fill: var(--muted); }

.gbox { fill: var(--panel); stroke: var(--wait); stroke-width: 1.2; stroke-dasharray: 4 3; }
.gbox.s-busy { stroke: var(--busy); stroke-dasharray: none; }
.gbox.s-nap { stroke: var(--nap); stroke-dasharray: none; }
.gbox.s-stall { stroke: var(--stall); stroke-dasharray: none; stroke-width: 2; }
.gbox-header { fill: none; }
.gbox.behind { stroke-dasharray: none; stroke: var(--line); }
.gbox.behind.s-busy { stroke: color-mix(in srgb, var(--busy) 45%, var(--line)); }
.gbox.behind.s-stall { stroke: color-mix(in srgb, var(--stall) 60%, var(--line)); }
.gdot { fill: none; stroke: var(--wait); stroke-width: 1.5; }
.gdot.s-busy, .gdot.dot-busy { fill: var(--busy); stroke: none; }
.gdot.s-nap, .gdot.dot-nap { fill: var(--nap); stroke: none; }
.gdot.s-stall, .gdot.dot-stall { fill: var(--stall); stroke: none; }
.gtitle { font-size: 13px; font-weight: 600; fill: var(--ink); }
.glabel { font-size: 11px; fill: var(--muted); }
.glabel.small { font-size: 10px; }
.glabel.s-stall { fill: var(--stall); }
.gsince { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.badge { fill: var(--ink); }
.badge-text { font-size: 10.5px; font-weight: 600; fill: var(--panel); }

.gauge { fill: var(--faint); stroke: var(--line); }
.gauge-fill { fill: var(--seg-file); }
.gauge-fill.mem { fill: var(--seg-mem); }
.gauge-fill.warn { fill: var(--stall); }
.gauge-mark { stroke: var(--ink); stroke-width: 1.5; }
.gate { stroke: var(--stall); stroke-width: 1.6; stroke-dasharray: 10 3 2 3; }
.slot { fill: var(--panel); stroke: var(--line); }
.slot.full { fill: var(--accent); stroke: var(--accent); }
.cpu { fill: var(--panel); stroke: var(--line); }
.cpu.busy { fill: var(--busy); stroke: var(--busy); }
.chan { fill: var(--bg); stroke: var(--line); }
.chan.lit { fill: color-mix(in srgb, var(--busy) 18%, var(--panel)); stroke: var(--busy); }
.chan-text { font-size: 9px; fill: var(--ink); }

.cell { fill: none; stroke: none; }
.cell.mem { fill: var(--seg-mem); stroke: none; }
.fbar { fill: var(--seg-file); }
.fbar.merging { stroke: var(--ink); stroke-width: 1.5; }
.fbar.ours { stroke: var(--accent); stroke-width: 2; }
.fdel { fill: var(--panel); fill-opacity: 0.6; }
.target-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-opacity: 0.5; }
.query { fill: var(--panel); stroke: var(--busy); }
.search-ring, .search-handle { fill: none; stroke: var(--busy); stroke-width: 1.6; }

/* File icons are <use>s of one symbol: their look comes in through
   custom properties, which (unlike descendant selectors) reach inside. */
.ficon-body { fill: var(--fi-fill, var(--seg-file)); stroke: var(--fi-stroke, var(--seg-file)); stroke-width: var(--fi-sw, 1); stroke-dasharray: var(--fi-dash, none); }
.ficon-fold { fill: none; stroke: var(--fi-fold, var(--panel)); stroke-width: 1; }
.ficon-garbage { --fi-fill: var(--seg-garbage); --fi-stroke: var(--seg-garbage); }
.ficon-new { --fi-fill: var(--panel); --fi-dash: 2 1.5; --fi-fold: var(--seg-file); }
.ficon-zombie { --fi-fill: var(--panel); --fi-stroke: var(--seg-zombie); --fi-sw: 1.4; --fi-fold: var(--seg-zombie); }
.ficon-ours { --fi-stroke: var(--accent); --fi-sw: 2; }
.del-ring { fill: var(--panel); fill-opacity: 0.5; stroke: var(--stall); stroke-width: 1.8; }
.del-slash { stroke: var(--stall); stroke-width: 1.8; }
.bolt { fill: var(--panel); stroke: var(--line); }
.bolt.latest { stroke: var(--seg-file); }
.bolt.protected { stroke: var(--muted); stroke-width: 2.5; }
.diagram .root-draft > rect.zone { stroke-dasharray: 6 4; }
.diagram .epoch-num.lit { fill: var(--accent); }
.diagram .copy-label { font-style: italic; }
/* the copier scan's light: a warm bulb, fading at its edges */
.diagram .scan-core { stop-color: var(--scan); stop-opacity: 0.85; }
.diagram .scan-edge { stop-color: var(--scan); stop-opacity: 0; }
.bolt.ours { stroke: var(--accent); stroke-width: 2; }

.panel-frame { fill: var(--panel); stroke: color-mix(in srgb, var(--sec-scorch) 55%, var(--line)); stroke-width: 1.3; }
.row { fill: var(--bg); stroke: var(--line); }
.row.lit { fill: color-mix(in srgb, var(--busy) 14%, var(--panel)); stroke: var(--busy); }
.row.lit.stall { fill: color-mix(in srgb, var(--stall) 12%, var(--panel)); stroke: var(--stall); }
.row-text { font-size: 11.5px; fill: var(--ink); }
.pw { fill: var(--panel); stroke: var(--wait); stroke-dasharray: 2 2; }
.pw.s-busy { fill: var(--busy); stroke: var(--busy); stroke-dasharray: none; }
.pw.s-stall { fill: var(--stall); stroke: var(--stall); stroke-dasharray: none; }
.back-fn { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.back-note { font-size: 10.5px; fill: var(--muted); }
.tok { fill: var(--panel-2); stroke: var(--line); }
.tok.gone { fill: none; stroke-dasharray: 2 2; }
.diagram .tok-text { font: 400 11px var(--font-mono); fill: var(--ink); }
.diagram .tok-text.gone { fill: var(--muted); text-decoration: line-through; }
.tier-line { stroke: var(--muted); stroke-dasharray: 3 3; stroke-opacity: 0.5; }
.stair-slot { fill: color-mix(in srgb, var(--sec-scorch) 7%, var(--panel)); stroke: var(--sec-scorch); stroke-dasharray: 3 2; }
.stair-over { fill: none; stroke: var(--stall); stroke-width: 1.8; }
.stair-pick { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); stroke-width: 1.8; }
.tier-line.stair-end { stroke: var(--stall); stroke-dasharray: none; stroke-opacity: 1; stroke-width: 1.5; }

/* lids sit inset inside their frame, so the colored border stays
   visible; the page sets their openness from the scroll position */
.lid-bg { fill: color-mix(in srgb, var(--sec) 11%, var(--panel)); }
.lid.stalled .lid-bg { fill: color-mix(in srgb, var(--stall) 10%, var(--panel)); }
.diagram .lid-title { font: 600 34px var(--font-display); fill: var(--ink); }
.diagram .lid-title-small { font: 600 18px var(--font-display); fill: var(--ink); }
.diagram .lid-sub { font: 400 17px var(--font-body); fill: var(--muted); }
.diagram .lid-sub-small { font: 400 12.5px var(--font-body); fill: var(--muted); }
.lid-status { font-size: 15px; fill: var(--ink); }
.lid-status-small { font-size: 11.5px; fill: var(--ink); }

/* detail bubbles, grown out of their panel by the page */
.bubble-box, .bubble-tail { fill: var(--panel); stroke: color-mix(in srgb, var(--sec-scorch) 70%, var(--line)); stroke-width: 1.5; }
.bubble-box { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.16)); }
.bubble-seam { stroke: var(--panel); stroke-width: 3; }
.diagram .bubble-title { font: 600 14px var(--font-display); fill: var(--ink); }

/* the marker for "our batch" */
.token-chip { fill: color-mix(in srgb, var(--accent) 22%, var(--panel)); stroke: var(--accent); stroke-width: 2.5; }
.token-chip.kind-mem { fill: var(--seg-mem); }
.token-chip.kind-file { fill: var(--seg-file); }
.token-sheet { fill: var(--panel); stroke: color-mix(in srgb, var(--ink) 35%, var(--line)); stroke-width: 1.2; }
.token-other { fill: color-mix(in srgb, var(--muted) 45%, var(--panel)); }
.token-sub { font-size: 10px; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.merged-chip { fill: var(--seg-file); stroke: var(--ink); stroke-width: 1.5; }
.merged-label { font-size: 11px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.token-label { font-size: 11px; font-weight: 600; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.doc-body { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
.doc-lines { stroke: var(--muted); stroke-width: 0.8; fill: none; }
.network { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }

/* ---------- contents ---------- */

.toc {
  position: fixed;
  z-index: 12;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  left: var(--gutter, 16px);
}
.toc-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font: 600 0.8125rem/1 var(--font-display); letter-spacing: 0.03em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.5rem 0.75rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.toc-btn:hover, .toc-btn[aria-expanded="true"] { border-color: var(--muted); }
.toc-icon { font-size: 0.95rem; color: var(--muted); }
.toc-panel {
  position: absolute; top: calc(100% + 0.4rem); left: 0;
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100vh - 5rem); overflow-y: auto;
  padding: 0.5rem;
  display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.toc-head { font: 600 0.6875rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.5rem 0.6rem 0.6rem; }
.toc-item {
  display: flex; align-items: baseline; gap: 0.6rem;
  padding: 0.5rem 0.6rem; border-radius: var(--radius);
  font: 500 0.9375rem/1.25 var(--font-display); color: var(--ink); text-decoration: none;
}
.toc-item .chapter-dot { width: 0.6rem; height: 0.6rem; }
.toc-item:hover, .toc-item:focus-visible { background: var(--faint); outline: none; }
.toc-item.current { background: color-mix(in srgb, var(--sec) 12%, var(--panel)); font-weight: 600; }

/* ---------- drawers ---------- */

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(52rem, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
  z-index: 20;
  display: flex; flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 600 1rem/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; }
.drawer .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.drawer .tabs .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.drawer .body { flex: 1; overflow: auto; min-height: 0; }
.drawer .where { padding: 0.5rem 1rem; font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
.code { font: 400 0.78rem/1.55 var(--font-mono); background: var(--code-bg); margin: 0; padding: 0.5rem 0; overflow-x: auto; tab-size: 4; }
.code .ln { display: flex; white-space: pre; padding-right: 1rem; }
.code .ln.hl { background: var(--code-hl); font-weight: 400; }
.code .n { flex: none; width: 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--muted); user-select: none; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-number, .hljs-literal { color: var(--code-num); }
.knobs .body { padding: 0.5rem 1rem 2rem; }
.knobs fieldset { border: none; padding: 0; margin: 0 0 1rem; }
.knobs legend { font: 600 0.75rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.75rem 0 0.4rem; }
.knob { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 8rem) minmax(0, 1fr); gap: 0.25rem 0.75rem; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--line); }
.knob label { font: 500 0.75rem/1.3 var(--font-mono); }
.knob input[type="number"] { width: 100%; font: 400 0.75rem/1 var(--font-mono); padding: 0.3rem; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
.knob .doc { font-size: 0.75rem; color: var(--muted); line-height: 1.35; }
.knob .doc .dflt { font-family: var(--font-mono); }
.knobs .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0 0.25rem; }

/* ---------- narrower screens ---------- */

@media (max-width: 1250px) {
  .layout { --charts-w: 0px; --story-w: min(24rem, 40vw); }
  .charts { display: none; }
}
/* Phones: the diagram is a sticky panel on top; the story scrolls below. */
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; padding-inline: 16px; --story-w: 100%; --gutter: 0px; }
  .stage { position: sticky; inset: auto; top: 0; order: -1; height: 56vh; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; padding-block: 0.5rem; }
  .toolbar { position: static; flex-wrap: wrap; padding-left: 7.5rem; min-height: 2.1rem; }
  .toc { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); left: 16px; }
  .viewport { position: relative; inset: auto; flex: 1; min-height: 0; }
  .tools, .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; }
  .story { width: auto; margin-left: 0; padding-block: 1rem 60vh; pointer-events: auto; }
  .step { min-height: 50vh; scroll-margin-top: 58vh; }
  .hero h1 { font-size: 1.8rem; }
  .knob { grid-template-columns: minmax(0, 1fr) minmax(0, 7rem); }
  .knob .doc { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<noscript>This explainer needs JavaScript to run its simulation.</noscript>
<div id="app"></div>
<script type="application/json" id="bx-data">{"narrative":{"id":"scorch-goroutines","title":"Inside bleve / scorch: introducer, persister, merger","subtitle":"How a Couchbase FTS index turns a stream of DCP mutations into searchable, durable segments.","audience":"Couchbase engineers and support","sim":{"seed":7,"config":{}},"chapters":[{"id":"picture","title":"The big picture","color":"neutral","steps":[{"id":"layers","sim":{"reset":true,"minTimeMs":6010,"speed":0},"view":{"camera":"overview","target":"cbftLid"},"expect":["kvFlowing","herderIdle"],"html":"\u003cp>Consider a single FTS index partition (a \u003cem>pindex\u003c/em>) on a single node.\nIn this diagram, data flows from top to bottom. The big box in the middle is\n\u003cspan class=\"hl\">the cbft process\u003c/span>, the search service of Couchbase Server.\u003c/p>\n\u003cp>The diagram is a \u003cstrong>simulation\u003c/strong>. We&#39;ll follow\ngoroutines and the control flow of cbft and bleve\ncode.\u003c/p>\n"},{"id":"kv","view":{"target":"kvLid"},"html":"\u003cp>Mutations start in \u003cspan class=\"hl\">KV\u003c/span>, a separate process, that is the &quot;key-value&quot;\nserver of Couchbase Server. These mutations are transmitted to\ncbft over the network, as a DCP stream.\u003c/p>\n"},{"id":"disk","view":{"target":"diskLid"},"html":"\u003cp>They end up as segment files in the index&#39;s directory, on\n\u003cspan class=\"hl\">disk\u003c/span>.\u003c/p>\n"}]},{"id":"cbft","title":"KV and cbft","color":"cbft","steps":[{"id":"zoom","view":{"camera":"top","target":"kvLid"},"html":"\u003cp>Let&#39;s drill down into the hop between \u003cspan class=\"hl\">KV\u003c/span> and cbft.\u003c/p>\n"},{"id":"kv-open","view":{"open":["kv"],"target":"buffer"},"code":["cbgt.dcpBuffer"],"html":"\u003cp>KV sends DCP \u003cem>snapshots\u003c/em>: runs of mutations for one vbucket.\nThese wait in a 20MB \u003cspan class=\"hl\">flow-control buffer\u003c/span> until cbft acks\nthem. When that buffer fills, KV pauses sending until cbft drains it.\u003c/p>\n"},{"id":"cbft-open","view":{"open":["cbft"],"target":"dcp"},"code":["cbft.dataUpdate","bleve.BatchIndex","cbft.updateSeq"],"html":"\u003cp>gocbcore calls cbft&#39;s \u003ccode>DataUpdate()\u003c/code> for every received mutation,\nsynchronously, on \u003cspan class=\"hl\">the DCP goroutine\u003c/span>. It maps the document\n(\u003ccode>batch.Index()\u003c/code>) into that vbucket&#39;s \u003ccode>bleve.Batch\u003c/code>.\u003c/p>\n\u003cp>A batch is handed off at the end of the DCP snapshot, or at\n200 mutations (\u003ccode>BleveMaxOpsPerBatch\u003c/code>), whichever comes first.\u003c/p>\n"},{"id":"workers","view":{"target":"workers"},"code":["cbft.submitAsync","cbft.runBatchWorker","cbft.batchDefaults"],"html":"\u003cp>Batches go to one of \u003cspan class=\"hl\">4 batch workers\u003c/span>, shown stacked here with\nbatch worker 0 in front. Each worker has a channel of capacity 1.\nIt merges what arrives into one bigger batch, and executes it\nat 200 ops or when its 100ms ticker fires.\u003c/p>\n\u003cp>Every box is a goroutine, colored by its state:\n\u003cspan class=\"st st-busy\">busy\u003c/span>,\n\u003cspan class=\"st st-sleep\">napping\u003c/span>,\n\u003cspan class=\"st st-wait\">waiting for work\u003c/span>, or\n\u003cspan class=\"st st-stall\">stalled by backpressure\u003c/span>.\u003c/p>\n"},{"id":"follow","sim":{"follow":"alone","until":"dcp"},"view":{"target":"ourBatch"},"expect":["reached:dcp"],"html":"\u003cp>Now let&#39;s \u003cstrong>follow one batch\u003c/strong>, depicted as a small chip\nwith the orange outline, which will travel through the diagram as\nyou scroll.\u003c/p>\n\u003cp>Our batch is being built right now by \u003cspan class=\"hl\">the DCP goroutine\u003c/span>.\u003c/p>\n\u003cp>To keep the story simple, we let the batches already in\nflight finish, then had KV send just the mutations for our\nbatch and pause. So our batch travels alone, and nothing\nelse changes the index while we follow it. In a real system\nbatches keep coming, many at once; we&#39;ll turn them back on\nlater.\u003c/p>\n"},{"id":"to-channel","sim":{"until":"channel"},"view":{"target":"ourBatch"},"expect":["reached:channel"],"code":["cbft.submitAsync"],"html":"\u003cp>The batch is complete. The DCP goroutine puts it into\n\u003cspan class=\"hl\">a worker&#39;s channel\u003c/span>, a slot that holds just one batch.\nWhich worker is fixed by the vbucket number, so each\nvbucket&#39;s batches stay in order.\u003c/p>\n"},{"id":"to-worker","sim":{"until":"worker"},"view":{"target":"ourBatch"},"expect":["reached:worker"],"html":"\u003cp>\u003cspan class=\"hl\">Its batch worker\u003c/span>, worker 0,\ntakes the batch from the channel and holds it, merging in any\nmore that arrive, until it reaches 200 ops or the ticker\nfires. If the slot had still been full, the DCP goroutine\nwould have had to wait.\u003c/p>\n"},{"id":"to-herder","sim":{"until":"herder"},"view":{"target":"gate"},"expect":["reached:herder"],"code":["herder.onScorchEvent","herder.checkAndBlockBatch","herder.overQuota"],"html":"\u003cp>The worker calls \u003ccode>bindex.Batch()\u003c/code>, which goes into bleve. The\nfirst thing scorch&#39;s \u003ccode>Batch()\u003c/code> does is fire an event that\ncbft hooks: still on the worker goroutine, \u003cspan class=\"hl\">the app herder\u003c/span>\nchecks process memory against the indexing quota (65% of the\nFTS memory quota), and would hold the batch right here if it\nwere over. Right now we&#39;re well under it, so our batch may\ncontinue.\u003c/p>\n"},{"id":"into-bleve","sim":{"until":"analysis"},"view":{"target":"ourBatch"},"expect":["reached:analysis"],"code":["cbft.execute"],"html":"\u003cp>Through the gate, \u003cspan class=\"hl\">our batch\u003c/span> goes on into the bleve\nlibrary, still on cbft&#39;s worker goroutine: bleve runs in the\nsame process.\u003c/p>\n"}]},{"id":"scorch","title":"Into bleve and scorch","color":"scorch","steps":[{"id":"step-back","view":{"camera":"process","target":"bleveLid"},"html":"\u003cp>Step back for a moment. Our batch is now being processed by\n\u003cspan class=\"hl\">the bleve library\u003c/span>. bleve is\nlinked into the cbft process, and we&#39;re still on the same batch worker\ngoroutine from cbft.\u003c/p>\n"},{"id":"bleve-open","view":{"open":["bleve"],"target":"bleveNote"},"code":["cbft.execute"],"html":"\u003cp>bleve&#39;s top layer is \u003cspan class=\"hl\">what applications program against\u003c/span>:\nbleve&#39;s index API, document mapping (which already ran, back in\nthe DCP goroutine&#39;s \u003ccode>batch.Index()\u003c/code>), and text analysis.\nUnderneath sits a pluggable index implementation. cbft uses the\n\u003cem>scorch\u003c/em> implementation.\u003c/p>\n"},{"id":"scorch-open","view":{"open":["scorch"],"target":"introducer"},"html":"\u003cp>Inside scorch we see: \u003ccode>Scorch.Batch()\u003c/code>, the root snapshot\nin the middle, and three goroutines in their own boxes:\n\u003cspan class=\"hl\">the introducer\u003c/span>, the persister and the merger.\u003c/p>\n"},{"id":"zoom-top","view":{"camera":"scorchTop","target":"batch"},"code":["scorch.Batch"],"html":"\u003cp>The worker&#39;s \u003ccode>bindex.Batch()\u003c/code> goes through bleve&#39;s\n\u003ccode>index.Batch()\u003c/code> to \u003cspan class=\"hl\">Scorch.Batch()\u003c/span>, scorch&#39;s entry point.\nall running on cbft&#39;s worker goroutine, and it doesn&#39;t\nreturn until the batch has been fully &#39;introduced&#39;.\u003c/p>\n"},{"id":"analysis","view":{"target":"analysis"},"code":["scorch.batchAnalysis","scorch.analyze"],"html":"\u003cp>First comes analysis. For that, scorch calls across to a\nutility that bleve provides to its index implementations:\n\u003cspan class=\"hl\">bleve&#39;s analysis queue\u003c/span>. \u003ccode>Batch()\u003c/code>\nstarts a goroutine that queues one closure per document,\nthen waits until every result has come back.\u003c/p>\n"},{"id":"queue","view":{"target":"analysis"},"code":["bleve.analysisQueue","cbft.analysisQueueSize"],"html":"\u003cp>The analysis queue is a pool of worker goroutines that bleve initializes\nonce per process, controlled via \u003ccode>bleve.Config\u003c/code>, where cbft sizes this to the\nnumber of CPUs. Its channel is unbuffered, so \u003ccode>Queue()\u003c/code>\nblocks until an analysis queue worker is free.\u003c/p>\n\u003cp>Every FTS index in the cbft node shares \u003cspan class=\"hl\">this one pool\u003c/span> of analysis queue workers.\u003c/p>\n"},{"id":"make-room","view":{"camera":"analysisDetail","target":"analysis"},"html":"\u003cp>What does \u003cspan class=\"hl\">an analyzer\u003c/span> actually do? Let&#39;s make room beside\nit.\u003c/p>\n"},{"id":"analyzer","view":{"bubble":["analysis"],"target":"analysisDetail"},"code":["scorch.analyze"],"html":"\u003cp>Following the index definition, for each indexed field, there&#39;s\nan index mapping analyzer which runs\n\u003cspan class=\"hl\">an analysis pipeline\u003c/span>: a tokenizer splits the text into tokens, then\ntoken filters lowercase them, drop stop words and stem them.\nWhat&#39;s left are terms with their positions, ready to become a\nsegment&#39;s dictionary and postings.\u003c/p>\n\u003cp>It&#39;s all CPU work, and usually the biggest share of the CPU\nthat indexing uses.\u003c/p>\n"},{"id":"analyzer-close","view":{"unbubble":["analysis"],"target":"analysis"},"html":"\u003cp>Because the pool is shared and sized to the CPUs, a burst of\ningest anywhere on the node can make \u003cspan class=\"hl\">the queue\u003c/span> the\nbottleneck. Batches wait their turn, their batch workers stay\nblocked in \u003ccode>Batch()\u003c/code>, the DCP goroutine can&#39;t hand off its\nnext batch, and the pressure backs up toward KV.\u003c/p>\n"},{"id":"back","view":{"camera":"scorchTop","target":"batch","flow":"analysis"},"html":"\u003cp>Back in scorch, \u003cspan class=\"hl\">Scorch.Batch()\u003c/span> is waiting for our batch&#39;s\nanalysis results.\u003c/p>\n"},{"id":"built","sim":{"until":"built"},"view":{"target":"ourBatch"},"expect":["reached:built"],"code":["scorch.Batch"],"html":"\u003cp>Analysis is done, and \u003ccode>Scorch.Batch()\u003c/code> has built\n\u003cspan class=\"hl\">our segment\u003c/span> from the results (\u003ccode>NewUsing()\u003c/code>): an\nin-memory zap segment holding our batch&#39;s docs. From here\non, it&#39;s our segment we follow.\u003c/p>\n"},{"id":"handoff","sim":{"until":"introducing"},"view":{"target":"ourBatch"},"expect":["reached:introducing"],"code":["scorch.prepareSegment"],"html":"\u003cp>\u003ccode>Batch()\u003c/code> wraps \u003cspan class=\"hl\">our segment\u003c/span> in an introduction and sends\nit to the introducer over the \u003ccode>introductions\u003c/code> channel. Then\nit waits until the introducer has applied it.\u003c/p>\n"},{"id":"follow","view":{"camera":"swap","target":"introducer"},"html":"\u003cp>Let&#39;s follow our segment into \u003cspan class=\"hl\">the introducer\u003c/span>.\u003c/p>\n"},{"id":"introduced","sim":{"until":"introduced"},"view":{"swap":"copy","target":"root"},"expect":["reached:introduced","ourSegInMemory"],"code":["introducer.introduceSegment"],"html":"\u003cp>The introducer is the only goroutine that may change the\nindex&#39;s \u003cem>root\u003c/em>: an immutable snapshot listing the segments\nand their deleted docs. It never edits the root in place.\nIt starts \u003cspan class=\"hl\">a new root\u003c/span> from a copy of the current one&#39;s\nsegment list.\u003c/p>\n"},{"id":"appended","view":{"swap":"add","target":"ourSeg"},"code":["introducer.introduceSegment"],"html":"\u003cp>It appends \u003cspan class=\"hl\">our segment\u003c/span> to that list.\u003c/p>\n"},{"id":"next-epoch","view":{"swap":"epoch","target":"rootEpoch"},"code":["introducer.introduceSegment"],"html":"\u003cp>It gives the new root \u003cspan class=\"hl\">the next epoch\u003c/span>.\u003c/p>\n"},{"id":"swapped-in","view":{"swap":"settle","target":"root"},"expect":["onlyRootLive"],"html":"\u003cp>Then it swaps \u003cspan class=\"hl\">the new root\u003c/span> in, and lets go of its ref on\nthe old one. Once \u003ccode>Batch()\u003c/code> drops the ref it took earlier\n(to check our docs against the old root), nothing holds the\nold root, and it&#39;s freed.\u003c/p>\n"},{"id":"our-segment","view":{"camera":"root","target":"ourSeg"},"expect":["ourSegInMemory"],"code":["cbft.kvConfig","cbft.execute"],"html":"\u003cp>Our docs are now \u003cspan class=\"hl\">this in-memory segment\u003c/span>, in orange.\nQueries that start from now on can see them.\u003c/p>\n\u003cp>cbft runs scorch with \u003ccode>unsafe_batch: true\u003c/code>, so \u003ccode>Batch()\u003c/code>\nreturns right here, before anything is on disk. That&#39;s also\nwhen \u003ccode>at_plus\u003c/code> consistency waiters are released.\n\u003cstrong>&quot;Consistent&quot; in FTS means searchable, not durable.\u003c/strong>\u003c/p>\n"}]},{"id":"introducer","title":"Inside the introducer","color":"scorch","steps":[{"id":"zoom","view":{"camera":"introducer","target":"introducer"},"html":"\u003cp>A closer look at \u003cspan class=\"hl\">the introducer\u003c/span>.\u003c/p>\n"},{"id":"open","view":{"open":["introducer"],"target":"select"},"code":["introducer.loop","introducer.introducePersist"],"html":"\u003cp>It&#39;s \u003cspan class=\"hl\">a select loop\u003c/span> over four channels: batches being\nintroduced (\u003ccode>introductions\u003c/code>), files the persister wrote\ndirectly (\u003ccode>persists\u003c/code>), merge results (\u003ccode>merges\u003c/code>, from the\nmerger and, as we&#39;ll see, from the persister too), and\n&quot;wake me after epoch N&quot; requests (\u003ccode>introducerNotifier\u003c/code>,\nshown as \u003ccode>watchers\u003c/code>). Each batch, persist or merge produces a\nnew root and bumps the epoch; a wake-me request just waits in\na list.\u003c/p>\n\u003cp>Go&#39;s \u003ccode>select\u003c/code> picks randomly among ready channels, so\nbatches, persists and merges take turns fairly.\u003c/p>\n"}]},{"id":"persister","title":"The persister","color":"scorch","steps":[{"id":"zoom","view":{"camera":"persister","target":"persister"},"html":"\u003cp>Our segment is searchable, but only in memory. Making it\ndurable is the job of \u003cspan class=\"hl\">the persister\u003c/span>.\u003c/p>\n"},{"id":"open","view":{"open":["persister"],"target":"persisterInside"},"code":["persister.pause","cbft.napDefaults","persister.defaults"],"html":"\u003cp>The persister works in \u003cspan class=\"hl\">four phases\u003c/span>. First it naps for up\nto 2 seconds (cbft&#39;s setting; bleve&#39;s default is 0), letting\nin-memory segments pile up, unless the herder is holding\nbatches back. Then it merges them into ~20MB\nfiles with up to 4 workers, and commits.\u003c/p>\n"},{"id":"cut","sim":{"until":"flushables"},"view":{"target":"persisterInside"},"expect":["reached:flushables"],"code":["persister.maybeMerge"],"html":"\u003cp>The persister woke up and took a ref on the root snapshot.\nNothing was handed to it: it found our segment in that root.\nIt \u003cspan class=\"hl\">cut the root&#39;s in-memory segments\u003c/span> into \u003cem>flushables\u003c/em>:\nruns of neighbors of about 20MB each. Up to 4 workers take\nthem, one flushable each at a time. Ours is in one of them.\u003c/p>\n"},{"id":"persisting","sim":{"until":"persisting"},"view":{"target":"ourBatch"},"expect":["reached:persisting"],"code":["persister.maybeMerge","merger.memMerge"],"html":"\u003cp>\u003cspan class=\"hl\">A persister worker\u003c/span> is merging our flushable, our segment\nand its neighbors, into one new zap file, which it then\nwrites and fsyncs. Our segment stays in the root meanwhile,\nstill searchable.\u003c/p>\n"},{"id":"make-room","view":{"camera":"persisterDetail","target":"persister"},"html":"\u003cp>Let&#39;s look more closely at \u003cspan class=\"hl\">the persister\u003c/span>. We&#39;ll make some\nroom to its left.\u003c/p>\n"},{"id":"detail","view":{"bubble":["persister"],"target":"persisterDetail"},"code":["persister.loop","persister.persistSnapshot","persister.direct"],"html":"\u003cp>Here&#39;s \u003cspan class=\"hl\">the same cycle\u003c/span>, in terms of the code in\n\u003ccode>persisterLoop()\u003c/code>. It only ever persists the \u003cem>latest\u003c/em> root, so\nthe epochs in between are skipped, which acts as a group\ncommit. The new files are swapped into the root first, and\nonly then committed to \u003ccode>root.bolt\u003c/code> and fsynced.\u003c/p>\n"},{"id":"detail-close","view":{"unbubble":["persister"],"target":"persisterInside"},"expect":["napBroken"],"code":["merger.loop"],"html":"\u003cp>One surprise: \u003cspan class=\"hl\">the nap\u003c/span> rarely runs its full 2 seconds.\nEvery time the merger finishes a plan, it hands the persister\nan &quot;epoch watcher&quot;, and that ends the nap\n(\u003ccode>num_persister_nap_merger_break\u003c/code>).\u003c/p>\n"},{"id":"back","view":{"camera":"persisterDisk","target":"ourBatch"},"html":"\u003cp>Back to \u003cspan class=\"hl\">our segment\u003c/span>, still being written.\u003c/p>\n"},{"id":"open-disk","view":{"open":["disk"],"target":"diskLid"},"html":"\u003cp>Let&#39;s open up \u003cspan class=\"hl\">the disk\u003c/span> below, to see where the\npersister&#39;s writes go.\u003c/p>\n"},{"id":"written","sim":{"until":"written"},"view":{"target":"ourBatch","flow":"write"},"expect":["reached:written","ourSegInMemory"],"code":["zapx.merge"],"html":"\u003cp>The worker wrote a new zap file down to disk and fsynced it.\nThen it opened that file, mmapped, as \u003cspan class=\"hl\">our file segment\u003c/span>:\nthe in-memory handle on the file that goroutines pass\naround, and that a root can list. It&#39;s not in the root yet:\nqueries still find our docs in the in-memory segment.\u003c/p>\n"},{"id":"landed","view":{"camera":"diskDir","target":"ourFile","token":"hide"},"html":"\u003cp>On disk, \u003cspan class=\"hl\">our zap file\u003c/span> is a new file in the index&#39;s\ndirectory, beside the files already there. It&#39;s drawn\ndashed because nothing lists it yet: not the root, and not\n\u003ccode>root.bolt\u003c/code>. Until a \u003ccode>root.bolt\u003c/code> record does, it wouldn&#39;t\ncount after a crash.\u003c/p>\n"},{"id":"back-up","view":{"camera":"persisterDisk","target":"ourBatch","token":"auto"},"html":"\u003cp>Back up to \u003cspan class=\"hl\">our file segment\u003c/span>, beside the persister.\u003c/p>\n"},{"id":"to-introducer","sim":{"until":"fileIntroducing"},"view":{"target":"ourBatch"},"expect":["reached:fileIntroducing"],"code":["introducer.introduceMerge"],"html":"\u003cp>So the persister hands the new file segment up to\n\u003cspan class=\"hl\">the introducer\u003c/span>, over the same \u003ccode>merges\u003c/code> channel the\nmerger uses. Only the introducer may change the root.\u003c/p>\n"},{"id":"watch","view":{"camera":"swap","target":"root"},"html":"\u003cp>Now watch \u003cspan class=\"hl\">the root snapshot\u003c/span>, epoch 354, as the\nintroducer swaps in a new one. It goes one change at a\ntime, as you scroll.\u003c/p>\n"},{"id":"file","sim":{"until":"file"},"view":{"swap":"cover","target":"root"},"expect":["reached:file","ourSegIsFile"],"code":["introducer.mergeSwap"],"html":"\u003cp>The introducer starts \u003cspan class=\"hl\">a new root snapshot\u003c/span>: empty for\nnow, drawn dashed and see-through over the old one. Nobody\nelse can see it yet. Queries, the persister and the merger\nall find the root through \u003ccode>s.root\u003c/code>, which still points at\nepoch 354.\u003c/p>\n"},{"id":"peel","view":{"swap":"peel","target":"root"},"html":"\u003cp>Let&#39;s lift \u003cspan class=\"hl\">the new root\u003c/span> off the stack, so we can watch it\nbeing built while the old one stays put underneath.\u003c/p>\n"},{"id":"copy","view":{"swap":"copy","target":"rootMem"},"code":["introducer.mergeSwap"],"html":"\u003cp>It starts from a copy of \u003cspan class=\"hl\">the old root&#39;s segment list\u003c/span>.\nOnly the list: the segments themselves are shared, and each\none that stays gets one more ref. No docs are copied.\u003c/p>\n"},{"id":"add","view":{"swap":"add","target":"ourSeg"},"html":"\u003cp>In goes \u003cspan class=\"hl\">our file segment\u003c/span>.\u003c/p>\n"},{"id":"mem-gone","view":{"swap":"drop","target":"rootMem"},"expect":["noMemSegsAtRoot"],"html":"\u003cp>Out go \u003cspan class=\"hl\">the in-memory segments\u003c/span> it replaces. All of them,\nours included, were merged into that one file: same docs,\nnow in a zap file on disk, mmapped.\u003c/p>\n"},{"id":"epoch-up","view":{"swap":"epoch","target":"rootEpoch"},"expect":["rootEpoch:355"],"html":"\u003cp>Last, just before the swap, it gets the next epoch:\n\u003cspan class=\"hl\">354 + 1 = 355\u003c/span>. The introducer hands out epochs in order,\none for every root it swaps in,\nwhether that root adds a batch&#39;s segment, a persister&#39;s file,\nor a merger&#39;s result.\u003c/p>\n"},{"id":"swapped","view":{"swap":"solid","target":"root"},"code":["introducer.mergeSwap"],"html":"\u003cp>Now the introducer \u003cspan class=\"hl\">swaps it in\u003c/span>: one pointer assignment,\n\u003ccode>s.root = newSnapshot\u003c/code>, under a lock. It&#39;s solid now. From\nhere on, queries, the persister and the merger see epoch 355.\u003c/p>\n"},{"id":"old-root","view":{"swap":"settle","target":"olderEpoch"},"expect":["persisterHoldsOlderRoot","rootEpoch:355"],"code":["snapshot.refcount"],"html":"\u003cp>The stack shifts back, with the new root in front. Behind\nit, \u003cspan class=\"hl\">epoch 354\u003c/span> is still alive: the introducer let go of\nits ref, but the persister still holds one. Root snapshots\naren&#39;t linked to each other. Each is an immutable, refcounted\nlist of segments, freed when its last ref goes. Next, the\npersister commits \u003ccode>root.bolt\u003c/code> and fsyncs it.\u003c/p>\n"},{"id":"to-bolt","view":{"camera":"persisterBolt","target":"bolt"},"html":"\u003cp>Let&#39;s watch \u003cspan class=\"hl\">root.bolt\u003c/span>, on the disk, while the persister\ncommits.\u003c/p>\n"},{"id":"committed","sim":{"until":"committed"},"view":{"commit":"bolt","target":"bolt"},"expect":["reached:committed"],"code":["persister.direct","persister.protected"],"html":"\u003cp>The persister wrote \u003cspan class=\"hl\">a new record\u003c/span> into \u003ccode>root.bolt\u003c/code> and\nfsynced it. It&#39;s filed under epoch 354, the root the\npersister started from, and it lists our new zap file.\n\u003ccode>root.bolt\u003c/code> keeps a few older records too: cbft keeps 3 in\nall, the newest plus older ones about 10 minutes apart, as\n\u003cem>rollback points\u003c/em>.\u003c/p>\n"},{"id":"listed","view":{"commit":"listed","target":"ourFile"},"html":"\u003cp>Now that a record lists it, \u003cspan class=\"hl\">our zap file\u003c/span> turns solid:\nafter a crash, scorch would reopen it from \u003ccode>root.bolt\u003c/code>.\u003c/p>\n"},{"id":"released","view":{"commit":"release","target":"persister"},"code":["snapshot.refcount"],"html":"\u003cp>Finally, \u003cspan class=\"hl\">the persister\u003c/span> lets go of its ref on epoch 354\n(and of a brief ref on 355 that came back with its merge\nresult). Nothing else held 354, so it&#39;s freed. Its next cycle\ntakes a ref on whatever the root is by then.\u003c/p>\n"},{"id":"why-354","view":{"commit":"release","target":"bolt"},"code":["persister.equiv","persister.loop"],"html":"\u003cp>Why does \u003cspan class=\"hl\">the newest record\u003c/span> say 354, when the root is\n355? The persister files its record under the epoch of the\nroot it started from, 354, with the in-memory segments\nswapped for the new file: the same docs as 355, under the\nolder number. The root has moved on, so the persister will\npersist again, but first it naps. When it wakes, it takes\nwhatever root is latest then, which may skip 355 entirely.\nWe&#39;ll see, after the merger.\u003c/p>\n"}]},{"id":"merger","title":"The merger","color":"scorch","steps":[{"id":"zoom","view":{"camera":"merger","target":"merger","token":"auto","commit":"release"},"html":"\u003cp>Lots of small files would make every query slower. So\n\u003cspan class=\"hl\">the merger\u003c/span> compacts them. Our marker is on our file\nsegment in the root.\u003c/p>\n"},{"id":"open","view":{"open":["merger"],"target":"mergerInside","commit":"release"},"code":["merger.loop","merger.planMergeAtSnapshot"],"html":"\u003cp>It works on file segments only, in \u003cspan class=\"hl\">four phases\u003c/span>: wait for\na newly persisted epoch, plan, merge its tasks one after\nanother, and introduce all the results to the introducer in\none go. The merger is paced by the persister,\nand as we&#39;ll see, the persister is paced by the merger.\u003c/p>\n"},{"id":"planning","sim":{"until":"planning"},"view":{"commit":"wake","target":"mergerInside"},"expect":["reached:planning"],"code":["merger.loop","merger.planMergeAtSnapshot"],"html":"\u003cp>The persister just persisted a newer epoch, which woke the\nmerger. After its last plan, the merger had handed the\npersister an \u003cem>epoch watcher\u003c/em> (&quot;wake me once you&#39;ve persisted\nsomething newer than epoch 316&quot;) and waited on it. Persisting\n354 closed it. Now the merger took a ref on the root, epoch\n355, with our file in it, and \u003cspan class=\"hl\">plans\u003c/span>: which files, if any,\nshould it merge?\u003c/p>\n"},{"id":"make-room","view":{"camera":"mergerDetail","target":"merger"},"html":"\u003cp>How does \u003cspan class=\"hl\">the merger\u003c/span> decide what to merge? Let&#39;s make room\nbelow it.\u003c/p>\n"},{"id":"detail","view":{"bubble":["merger"],"plan":"budget","target":"stairs"},"code":["mergeplan.plan","mergeplan.CalcBudget","cbft.persisterDefaults"],"html":"\u003cp>With \u003cspan class=\"hl\">a staircase\u003c/span>. bleve&#39;s tiered merge policy, a cousin\nof Lucene&#39;s, first sets a \u003cem>budget\u003c/em>: how many files the index\nmay have. Take an example index with 1.3GB of live data. The\nfirst tier is up to 10 files at the floor size (cbft sets\n\u003ccode>floorSegmentFileSize\u003c/code> to 20MB), each tier above is 10×\nbigger, and tiers stack until all the bytes fit. Here that&#39;s\n10 small stairs and 6 bigger ones: a budget of 16 files.\u003c/p>\n"},{"id":"files","view":{"plan":"files","target":"stairFiles"},"html":"\u003cp>Now \u003cspan class=\"hl\">the actual files\u003c/span>, biggest first (by live doc count),\nas \u003ccode>Plan()\u003c/code> sorts them: a few big ones from earlier merges, and a tail of small\nfresh ones that the persister keeps writing.\u003c/p>\n"},{"id":"over","view":{"plan":"over","target":"stairOver"},"html":"\u003cp>Twenty files on a budget of 16: there are more files than\nstairs, so \u003cspan class=\"hl\">the last four\u003c/span> are over budget, and the planner\nmust merge.\u003c/p>\n"},{"id":"pick","view":{"plan":"pick","target":"stairPick"},"code":["mergeplan.plan","mergeplan.ScoreSegments"],"html":"\u003cp>Which files? The planner slides a window along the sorted\nfiles and scores every run of up to 10. Lower is better: runs\nof similar sizes win, since merging a big file with small\nones rewrites the big one for little gain, and files with\nmany deletes get a bonus. Here \u003cspan class=\"hl\">the winner\u003c/span> is the ten\nsmallest.\u003c/p>\n"},{"id":"merged-file","view":{"plan":"merged","target":"stairMerged"},"html":"\u003cp>They become \u003cspan class=\"hl\">one 39MB file\u003c/span>, a step up the staircase, and\neleven files fit the budget. A byte is rewritten about once\nper tier it climbs, so a few times over its life, rather than\non every merge.\u003c/p>\n"},{"id":"ours","view":{"plan":"live","target":"mergerDetail"},"expect":["filesOverBudget"],"html":"\u003cp>Back to \u003cspan class=\"hl\">our own index\u003c/span>, at epoch 355. It&#39;s small, a stair\nor two, but it has three files on a budget of two, so the\nplan has one task: merge two of them, our file included.\u003c/p>\n"},{"id":"detail-close","view":{"unbubble":["merger"],"target":"mergerInside"},"html":"\u003cp>With its plan made, \u003cspan class=\"hl\">the merger\u003c/span> goes on to merge that\ntask&#39;s files into one, then hands the result to the\nintroducer.\u003c/p>\n"},{"id":"merging","sim":{"until":"merging"},"view":{"target":"ourSeg"},"expect":["reached:merging"],"code":["merger.planMergeAtSnapshot"],"html":"\u003cp>The merger is merging \u003cspan class=\"hl\">our file segment\u003c/span> with one other\ninto a new zap file. It reads them through its ref on epoch\n355; it doesn&#39;t take them out of the root. A root snapshot\nnever changes, so both stay in it, still searchable, while\nthe merger works.\u003c/p>\n"},{"id":"merge-wide","view":{"camera":"mergeDisk","target":"disk"},"html":"\u003cp>Let&#39;s widen the view to take in \u003cspan class=\"hl\">the disk\u003c/span> below.\u003c/p>\n"},{"id":"merge-written","sim":{"until":"mergeWritten"},"view":{"target":"mergedSeg","flow":"mergeWrite"},"expect":["reached:mergeWritten"],"html":"\u003cp>It wrote the merged zap file down to disk and fsynced it, and\nopened it, mmapped, as \u003cspan class=\"hl\">a merged file segment\u003c/span> holding our\ndocs (and the other file&#39;s). On disk there are now two files with our docs in them:\nour old one, and this new one. The new one isn&#39;t in the root\nyet, though.\u003c/p>\n"},{"id":"merge-up","view":{"camera":"scorch","target":"mergedSeg"},"html":"\u003cp>\u003cspan class=\"hl\">The merged file segment\u003c/span> isn&#39;t in any root yet. Let&#39;s\nfollow it.\u003c/p>\n"},{"id":"merge-to-introducer","sim":{"until":"mergeIntroducing"},"view":{"target":"mergedSeg"},"expect":["reached:mergeIntroducing"],"code":["introducer.introduceMerge"],"html":"\u003cp>Like the persister, the merger can&#39;t change the root itself.\nIt hands \u003cspan class=\"hl\">the merged file segment\u003c/span> up to the introducer,\nover the same \u003ccode>merges\u003c/code> channel.\u003c/p>\n"},{"id":"merge-watch","view":{"camera":"swap","target":"rootFiles"},"html":"\u003cp>Now watch \u003cspan class=\"hl\">the root&#39;s file segments\u003c/span> as the introducer\nbuilds a new root around the merged file.\u003c/p>\n"},{"id":"merged","sim":{"until":"merged"},"view":{"swap":"copy","target":"root"},"expect":["reached:merged"],"code":["introducer.mergeSwap"],"html":"\u003cp>As before, the introducer starts \u003cspan class=\"hl\">a new root\u003c/span> from a copy\nof epoch 355&#39;s segment list: three file segments.\u003c/p>\n"},{"id":"merge-add","view":{"swap":"add","target":"rootFiles"},"code":["introducer.introduceMerge"],"html":"\u003cp>In goes \u003cspan class=\"hl\">the merged file segment\u003c/span>. Any docs deleted while\nthe merge ran are marked deleted in it too: the introducer\nremaps those deletes into the new segment.\u003c/p>\n"},{"id":"merge-drop","view":{"swap":"drop","target":"rootFiles"},"html":"\u003cp>Out go \u003cspan class=\"hl\">the two file segments\u003c/span> it replaces, ours among\nthem. Our docs now live in the merged one, so our marker\nmoves over. The new root lists the same docs, in two file\nsegments instead of three.\u003c/p>\n"},{"id":"merge-epoch","view":{"swap":"epoch","target":"rootEpoch"},"html":"\u003cp>Then the next epoch: \u003cspan class=\"hl\">355 + 1 = 356\u003c/span>.\u003c/p>\n"},{"id":"merge-swapped","view":{"swap":"settle","target":"root"},"expect":["rootEpoch:356","onlyRootLive"],"html":"\u003cp>And the introducer swaps \u003cspan class=\"hl\">the new root\u003c/span> in. The merger,\ntold its result is in, lets go of epoch 355; nothing else\nholds it, so it&#39;s freed. Our old file is no longer in any root: it&#39;s\ngarbage on disk now.\u003c/p>\n"},{"id":"to-disk","view":{"camera":"lower","target":"disk"},"code":["persister.removeOldData"],"html":"\u003cp>Old files stay in \u003cspan class=\"hl\">the directory\u003c/span>, gray, until no\nremaining \u003ccode>root.bolt\u003c/code> record lists them. The persister\ncleans up only when it&#39;s idle, so under steady ingest,\ngarbage accumulates for a while.\u003c/p>\n"},{"id":"caught-up","sim":{"until":"caughtUp"},"view":{"target":"bolt"},"expect":["reached:caughtUp","rootEpoch:356"],"code":["persister.loop","merger.loop"],"html":"\u003cp>The merger finishing its plan also woke the persister from\nits nap. It took a ref on the latest root, 356, with the\nmerged file, and committed \u003cspan class=\"hl\">a record for it\u003c/span>. Epoch 355\nwas never written down on its own: that&#39;s the group commit\nagain. Now disk and memory agree.\u003c/p>\n"},{"id":"idle","view":{"camera":"scorch","target":"persister"},"html":"\u003cp>With 356 persisted and no new mutations coming in,\n\u003cspan class=\"hl\">the persister\u003c/span> has caught up. What does it do now?\u003c/p>\n"},{"id":"persister-waits","sim":{"until":"persisterWaits"},"view":{"target":"introWatchers","flow":"watcher"},"expect":["reached:persisterWaits"],"code":["persister.loop","introducer.loop"],"html":"\u003cp>It hands the introducer an epoch watcher of its own, over\nthe introducer&#39;s \u003ccode>introducerNotifier\u003c/code> channel (the \u003ccode>watchers\u003c/code>\nchip): &quot;wake me once the root\nis newer than epoch 356&quot;. \u003cspan class=\"hl\">The introducer\u003c/span> holds it, and\nafter every root it swaps in, closes the watchers it has now\nsatisfied. So the wake-ups chain: a new root wakes the\npersister, and a newly persisted epoch wakes the merger. The\npersister waits on its watcher, and also on its channel from\nthe merger, whichever comes first.\u003c/p>\n"},{"id":"persister-nudged","sim":{"until":"persisterNudged"},"view":{"target":"persister"},"expect":["reached:persisterNudged"],"code":["persister.loop","merger.loop"],"html":"\u003cp>The merger came first. It finished its own plan for 356\n(nothing left to merge) and handed \u003cspan class=\"hl\">the persister\u003c/span> a\nwatcher. That wakes the persister, which goes round its loop\nand naps again, for up to 2s. Its watcher stays with the\nintroducer.\u003c/p>\n"}]}],"subtitleHtml":"\u003cp>How a Couchbase FTS index turns a stream of DCP mutations into searchable, durable segments.\u003c/p>\n"},"snippets":{"cbgt.dcpBuffer":{"id":"cbgt.dcpBuffer","repo":"cbgt","path":"feed_dcp.go","title":"cbgt DCP flow-control buffer","start":20,"end":25,"highlight":[],"url":"https://github.com/couchbase/cbgt/blob/d0afea68bde6f1a1dca67847499a588777076db7/feed_dcp.go#L20-L25","lines":["\u003cspan class=\"hljs-keyword\">var\u003c/span> DCPFeedBufferSizeBytes = \u003cspan class=\"hljs-type\">uint32\u003c/span>(\u003cspan class=\"hljs-number\">20\u003c/span> * \u003cspan class=\"hljs-number\">1024\u003c/span> * \u003cspan class=\"hljs-number\">1024\u003c/span>)","","\u003cspan class=\"hljs-comment\">// DCPFeedBufferAckThreshold is representative of the percentage of\u003c/span>","\u003cspan class=\"hljs-comment\">// the connection_buffer_size when the consumer will ack back to\u003c/span>","\u003cspan class=\"hljs-comment\">// the producer.\u003c/span>","\u003cspan class=\"hljs-keyword\">var\u003c/span> DCPFeedBufferAckThreshold = \u003cspan class=\"hljs-type\">float32\u003c/span>(\u003cspan class=\"hljs-number\">0.8\u003c/span>)"]},"cbft.dataUpdate":{"id":"cbft.dataUpdate","repo":"cbft","path":"pindex_bleve.go","title":"dataUpdate() — on the DCP goroutine","start":2806,"end":2852,"highlight":[2833,2836],"url":"https://github.com/couchbase/cbft/blob/c467517403c82355b394b359550979601fe5a031/pindex_bleve.go#L2806-L2852","lines":["\u003cspan class=\"hljs-function\">\u003cspan class=\"hljs-keyword\">func\u003c/span> \u003cspan class=\"hljs-params\">(t *BleveDestPartition)\u003c/span>\u003c/span> dataUpdate(partition \u003cspan class=\"hljs-type\">string\u003c/span>,","\tkey []\u003cspan class=\"hljs-type\">byte\
